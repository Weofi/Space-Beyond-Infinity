name: Wiki freshness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check generated wiki
        run: python3 Tools/Docs/build_wiki.py --check
      - name: Check wiki generator behavior
        run: python3 Tools/Docs/test_wiki.py
