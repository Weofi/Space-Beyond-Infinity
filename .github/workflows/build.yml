name: Unity Build

on:
  push:
    branches:
      - main
  # Optional: Erlaube auch das manuelle Starten über den GitHub-Tab "Actions"
  workflow_dispatch:

jobs:
  build:
    name: Build for Windows 🪟
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      # 1. Repository auschecken
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true # Falls du Git LFS für große Dateien nutzt

      # 2. Cache nutzen, damit zukünftige Builds schneller gehen
      - name: Load Library cache
        uses: actions/cache@v4
        with:
            path: Library
            key: library-build-windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
            restore-keys: |
              library-build-windows-

      # 3. Das eigentliche Kompilieren mit GameCI
      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: StandaloneWindows64

      # 4. Die gebauten Dateien als Artefakt hochladen
      - name: Upload build result
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/StandaloneWindows64

      # 5. Automatisch als GitHub Release veröffentlichen (wenn ein Tag gepusht wird)
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') # Reagiert auf Tags wie v1.0.0
        with:
          files: build/StandaloneWindows64/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
