name: Unity Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A personal license fails when too many Unity instances activate at once.
concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both targets build on Linux (Mono backend), macOS runners are not needed.
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64
          - StandaloneOSX
    steps:
      # Extra swap as headroom for a full Library reimport (cache miss).
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          swap-storage: false

      - name: Enlarge swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      - name: Build project
        id: build1
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: Voidward

      # Unity 6000.6 inside the game-ci container sporadically gets SIGKILLed (exit 137)
      # at random points (seconds after start, or mid shader compile). Not an OOM: memory
      # peaks at ~7 GB of 16 GB, swap stays unused, dmesg has no OOM entry. Just retry.
      # game-ci leaves its builder scripts in Assets/Editor; a retry refuses a dirty tree.
      - name: Clean up failed attempt
        if: steps.build1.outcome == 'failure'
        run: sudo rm -rf Assets/Editor build && git status --porcelain

      - name: Build project (retry 1)
        id: build2
        if: steps.build1.outcome == 'failure'
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: Voidward

      - name: Clean up failed retry
        if: steps.build2.outcome == 'failure'
        run: sudo rm -rf Assets/Editor build && git status --porcelain

      - name: Build project (retry 2)
        if: steps.build2.outcome == 'failure'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: Voidward

      - name: Fix macOS executable bit
        if: matrix.targetPlatform == 'StandaloneOSX'
        run: sudo chmod -R +x build/StandaloneOSX/*.app/Contents/MacOS

      # Release assets must be files, not folders (.app and _Data are directories).
      - name: Zip build
        run: |
          cd build/${{ matrix.targetPlatform }}
          zip -qry "$GITHUB_WORKSPACE/Voidward-${{ matrix.targetPlatform }}.zip" .

      # archive: false uploads the zip as-is (no zip-in-zip download); artifact name = file name.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          path: Voidward-${{ matrix.targetPlatform }}.zip
          archive: false

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      # skip-decompress keeps the build zips intact (they would be extracted otherwise).
      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: Voidward-StandaloneWindows64.zip
          path: dist/win
          skip-decompress: true

      - name: Download macOS build
        uses: actions/download-artifact@v8
        with:
          name: Voidward-StandaloneOSX.zip
          path: dist/mac
          skip-decompress: true

      - name: Name release files
        run: |
          mkdir release
          mv dist/win/* release/Voidward-Windows.zip
          mv dist/mac/* release/Voidward-macOS.zip
          ls -la release

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Voidward Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*.zip
