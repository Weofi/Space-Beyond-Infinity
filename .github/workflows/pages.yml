name: Wiki on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'CLAUDE.md'
      - 'Assets/Design/DESIGN.md'
      - 'Assets/_Project/Art/CREDITS.md'
      - 'Docs/**'
      - 'Tools/Docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check generated wiki
        run: python3 Tools/Docs/build_wiki.py --check
      - name: Assemble site
        run: bash Tools/Docs/pages_site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
