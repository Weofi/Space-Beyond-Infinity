<script>
'use strict';
const wiki = /* WIKI_DATA */;
const $ = selector => document.querySelector(selector);
const esc = text => String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const imagePath = path => '../../' + path;
const pageMap = new Map(wiki.pages.map(page => [page.id, page]));
const playerPages=wiki.pages.filter(page=>page.audience==='player');
const developerPages=wiki.pages.filter(page=>page.audience==='developer');
let currentPage = 'home';
let gallery = [];
let lastFocus = null;
const mobileLayout=matchMedia('(max-width:800px)');
function syncMenuAccessibility(){ $('#sidebar').inert=mobileLayout.matches&&!$('#sidebar').classList.contains('open'); }
mobileLayout.addEventListener('change',syncMenuAccessibility);
function navLink(id, title, number) { return `<a class="nav-link${currentPage===id?' active':''}" href="#${id}" ${currentPage===id?'aria-current="page"':''}><span class="nav-num">${number}</span>${esc(title)}</a>`; }
function drawNav(){
  const playing=currentPage==='home'||pageMap.get(currentPage)?.audience==='player';
  const pages=playing?playerPages:developerPages;
  $('#nav').innerHTML=`<div class="audience-switch"><a href="#home" ${playing?'aria-current="true"':''}>Spielen</a><a href="#developer" ${!playing?'aria-current="true"':''}>Entwickeln</a></div>`+navLink(playing?'home':'developer',playing?'Was kann ich tun?':'Projektübersicht','⌂')+`<div class="nav-label">${playing?'Dein Spielerhandbuch':'Entwicklerwissen'}</div>`+pages.map((p,i)=>navLink(p.id,p.title,String(i+1).padStart(2,'0'))).join('');
}
function figure(image){
  const id = gallery.push(image)-1;
  return `<figure class="shot"><button data-image="${id}" aria-label="${esc(image.alt)} – vergrößern"><img src="${esc(imagePath(image.path))}" alt="${esc(image.alt)}" loading="lazy"><span class="zoom-label">Bild vergrößern ↗</span></button><figcaption>${esc(image.caption)}</figcaption></figure>`;
}
function developerHome(){
  const h = wiki.home;
  const heroId = gallery.push({path:h.image,caption:h.caption,alt:'Eisplanet in sechs Spielansichten vom Boden bis zum Orbit'})-1;
  return `<span class="eyebrow">Voidward / Wissensbasis</span><h1>${esc(h.title)}</h1><p class="lede">${esc(h.summary)}</p><div class="tags"><span class="tag">Unity 6 · Co-op Roguelite</span><span class="tag">Code & Wissen gemeinsam versioniert</span></div>
  <section class="hero" aria-label="Einstieg"><div class="hero-copy"><span class="eyebrow">Das Spiel verstehen</span><h2>Eine Crew.<br>Ein weiter Weg nach Hause.</h2><p>Von M33 bis Sol: erkunden, den Antrieb verbessern und gemeinsam weiterfliegen. Beginne mit dem Spielkonzept oder springe direkt ins passende System.</p><a class="primary" href="#journey">Die Reise kennenlernen →</a></div><figure class="hero-photo"><button data-image="${heroId}" aria-label="Eisplanet-Aufnahmen vergrößern"><img src="${esc(imagePath(h.image))}" alt="${esc(gallery[heroId].alt)}"></button><figcaption>${esc(h.caption)}</figcaption></figure></section>
  <div class="section-head"><h2>Wo möchtest du einsteigen?</h2><span>7 Themen · eine gemeinsame Quelle</span></div>
  <div class="cards">${developerPages.map((p,i)=>`<a class="card" href="#${p.id}"><span class="card-number">${String(i+1).padStart(2,'0')} / ${esc(p.eyebrow)}</span><h3>${esc(p.title)}</h3><p>${esc(p.summary)}</p><span class="card-cta">Kapitel öffnen →</span></a>`).join('')}</div>
  <footer class="home-footer"><span>Technische Referenz aus AGENTS.md · Bilder mit Herkunft und Einordnung.</span><span><a href="README.md">Markdown</a><a href="#maintenance">Wie wird gepflegt?</a></span></footer>`;
}
function playerHome(){
  const h=wiki.guide;
  const heroId=gallery.push({path:wiki.home.image,caption:wiki.home.caption,alt:'Eisplanet vom Boden bis zum Orbit – Entwicklungsaufnahmen'})-1;
  return `<span class="eyebrow">Voidward / Spielen lernen</span><h1>${esc(h.title)}</h1><p class="lede">${esc(h.summary)}</p><div class="tags"><span class="tag">Für deine erste Runde</span><span class="tag">Solo oder mit 1–3 Mitspielern</span></div>
  <section class="hero player-hero" aria-label="Hier anfangen"><div class="hero-copy"><span class="eyebrow">Dein erstes Ziel</span><h2>Ein kleiner Ausflug.<br>Mit Beute zurück.</h2><p>Lerne die Nostos kennen, starte mit deiner Dart und sammle deinen ersten Fund. Die Anleitung begleitet dich vom Hauptmenü bis zurück an Bord.</p><a class="primary" href="#first-steps">Meine erste Expedition starten →</a></div><figure class="hero-photo"><button data-image="${heroId}" aria-label="Aufnahmen des Eisplaneten vergrößern"><img src="${esc(imagePath(wiki.home.image))}" alt="${esc(gallery[heroId].alt)}"></button><figcaption>${esc(wiki.home.caption)}</figcaption></figure></section>
  <section class="intent-grid" aria-label="Direkt zur passenden Hilfe"><a href="#controls"><small>Eine Taste gesucht?</small><strong>Steuerung nachschlagen →</strong></a><a href="#help"><small>Etwas funktioniert nicht?</small><strong>Die nächste Lösung finden →</strong></a></section>
  <div class="section-head"><h2>Was möchtest du als Nächstes tun?</h2><span>Schritt für Schritt ins Spiel</span></div>
  <div class="cards">${playerPages.map((p,i)=>`<a class="card" href="#${p.id}"><span class="card-number">${String(i+1).padStart(2,'0')} / ${esc(p.eyebrow)}</span><h3>${esc(p.title)}</h3><p>${esc(p.summary)}</p><span class="card-cta">So geht’s →</span></a>`).join('')}</div>
  <aside class="note"><strong>Worum geht es eigentlich?</strong> Ihr wollt von M33 nach Sol zurück. Erkundet fremde Welten, verbessert euren gemeinsamen Warp-Antrieb und senkt die Home ETA. Deine ersten Schritte dürfen klein sein: erst sicher fliegen und zurückkommen, dann weiterreisen.</aside>
  <footer class="home-footer"><span>Spielerhandbuch · Standardsteuerung · vorhandene Entwicklungsaufnahmen</span><span><a href="#developer">Zum Entwicklerbereich</a><a href="README.md">Markdown lesen</a></span></footer>`;
}
function guideSection(section){
  return `<section class="guide-section" id="${section.id}"><h2>${esc(section.title)}</h2>
  ${section.text?`<p>${esc(section.text)}</p>`:''}
  ${section.steps?`<ol class="guide-steps">${section.steps.map((step,i)=>`<li><span class="step-number" aria-hidden="true">${i+1}</span><div><h3>${esc(step.title)}</h3><p>${esc(step.text)}</p></div></li>`).join('')}</ol>`:''}
  ${section.controls?`<div class="control-table"><table><thead><tr><th scope="col">Taste / Begriff</th><th scope="col">Das passiert</th></tr></thead><tbody>${section.controls.map(([key,text])=>`<tr><th scope="row"><kbd>${esc(key)}</kbd></th><td>${esc(text)}</td></tr>`).join('')}</tbody></table></div>`:''}
  ${section.flow?`<ol class="flow" aria-label="Reihenfolge">${section.flow.map(step=>`<li>${esc(step)}</li>`).join('')}</ol>`:''}
  ${section.cards?`<div class="guide-cards">${section.cards.map(card=>`<div class="guide-card"><h3>${esc(card.title)}</h3><p>${esc(card.text)}</p>${card.page?`<a href="#${card.page}">So geht’s →</a>`:''}</div>`).join('')}</div>`:''}
  ${section.result?`<div class="guide-result"><strong>Danach weißt du / siehst du:</strong><p>${esc(section.result)}</p></div>`:''}
  ${section.note?`<aside class="note">${esc(section.note)}</aside>`:''}
  ${section.image?figure(section.image):''}
  ${section.related?`<div class="related"><span>Passend dazu</span>${section.related.map(id=>`<a href="#${id}">${esc(pageMap.get(id).title)} →</a>`).join('')}</div>`:''}
  </section>`;
}
function playerView(page){
  const index=playerPages.indexOf(page);
  return `<span class="eyebrow">Spielerhandbuch / ${esc(page.eyebrow)}</span><h1>${esc(page.title)}</h1><p class="lede">${esc(page.summary)}</p>
  <div class="learning-goal"><span>Dein Ziel</span><p>${esc(page.goal)}</p></div>
  ${page.quick?`<div class="quick-keys">${page.quick.map(([key,text])=>`<span><kbd>${esc(key)}</kbd>${esc(text)}</span>`).join('')}</div>`:''}
  <nav class="chapter-jumps" aria-label="Abschnitte in diesem Kapitel">${page.sections.map(s=>`<a href="#${page.id}/${s.id}">${esc(s.title)}</a>`).join('')}</nav>
  <article class="player-guide">${page.sections.map(guideSection).join('')}</article>
  <details class="guide-sources"><summary>Stand & Quellen dieser Anleitung</summary><p>Mit dem lokalen Code abgeglichen: ${esc(wiki.guide.checked)}. Kein neuer vollständiger Spieltest. Die Bilder sind mit ihrer Herkunft beschriftet.</p><ul>${page.sources.map(source=>`<li><a href="../../${esc(source)}">${esc(source)}</a></li>`).join('')}</ul></details>
  <footer class="page-next">${index?`<a href="#${playerPages[index-1].id}">← ${esc(playerPages[index-1].title)}</a>`:'<a href="#home">← Was kann ich tun?</a>'}${index<playerPages.length-1?`<a href="#${playerPages[index+1].id}">${esc(playerPages[index+1].title)} →</a>`:'<a href="#home">Zum Spielerhandbuch →</a>'}</footer>`;
}
function pageView(page){
  const index = developerPages.indexOf(page);
  return `<span class="eyebrow">${String(index+1).padStart(2,'0')} / ${esc(page.eyebrow)}</span><h1>${esc(page.title)}</h1><p class="lede">${esc(page.summary)}</p><div class="tags"><span class="tag">Projektwissen</span><span class="tag">Quelle: AGENTS.md</span></div>
  <section id="overview" aria-label="Auf einen Blick"><h2>Auf einen Blick</h2><div class="highlights">${page.highlights.map(([title,body])=>`<div class="highlight"><h3>${esc(title)}</h3><p>${esc(body)}</p></div>`).join('')}</div></section>
  ${page.flow?`<h2 id="flow">${page.id==='journey'?'Die Route':'Der Zusammenhang'}</h2><ol class="flow" aria-label="Ablauf">${page.flow.map(step=>`<li>${esc(step)}</li>`).join('')}</ol>`:''}
  ${page.note?`<aside class="note">${esc(page.note)}</aside>`:''}
  ${page.images.length?`<section id="images" class="gallery" aria-label="Visuelle Beispiele"><h2>Im Bild</h2>${page.images.map(figure).join('')}</section>`:''}
  <div class="ref-header" id="reference"><h2>Technische Referenz</h2><p>Die vollständigen Projektnotizen. Umfangreiche Einträge lassen sich einzeln aufklappen; alle Angaben stammen aus dem dokumentierten Übergabestand.</p><div class="ref-actions"><button id="expand">Alles aufklappen</button><button id="collapse">Alles einklappen</button></div></div>
  <article class="reference">${page.html}</article>
  <footer class="page-next">${index>0?`<a href="#${developerPages[index-1].id}">← ${esc(developerPages[index-1].title)}</a>`:'<a href="#developer">← Projektübersicht</a>'}${index<developerPages.length-1?`<a href="#${developerPages[index+1].id}">${esc(developerPages[index+1].title)} →</a>`:'<a href="#developer">Zur Projektübersicht →</a>'}</footer>`;
}
function drawToc(page){
  $('#toc').hidden = !page;
  if(!page) return;
  if(page.audience==='player'){
    $('#toc').innerHTML='<p class="toc-title">In dieser Anleitung</p>'+page.sections.map(s=>`<a href="#${page.id}/${s.id}">${esc(s.title)}</a>`).join('')+`<a class="source" href="${page.id}.md">Als Markdown lesen ↗</a>`;
    return;
  }
  const items = [{id:'overview',title:'Auf einen Blick'},...(page.flow?[{id:'flow',title:page.id==='journey'?'Die Route':'Der Zusammenhang'}]:[]),...(page.images.length?[{id:'images',title:'Im Bild'}]:[]),{id:'reference',title:'Technische Referenz'},...page.toc];
  $('#toc').innerHTML='<p class="toc-title">Auf dieser Seite</p>'+items.map(item=>`<a href="#${page.id}/${item.id}">${esc(item.title)}</a>`).join('')+`<a class="source" href="${page.id}.md">Markdown ansehen ↗</a><a href="../../AGENTS.md">Quelle bearbeiten ↗</a>`;
}
function navigate(){
  const [requested,anchor] = location.hash.slice(1).split('/');
  const id = requested==='developer'?'developer':pageMap.has(requested)?requested:'home';
  const samePage = currentPage===id && $('#main').children.length;
  currentPage=id;
  if(!samePage){
    gallery=[];
    const page=pageMap.get(id);
    $('#layout').classList.toggle('home',!page);
    $('#main').innerHTML=page?(page.audience==='player'?playerView(page):pageView(page)):(id==='developer'?developerHome():playerHome());
    $('#crumb').textContent=page?page.title:id==='developer'?'Entwicklerbereich':'Spielerhandbuch';
    document.title=(page?page.title:'Projekt-Wiki')+' · Voidward';
    drawToc(page);
    drawNav();
    window.scrollTo(0,0);
  }
  if(anchor){
    const target=document.getElementById(anchor);
    if(target && $('#main').contains(target)){
      if(target.tagName==='DETAILS')target.open=true;
      target.scrollIntoView({block:'start'});
    }
  }else if(samePage)window.scrollTo(0,0);
  closeMenu();
}
function closeMenu(){ $('#sidebar').classList.remove('open'); $('#menu').setAttribute('aria-expanded','false'); syncMenuAccessibility(); }
function openSearch(){ lastFocus=document.activeElement; $('#search-dialog').showModal(); $('#search').focus(); search(); }
function search(){
  const query=$('#search').value.trim().toLocaleLowerCase('de');
  const terms=query.split(/\s+/).filter(Boolean);
  const results=[...playerPages,...developerPages].filter(p=>terms.every(term=>(p.title+' '+p.summary+' '+p.search+' '+p.images.map(i=>i.caption).join(' ')).toLocaleLowerCase('de').includes(term)));
  $('#results').innerHTML=results.length?results.map(p=>{
    const text=p.search.replace(/<!--[^]*?-->/g,'').replace(/[#*`]/g,'').replace(/\s+/g,' ');
    const position=query?Math.max(0,text.toLocaleLowerCase('de').indexOf(terms[0])-60):0;
    const snippet=query?text.slice(position,position+190):p.summary;
    return `<a class="result" href="#${p.id}" data-result><small class="result-audience">${p.audience==='player'?'Spielen':'Entwickeln'}</small><strong>${esc(p.title)}</strong><p>${esc(snippet)}${query?' …':''}</p></a>`;
  }).join(''):'<p class="search-empty">Keine Treffer. Versuche einen anderen Begriff, zum Beispiel „warp“, „cryo“ oder „planet“.</p>';
}
$('#open-search').addEventListener('click',openSearch);
$('#search').addEventListener('input',search);
$('#menu').addEventListener('click',()=>{const open=$('#sidebar').classList.toggle('open');$('#menu').setAttribute('aria-expanded',String(open));syncMenuAccessibility();});
$('#theme').addEventListener('click',()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';setTheme(theme);try{localStorage.setItem('voidward-wiki-theme',theme);}catch{}});
function setTheme(theme){document.documentElement.dataset.theme=theme;$('#theme').textContent=theme==='dark'?'Hell':'Dunkel';}
try{setTheme(localStorage.getItem('voidward-wiki-theme')||'light');}catch{setTheme('light');}
document.addEventListener('keydown',event=>{
  if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(!$('#search-dialog').open&&!$('#lightbox').open)openSearch();}
  if(event.key==='Escape')closeMenu();
});
document.addEventListener('click',event=>{
  if(event.target.closest('.skip')){event.preventDefault();$('#main').focus();return;}
  const close=event.target.closest('[data-close]');
  if(close){document.getElementById(close.dataset.close).close();return;}
  const image=event.target.closest('[data-image]');
  if(image){const item=gallery[Number(image.dataset.image)];lastFocus=image;$('#large-image').src=imagePath(item.path);$('#large-image').alt=item.alt;$('#large-caption').textContent=item.caption;$('#lightbox').showModal();return;}
  const source=event.target.closest('[data-page]');
  if(source){event.preventDefault();location.hash=source.dataset.page;}
  if(event.target.closest('[data-result]'))$('#search-dialog').close();
  if(event.target.closest('#expand'))document.querySelectorAll('.reference details').forEach(detail=>detail.open=true);
  if(event.target.closest('#collapse'))document.querySelectorAll('.reference details').forEach(detail=>detail.open=false);
  if(!event.target.closest('.sidebar')&&!event.target.closest('#menu'))closeMenu();
});
for(const dialog of document.querySelectorAll('dialog')){
  dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();}});
  dialog.addEventListener('close',()=>{if(lastFocus&&document.contains(lastFocus))lastFocus.focus();});
}
window.addEventListener('hashchange',navigate);
window.addEventListener('beforeprint',()=>document.querySelectorAll('details').forEach(d=>{d.dataset.printOpen=String(d.open);d.open=true;}));
window.addEventListener('afterprint',()=>document.querySelectorAll('details').forEach(d=>d.open=d.dataset.printOpen==='true'));
navigate();
</script>
</body>
</html>
