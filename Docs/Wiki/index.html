>UIRoot\u003c/code>, \u003ccode>MenuScreens\u003c/code>, \u003ccode>HudView\u003c/code>, \u003ccode>InventoryView\u003c/code>, \u003ccode>TradeView\u003c/code>). Namespace \u003ccode>Voidward.UI\u003c/code> has enum \u003ccode>Screen\u003c/code> → write \u003ccode>UnityEngine.Screen\u003c/code> explicitly.\u003c/li>\u003cli>Meta progression (to be redefined in #47 without runs/loops): \u003ccode>Progression/Meta.cs\u003c/code> (Memory fragments = \u003ccode>Memories\u003c/code>, perks, local save; \u003ccode>Meta.ResetAll()\u003c/code>; saves from before #112 are migrated by a raw-JSON rename in \u003ccode>SaveSystem.Load(key, migrate)\u003c/code>, run save v4 likewise for Credits -&gt; \u003ccode>Salvage\u003c/code>).\u003c/li>\u003c/ul>", "toc": [{"id": "ref-0", "title": "Stack"}, {"id": "ref-1", "title": "Layout (Assets/_Project)"}, {"id": "ref-2", "title": "Architecture"}, {"id": "ref-3", "title": "Journey structure (#46)"}, {"id": "ref-4", "title": "RunManager"}, {"id": "ref-5", "title": "Warp drive (#78)"}, {"id": "ref-6", "title": "Flown galaxy warp (#79)"}, {"id": "ref-7", "title": "Flight home + the Rift (#81, Rift dropped 2026-10-17, removed in #132)"}, {"id": "ref-8", "title": "System cruise + hops (#80)"}, {"id": "ref-9", "title": "Jump zones (#108)"}, {"id": "ref-10", "title": "Time loop (#86, dropped 2026-10-17, still in the code until #132 removes it)"}, {"id": "ref-11", "title": "Home ship Nostos (#49)"}, {"id": "ref-12", "title": "Crew body (#95)"}, {"id": "ref-13", "title": "Planets (#17, #21)"}, {"id": "ref-14", "title": "Light, sky, VFX (#96)"}], "search": "\u003c!-- Generated by Tools/Docs/build_wiki.py from AGENTS.md. Do not edit. -->\n\n# Architecture & systems\n\n[Wiki home](README.md) | [Edit source](../../AGENTS.md)\n\n## Stack\n\n- Unity 6000.6.5f1, URP (`Assets/SourceFiles/Settings/PC_RPAsset`, Forward+), Input System only, TMP (ugui 2.x)\n- Netcode for GameObjects 2.13.3 + Unity Transport; Facepunch.Steamworks (`Assets/Plugins/Steamworks`, define `VOIDWARD_STEAM`, AppID 480)\n- Cinemachine 3 (`Unity.Cinemachine`), Multiplayer Play Mode 3.0\n- Blender 5.2 LTS (optional DCC tool, headless via CLI, no MCP). See \"Blender (asset scripts)\".\n- Developed on two machines: Mac (macOS + WebGL build modules) and Windows PC (Windows build module). See \"Cross-platform (Mac + Windows)\".\n\n## Layout (`Assets/_Project`)\n\n- `Scripts/\u003cModule>` with one asmdef each. Dependency order: Core ← Data ← Combat/Inventory/Planet ← Ship ← Player ← AI/World ← Progression/UI; Networking separate.\n- `Editor/ContentBuilder.cs` (materials, all ScriptableObject data, balance values), `PrefabBuilder.cs` (all procedural meshes + prefabs + network prefab list), `SceneBuilder.cs` (scene `Scenes/Voidward.unity`, lighting, volume, project settings), `PlanetBuilder.cs` (planet presets `Data/Planets`, planet/ocean materials, detail textures, scene `Scenes/PlanetPreview.unity`), `BuildMenu.cs`.\n- `Shaders/`: VW_ToonFlat (main lit), VW_Planet (triplanar terrain, elevation/slope/region ramp, planet-centered via `_PlanetCenter`), VW_Ocean (depth/opaque-texture water), VW_NebulaSkybox, VW_Atmosphere (depth-based ray-marched scattering shell, Cull Front + ZTest Always), VW_Clouds (procedural cloud shell), VW_Collapse, VW_Unlit, VW_AdditiveParticle, VW_Glass.\n- **All content is generated.** Change the builder code, then run menu `Voidward/Build All Content`. Manual edits to generated prefabs/scene/data are overwritten.\n\n## Architecture\n\n- Session: `SessionManager` (host/join/transport switch, Steam → UTP fallback), `TransportConfig` (CLI: `-transport=utp|steam -autohost -autojoin=IP -autostart -players=N`).\n- `DirectorSpawner` spawns the GameDirector prefab (`RunManager` + `CombatNet`) on `SessionManager.ServerStarted`.\n- Journey structure (#46): `GalaxyDef` (5 assets, `ContentBuilder.BuildGalaxies`: route, distance, biome pool, enemy mix, `EnemyTier`/`LootTier`, palette, `DriveTier` for #73) -> `GalaxyGenerator.Generate(runSeed, galaxy)` = deterministic `GalaxyPlan` with 4-6 `StarSystem`s (`SystemKind`: Planetary, AsteroidField, Anomaly, Enclave (exactly one, Warden + hoard), Nomads (trader station), Void; system 0 = arrival, galaxy 1 system 0 = \"Wormhole Exit\" with station). `SystemLayout.Build(seed, galaxy, kind, station)` = the system corridor (planets, fields, wrecks, boss pos). Clients regenerate everything from the synced `RunSeed`/`GalaxyIndex`/`SystemIndex` (`RunManager.Plan`, `CurrentSystem`).\n- `RunManager`: run lifecycle (start / continue / end), galaxy+system flow, warp (no button since #108: `ServerJump(target, lead)` from a jump zone, `ServerWarp(target)` for cheats/dev; `WarpNextGalaxy` = -1 one-way, from galaxy 5 = the flight home (#81); `ServerGoto(g, s)` for dev), ships/players, respawns, run clock (`RunTime`), stats, cheats (`ExecuteCheat(int)`). `SystemDirector` (plain server class): system content (`PopulatePlanet` POIs, wrecks, station), enemy spawning, events, Warden enclave. Revisited systems keep worlds/nodes/nests but spawn no crates (`VisitedMask`). Suspend save: `RunState` (versioned JSON, players by name, ships with modules/cargo) via `RunSave` (one slot `vw_run.json`), written on galaxy entry and `SessionManager.BeforeLeave` (host leaves/quits, also when stopping Play Mode), deleted by `EndRun`; lobby \"Continue Run\" -> `SessionManager.ContinueRun`. UI: `GalaxyMapView` (key M, `VwInput.Map`), HUD system meter + run clock.\n- Warp drive (#78): `WarpDrive` (World, on the GameDirector; since #49 the Nostos's drive: worked on aboard it, `AtShip`): `Tiers` (NetworkList, tier per `DriveSlot` Core/Navigation/Cooling/Tank, 1-6) + `Exotic` (tank). Parts are items (`ItemKind.DriveComponent`, `ItemDef.Drive` -> `DriveComponentDef`, ids `drive_\u003ccore|nav|cooling|tank>_mk\u003c1-6>`), swapped/loaded via `InstallFromInventoryServerRpc` / `LoadExoticServerRpc` near a ship. Balance in `WarpDriveDef` (core speeds, tank sizes, nav/cooling penalties) + `GalaxyDef.LegLength` (minutes with a balanced Mk I) / `LegFuel`; `DriveMath` = pure ETA/fuel math (`Minutes`, `Fuel`, `Eta`, `Delta`; stop `DriveMath.Home` = 6). Galaxy warps (`WarpNextGalaxy`, `WarpSkipGalaxy` = -2) check and burn Exotic Matter in `RunManager.FuelOk/ServerWarp`. UI: inventory tab *Warp Drive* (`EventBus.RaiseDrivePanelRequested`), galaxy map ETA/fuel/skip, HUD ETA line, cockpit via `GameState.HomeEta`. Save `RunState` v2 (`DriveTiers`, `Exotic`; v1 loads as Mk I).\n- Flown galaxy warp (#79): `WarpFlight` (World, on the GameDirector): `RunManager.ServerWarp` to a galaxy stop -> `BeginWarpFlight` (director cleared) -> `WarpFlight.ServerBegin(from, to, lead)` -> ... -> `ServerArrive` -> `RunManager.ServerArrive(stop)` (`WarpTo` or the homecoming). Floating origin: ships stay near x = 0 (`WarpBubble.Axis` = +X), the corridor streams past; route length = model minutes / build factor / `BalancedFactor` x full-throttle speed (`VisualSpeed` per core tier), so a flight at the nav's safe speed in fields and full speed elsewhere takes `DriveMath.Minutes`. `WarpRoute` (pure, deterministic per flight seed, obstacles generated per 1 km chunk, id = chunk * 1024 + i): legs, zones (`WarpZone` ExitHalo/Void/ArrivalHalo, 12 % halos per leg), `WarpHazard` (Rock, Debris, Comet, Rift, GravityWell, StrayRock), 3 `WarpSignal`s per leg, `PatrolIn(chunk)`. Server state as NetworkVariables (Progress, Throttle, Heat, Cruise, Stalled, Overheated, Lead, Hazard, DroppedOut, DropSignal, ResumeCountdown, VisitedSignals, `Destroyed` list); fuel burns along the route (a mid-flight suspend save refunds it, the crew continues before the warp). `WarpBubble` (Core, static) carries the local state to Ship/Player: `ShipFlight.WarpStep` (lead: nose/strafe -> lateral velocity, cone 35 deg, corridor walls, `WarpBubble.Pull`; others: formation slot `WarpBubble.FormationOffset`), `ShipSeat.TickPilot` feeds W/S, X, C, G (`VwInput.Cruise/DropOut`), `PlayerPawn` FOV boost. `WarpCorridorView` (client, every peer): obstacle GameObjects inside the scanner range (`ScanRange` = nav fraction x speed x 2.6 s), `WarpObstacleProxy` trigger colliders for shots (like `AsteroidRock`), impact detection for every ship the peer simulates (`ShipFlight.IsSimulating`) -> `ReportImpactServerRpc`, gravity well pull, signal beacon, gas cloud, speed streaks. Sky: `SystemVisuals` swings the destination galaxy ahead and grows it with the progress. Signal sites spawn through `SystemDirector` (`SpawnWreckSite`, `SpawnRoguePlanet`, `TrackedCount`/`TakeTracked`). HUD: route meter + zone, throttle/heat/ETA/Exotic/cruise/signal line, centre warnings, ship card speed = warp throttle.\n- Flight home + the Rift (#81, **Rift dropped 2026-10-17, removed in #132**): the galaxy warp 5 -> `DriveMath.Home` (`WarpFlight.IsFinale`, ~5 min with the Home Drive, LMC `LegLength` 1200 / speed 240). `RiftStart` (NetworkVariable, route m) = `FinaleSeconds` (300 s) of planned flight before the end, walked back over the real zones (`FinaleStartOf`; 0 with the Home Drive, the last ~5 min with weaker drives); `WarpRoute(finaleStart)` makes that stretch denser (void: stray rocks, rift walls, comets, wells), drops signals in/near it and the arrival welcome party. Server: `ServerRift` wakes the Rift at `RiftStart` with a 40 s lead, moves it at 0.8 -> 1.02 x the build's planned speed at the Rift's own position (`PlannedSpeedAt`: fields = nav fraction, void = sustain, so weak drives are not unfair in halos) -> `RiftGap`/`RiftSpeed` NetworkVariables; close (\u003c `RiftCloseSeconds` 12 s) = warning + extra heat; at 55 % of the chase `ServerWardenWave` (tough interceptors of the last galaxy, they interdict); drop-outs are blocked while it chases; gap \u003c= 0 -> `RunManager.ServerRiftCaught` (the time loop, #86). Arrival -> `ServerArrive(Home)` -> homecoming result (placeholder for the Sol approach, #74). Client: `WarpCorridorView.UpdateRift` = VW_Collapse maw (`ContentCatalog.CollapseMaterial`) + halo ring + tendrils behind the bubble, distance/size by `RiftSeconds`, violet pulse/shake + violet streaks when close; HUD rift pip on the route meter, \"THE RIFT n s BEHIND\" line, \"THE RIFT IS CLOSING IN\" centre warning, objective \"THE FLIGHT HOME\".\n- System cruise + hops (#80): `ShipFlight` cruise (authority of a piloted ship): hold C (`ShipSeat` -> `SetCruiseInput`) for `CruiseSpool` 2 s, then `DriveMath.CruiseSpeed` per core tier (`WarpDriveDef.CruiseSpeed` 1-3 km/s, `WarpBubble.CoreTier` written by `WarpDrive`), owner-written `CruiseNet` (`CruiseMode`). Ends: X/S/C, a hull hit (`OnHullHit` = interdiction, blocks 3 s), engaged enemies within `CombatLockRange` (`Threat.EngagedNear`), a sphere cast ahead (collision alert), and towards a planet the closing speed eases down to normal flight at `GravitySource.CruiseRadius` (gravity field, at least radius + 1 km; `CruiseClearance`). Gravity + combat lock also hold jump zones (`RunManager.JumpBlockFor`). System warps are flown hops: `WarpFlight.ServerBeginHop` (`TargetSystem` >= 0, `IsHop`), `WarpRoute(hop: true)` = one leg, 20 % system outskirts at each end with 40 % rock density, no signals/welcome party, `ZoneName`; length from `DriveMath.HopMinutes` (`WarpDriveDef.HopMinutes` 1.5 x factor / speed^0.35), no Exotic Matter; arrival `RunManager.ServerArriveSystem` -> system edge. Interdiction in any warp: engaged enemies within `WarpFlight.InterdictRange` of the lead ship or enemy hits on its hull stop the bubble (`[Warp] interdicted`). Normal flight: module thrust/top speed capped at `ShipCore.NormalFlightCap` (+30 %).\n- Jump zones (#108): no warp button or countdown. `SystemLayout.AddJumpZones(plan, system)` (also in `GalaxyGenerator.Layout` and `SystemDirector.Enter`) puts `JumpZone`s (Core, `JumpZones` static: `Current`, `Blocks`, `CrewMissing`, `Entering`, `Veil`) on an ellipsoid around the corridor, pushed out until clear of every planet's gravity field: a hop zone to each neighbouring system (`GalaxyPlan` order, aimed like the map), and in the outermost system the Galactic Rim (`WarpNextGalaxy`, normal = `SystemVisuals.DestinationDir`; LMC: `JumpKind.Home` towards `MilkyWayDir`) plus the skip zone (`WarpSkipGalaxy`, beside it, further out). `WarpFlight.Jumps.cs` (partial): server packs a `JumpBlock` per zone into `JumpBlocks` (crew not aboard = a living pawn neither seated nor inside a `GravityVolume`; Exotic Matter/tank; combat/gravity lock via `RunManager.JumpBlockFor`); a piloted ship inside an open zone that crosses its plane cruising, or after `JumpZones.AlignSeconds` (3 s) nose outward, starts the entry (`EntryAt` = server time + `EnterSeconds` 2.6 s: FOV, entry speed lines in `WarpCorridorView`, veil) -> `RunManager.ServerJump` -> `BeginWarpFlight(seamless)` -> `WarpFlight.ServerRebaseIntoBubble` (every ship keeps its offset/attitude to the lead turned so the lead's nose = `WarpBubble.Axis`; ships > 450 m away get a formation slot; the bubble starts in warp cruise at ~nav/sustain x 0.8). End of the route: `ServerBeginExit` holds the flight `ExitSeconds` 0.8 s while the veil rises, then `RunManager.ServerArrive(System)(.., lead)` -> `RegroupOutOfWarp` (rigid transform to `SystemLayout.Arrival(fromSystem)`: inside the zone leading back, nose inward; galaxies: `StartPoint`) + `ShipFlight.ArriveFromWarpRpc` (owner, applied once the bubble state ended: piloted ships cruise in). The veil (`RebaseAt`, `VeilAt` curve, colour by `VeilKind`) is a full-screen image in `UIRoot`. Blocked zones: `ShipFlight.JumpZoneHold` (owner) dumps cruise and holds the ship at the plane. Visuals: `SystemVisuals.BuildJumpZones` (turning beacon ring + motes, additive dots, colour per `JumpKind`); HUD: zone markers with block reason, centre `JumpMessage` (ALIGNING n% / JUMP ZONE HOLDS - reason / WARP ENTRY); galaxy map = navigation only (hop lanes, zone list, galaxy warp ETA/fuel).\n- Time loop (#86, **dropped 2026-10-17, still in the code until #132 removes it**): every run is a loop; `RunManager.Loop` (NetworkVariable, the host's `Meta.Loops` + 1, in `RunState` v3 with the logbook). Story texts are data: `StoryDef` (`ContentCatalog.Story`, `ContentBuilder.BuildStory`: deja-vu radio per loop, radio echoes per galaxy (6 = flight home) with `MinLoop`, crew logbook templates with {loop}/{galaxy}/{eta}/{part}/{ship}, reset banners). Crew logbook: `RunManager.ServerLog(template)` at milestones (loop start, galaxy reached, Warden enclave cleared, better drive part installed (`WarpDrive`), Ark lost, flight home, death, homecoming) -> `EventBus.LogbookEntry` (HUD ticker) + `RunSummary.Log`. Death (crew lost / caught by the Rift) = `EndRun` -> `GamePhase.GameOver` -> every client plays `LoopView.Collapse` (unscaled, `Time.timeScale` slow-mo, violet iris + shutters closing to black, \"THE LOOP RESETS\") -> results screen = the loop's logbook (cause, galaxy, core, Home ETA + best, log) -> host \"New Loop\" (`NewLoopServerRpc` -> `ServerNewLoop` = `ClearRun` + `ServerStartRun`) or Lobby. Start: a player's first loop (`Meta.Loops == 0`) gets the intro cinematic, later loops the short deja-vu (`LoopView.DejaVu`: violet flash + distorted radio, read 0.6 s after the phase change because clients get `Loop` later); echoes play on entering a galaxy this player has reached before (`Meta.Data.BestSector`). Meta: `Meta.Loops` (= `Runs`), `MetaSave.BestEtaMinutes`.\n- Home ship Nostos (#49): `ShipClass.HomeShip` (`ShipCore.IsHome`, `ShipCore.Home`), prefab `Ship_Nostos` from `NostosBuilder` (partial `ContentBuilder`; hull = the Ark asset at 1.5 x by `Tools/Blender/nostos.py`, which also ingests/builds `Nostos_Hall` (corridor kit, one wall mirrored, doors removed, airlock cut) and `Nostos_CryoPod`; `GltfModelSource` imports them with their glTF texture folders). Rooms stern to bow: engine room (warp core + `ShipTerminal.Mode.WarpDrive`, engineer, aft turret), cargo hall (the kit at `NHallZ`, airlock + ramp, fabricator, cargo, `DockHatch`es), cryo bay (`CryoPod` x4), bridge (platform + ramp, Dart fittings, forward turret). The `N*` constants in `NostosBuilder` must match `nostos.py` ROOMS/DOOR/HALL_Z. `RunManager`: the run (and the suspend save, `ShipSave` of class HomeShip) spawns the Nostos first (`SpawnHomeShip`), each player's Dart docks at clamp = player slot, players start seated in it; destroyed = `EndRun` (\"Nostos destroyed\", `StoryDef.ResetHomeLost/LogHomeLost`); fallen players wake at their `CryoPod` (`TryRespawnPoint`, `ShipCore.ServerCryoWake`), `RespawnsLeft` = cryo charges (HUD \"CRYO\"); replacement Darts wait at a free clamp. Docking: `ShipCore.DockedTo`/`DockIndex` (server-written), `ServerDock/ServerUndock`, `RequestDockServerRpc` (authority of a piloted ship within `DockClamp.CaptureRange` 16 m / `CaptureSpeed` 14 m/s of a free clamp, `ShipFlight.TryDock`), `RequestUndockServerRpc` (pilot holds W/up 0.6 s, not in warp) -> `ShipFlight.LaunchFromDockRpc`; a docked ship has its colliders off, its authority pins it to the clamp (`DockStep`) and every peer snaps it in `LateUpdate` (`ShipFlight` runs at execution order -60, before the seated pawns); `ShipSeat.ExitPoint` of a docked ship = the clamp's hatch inside. Warps: `WarpFlight.PickLead` = the Nostos while it exists, only its pilot opens jump zones, `ServerDockForWarp` docks every free small ship under the veil (`PlayerClamp`), docked ships are skipped by formation/regroup/impact code. Heavy landing (`ShipDef.HeavyLanding`, `MaxLandingSlope` 14 deg, `MaxDescentSpeed` 6 m/s): `ShipFlight.HeavyLanding` caps the descent within 120 m and hovers at 10 m over steeper ground (3-point `GroundSlope`). `ShipDef.Hardpoints` (`ShipHardpoint`: name, `ModuleSlot`, position, normal) = data for #50.\n- Crew body (#95): the CoP spacesuit (`Art/Models/Crew/Crew_Suit.fbx`, own UE4-style skeleton, Humanoid) animated by the Quaternius UAL (`Art/Animations/UAL/UAL_Standard.fbx`, CC0, Humanoid, retargeted); `CrewBuilder` (partial `ContentBuilder`) builds the importers, the used clips, `Crew_Locomotion.controller` (Speed signed fwd m/s, Mode 0 ground / 1 air / 2 EVA, Fire trigger; arms layer with mask for held tools) and `Crew_Seated.controller` (sitting loop, IK pass); without the suit FBX the UAL mannequin is the body, without UAL the procedural astronaut. On foot: `CrewAnimator` (Player, every peer, no NetworkAnimator): speed from the pawn's interpolated motion, mode/tool/use from the owner-written `PlayerPawn.Pose` byte (`PackPose`/`UnpackPose`), strafe/backwards = body yaw +-70 deg + reversed locomotion, held tool = a copy of the tool model under the right hand (`HandGrip` from the bind pose). Seated: `CrewSeatPose` (Ship) on `ShipSeat.seatedBody`: eyes aligned to the seat's ViewPoint once per sit-down, wrist IK + finger curl on optional grips (Dart: `Interior/Stick|Throttle/GripIK`, `SeatGrips`), shown for the local pilot too with the head bone collapsed. Crew colour (#60) = the visor rim (`CrewLights.colorProperty` `_RimColor`). Tools (`GearModelBuilder`): `Art/Models/Tools/Tool_\u003cDrill|Blaster|Rifle>.fbx` from `Tools/Blender/crew_assets.py` (barrel +Z, origin = palm on the grip), materials by importer remap (`RemapMaterials`), first-person viewmodels at real size with `PlayerPawn.toolMuzzles` (`ToolMuzzle`), icons rendered from the models; the medkit stays procedural.\n- `GameState` (Core/Contracts.cs): static shared client state (UIOpen, Phase, SectorIndex, Objective…).\n- Authority: pawns + ships use owner-authoritative NetworkTransform; pilot seat transfers ship ownership. Projectiles are server-simulated in `CombatNet` with cosmetic client copies. Planets/asteroids are seed-synced, not replicated.\n- Planets (#17, #21): radius 1.0-1.9 km (`SystemLayout.Min/MaxPlanetRadius`, 0-3 per system depending on its kind, alternating corridor sides). `BiomeDef.Shape` -> `PlanetShapeDef` (noise layers, landforms = volcano/mesa/spire/basin/dome, canyon network incl. river/lava channels, craters, ocean, region colors, sites, atmosphere, clouds, decor style, particles, weather). `PlanetTerrain` = deterministic, thread-safe height field (single source of truth for chunks, colliders, decor, sites, `PlanetBody` queries, `Raycast`). `PlanetVisuals` = 6 quadtrees of chunks (`PlanetMesh.BuildChunk` on worker threads, tangent-adjusted cube mapping, skirts, horizon culling), collider tiles streamed around `TerrainAnchor`s (pawn + ship prefabs), per-chunk props (`PlanetDecor`), set pieces (`PlanetLandmarks`), ocean/atmosphere/cloud shells. `PlanetAmbience` (client) = particles, weather, haze/ambient override, wind audio. `PlanetBody.SiteKinds` (deterministic) drive POI clusters in `SystemDirector.PopulatePlanet` and HUD site markers. `GravitySource.GroundRadiusAt` makes altitude checks terrain-aware. Far terrain has no colliders: use `PlanetBody.Raycast/SurfaceWorldPoint` or `GravitySource.GroundPoint`, not Physics, for spawn/placement. Dev preview: menu `Voidward/Open Planet Preview`, then Play. Planet look (#70): VW_Planet = soft wrap lighting (no toon bands), procedural macro noise (never fades), cavity AO from chunk UV1.x (mesh Laplacian), cliff strata; VW_Ocean = depth absorption, reflects the planet's own sky (`_SkyColor`/`_HorizonColor`), distance-dependent GGX glint, shore foam, `PlanetShapeDef.Lava` switches to the crust/crack lava mode; VW_Clouds = soft edges + sun-offset self shadow. Planets 3.0 (#115): `PlanetTerrain` erosion (`PlanetShapeDef.ErosionDepth/Scale/Octaves/Slope/Branching`, preset helper `PlanetBuilder.Erosion`) = downhill branching gullies from jittered 3D plane-wave cells, steered by a slope grid precomputed once per planet (parallel, ~0.3 x gully wavelength on the cube faces); `ElevationFrac(d, minWavelength)` band-limits noise octaves + erosion (chunks pass 2.2 x vertex spacing; gameplay queries use full detail; skirts reach `ErosionDepthMeters` deeper). Own RNG, so craters/landforms/sites of a seed did not move. Decor: `Prop.Outcrop` (big rocks half buried in slopes steeper than `MinSlope`, aligned to the hillside); far decor (`PlanetDecor.GenerateFar`, procedural, no colliders, 60 % / 30 % density) on the two LOD levels above the large-decor level, shown only while that node itself is drawn (`Node.FarDecor`). `LodQuality` default 2, `_LayerFade` 300. Water: `VW_Ocean` screen-space reflections (`_SSR`, LOD-0 samples), `ShoreFoam` (1 surf, ~0.3 calm lakes); `VW_Planet` wet shore band via `_SeaRadius`/`_WetBand`. Provinces (#115): `PlanetShapeDef.Provinces` (`ProvinceDef`: Kind Plains/Hills/Mountains/Plateau/Basin, Share, Elevation, Relief, Frequency, Sharpness, Terraces, EdgeCliff, Erosion, Region; preset helpers `PlanetBuilder.Prov/Provinces`) replace most global noise layers: `ProvinceCount` jittered Fibonacci cells (own RNG, kinds by quota so every seed shows the mix, per-cell height `Lift`), soft Voronoi over a two-octave warped direction (`ProvinceBlend`, `ProvinceWarp`); cliff provinces sharpen their elevation step (strength varies along the edge), erosion and the colour zone (`RegionAt`) follow the provinces. Far decor skips rocks (they read as dark specks); `PlanetVisuals.FarDecor` = dev switch. PBR surface layers (#100): `PlanetShapeDef.Ground/Cliff/Region/Low/PeakLayer` (`SurfaceLayer`: albedo, OpenGL normal, ARM mask, scale m, tint, normal, contrast, mean colour filled by the builder) from `Art/Terrain/\u003cSet>/` (CC0 Poly Haven/ambientCG, converted by `Tools/Blender/planet_assets.py --ingest`), assigned per preset in `PlanetBuilder.AssignSurfaceLayers`; `PlanetVisuals.ApplySurfaceLayers` enables `_SURFACE_LAYERS` on VW_Planet: nested weights (region, low = below sea + `ShoreBand`, peak above `PeakStart`, cliff on top), triplanar with explicit gradients (weak layers/projections are skipped), the ramp tints the set by luminance (ramp colour x texture brightness / set mean), ARM roughness drives the highlight; it fades back to the procedural look at `_LayerFade` x ground scale, so orbit views are unchanged. No ground layer = the old procedural look. Asset props (#100): `Tools/Blender/planet_assets.py` (build) exports `Art/Models/Planet/Planet_\u003cRock|MossRock|Crystal|Ice|AlienTree|FistPlant|MinePlant|AlienPlant|Mushroom>*.fbx` (rocks: centre origin, radius 1; others: bottom origin, height 1; 0.9-4.5k tris), `PlanetModelBuilder` imports them CPU-readable with the source folder's materials -> `ContentCatalog.PlanetProps`. `PlanetPropLibrary` (Planet) copies them into arrays once; families by id prefix (\"Pod\" = the small alien plants). `PlanetDecor.AssetFamily` maps procedural props to families (rocks/pebbles/boulders -> Rock, jungle -> MossRock, desert -> DesertRock; ice shard/spike -> Ice; crystal/spire -> Crystal; pod, tree, mushroom; shrub -> SpruceBush, conifer -> Spruce, cactus -> Saguaro, dry bush -> Rooibos, fern -> Fern, dead tree -> DeadTree, basalt -> Basalt (`StackBasalt`), hoodoo -> stacked DesertRock), the variant comes from the prop's own seed (placement unchanged); worker threads bake them into a `PropBatch` per chunk -> `DecorProps` child (submesh per model material; `PlanetVisuals.PropMaterial` tints rock/crystal/ice by `DecorColors`). Still procedural: vent, ember rock (they glow). Foliage cards get bent normals in the build (`FOLIAGE` material keywords), else back-lit cards turn black. Landmarks: frozen spires, elder tree, giant fungi, crystal colossus, floating isles, boulder field, hoodoos, basalt organ use the assets (glow bits stay procedural). `Generated` textures (MetallicSmoothness packs) are imported at once even inside BuildAll's asset editing block (`assetBatching`), so a new asset needs one build, not two. Asteroids (`SystemVisuals` fields, `WarpCorridorView` rocks) use the Rock family: one submesh per variant, convex MeshCollider on the scan scaled by the radius, fragments = the scan.\n- Seats don't reparent: the pawn follows `ShipSeat.SeatOf` in LateUpdate; seated capsules are disabled on all peers.\n- Light, sky, VFX (#96): `VW_NebulaSkybox` = NASA SVS star map cubemap (`Art/Sky/Starmap_8k.jpg`, 2048 faces, keyword `_STARMAP`, rotated per galaxy by `SystemVisuals.StarMapRotation`, `PaletteDef.StarField`/`NebulaField`) + domain-warped nebula. Reflections: `SystemVisuals` renders one sky-only realtime `SkyProbe` per system; reflection cameras get the global `_VWReflectionPass` = 1, so the sky adds a soft fill there (PBR metal reflects shape, not black). Realtime probes must stay on in QualitySettings (`SceneBuilder.EnableRealtimeProbes`). Post: ACES, HDR grading, SMAA High, 4K main-light shadows; per-galaxy grade in `PaletteDef`. VFX: `VW_FlipbookParticle` (premultiplied, `_Additive`, frame blending, soft particles); `VfxManager` textured layers (Unity Labs flipbooks, Kenney sprites) from `SkyVfxBuilder`, sources converted by `Tools/Blender/space_textures.py`; missing textures fall back to the procedural look. Projectiles (`CombatNet.DressVisual`): camera-facing head glow/flare (`VW_GlowSprite`, child quad of the pooled bolt, colour by property block), short textured energy trail for bolts/orbs, smoke trail for missiles (catalog `Fx*Material`). Engines: `VW_Plume` shock diamonds + turbulent flicker, `NozzleGlow` sprite per thruster (`PrefabBuilder.Thrusters`). Warp speed lines, comet tails and Rift tendrils use the Kenney streak (`FxStreakMaterial`). Journey sky: `GalaxyDef.NextGalaxyImage` (M31 GALEX, NGC 6822 ESO, Leo I generated, LMC ESO) and `ContentCatalog.MilkyWayImage` (NASA/JPL artist concept), converted by `Tools/Blender/galaxy_textures.py`; `SystemVisuals.SkyImage` = camera-facing quad with a fixed roll (`VW_SkyImage`, unfogged `_FogAmount` 0), the dot spirals stay as the fallback.\n- Floating origin: each system is generated around the origin; on warp, ships and pawns are rebased via `NetTeleport` (sent to the transform owner). `SystemVisuals` (client) builds asteroids, galaxy palette, music and the journey sky (destination galaxy + Milky Way growing per galaxy).\n- UI is fully code-built (`UIKit`, `UIRoot`, `MenuScreens`, `HudView`, `InventoryView`, `TradeView`). Namespace `Voidward.UI` has enum `Screen` → write `UnityEngine.Screen` explicitly.\n- Meta progression (to be redefined in #47 without runs/loops): `Progression/Meta.cs` (Memory fragments = `Memories`, perks, local save; `Meta.ResetAll()`; saves from before #112 are migrated by a raw-JSON rename in `SaveSystem.Load(key, migrate)`, run save v4 likewise for Credits -> `Salvage`).\n\n---\n\n[Journey & game design](journey.md) | [Architecture & systems](architecture.md) | [Development workflow](development.md) | [Art & asset pipeline](art-and-assets.md) | [Testing playbook](testing.md) | [Status & priorities](status.md) | [Wiki maintenance](maintenance.md)\n"}, {"title": "Entwickeln im Projekt", "eyebrow": "Arbeitsablauf", "summary": "Vom Issue zur überprüfbaren Änderung. Hier stehen die Regeln für generierte Inhalte, Unity und die Zusammenarbeit auf Mac und Windows.", "highlights": [["Generatoren zuerst", "Generierte Szenen und Prefabs werden überschrieben. Änderungen gehören in Builder oder Laufzeitcode."], ["Gezielt prüfen", "Mit dem günstigsten passenden Test beginnen. Multiplayer prüfen, wenn Netzwerkverhalten betroffen ist."], ["Wissen mitführen", "Neue Erkenntnisse und Testhelfer zusammen mit dem Code dokumentieren."]], "flow": ["Issue lesen", "Branch", "Umsetzen", "Prüfen", "Review"], "images": [], "id": "development", "audience": "developer", "html": "\u003ch2 id=\"ref-0\">Conventions / gotchas (learned the hard way)\u003c/h2>\u003cul>\u003cli>One MonoBehaviour/NetworkBehaviour per file, file name = class name (otherwise &quot;missing script&quot; on prefabs).\u003c/li>\u003cli>Server RPCs: \u003ccode>[Rpc(SendTo.Server, InvokePermission = RpcInvokePermission.Everyone)]\u003c/code> + \u003ccode>RpcParams rp\u003c/code> → \u003ccode>rp.Receive.SenderClientId\u003c/code>.\u003c/li>\u003cli>Never write NetworkVariables before spawn: store them in pending fields, then apply them in \u003ccode>OnNetworkSpawn\u003c/code>.\u003c/li>\u003cli>Don&#x27;t use \u003ccode>??\u003c/code> / \u003ccode>?.\u003c/code> on UnityEngine.Object.\u003c/li>\u003cli>TMP: ASCII glyphs only (no \u003ccode>…\u003c/code>, arrows, emoji) → otherwise missing-glyph warnings.\u003c/li>\u003cli>PrefabBuilder deletes prefabs before re-saving them (keeps \u003ccode>GlobalObjectIdHash\u003c/code> valid). Network prefab list is rebuilt from scratch.\u003c/li>\u003cli>Skybox shader must handle reversed-Z (otherwise it draws over everything).\u003c/li>\u003cli>\u003cstrong>Art direction (#120, rules in &quot;Art &amp; assets&quot; below and \u003ccode>Assets/Design/DESIGN.md\u003c/code> &quot;Visual Identity&quot;): low poly, flat-shaded with the shared palette (variant A, 2026-10-17).\u003c/strong> It replaces the detailed PBR direction of #91. Everything the bullets below describe as Fab/Sketchfab/Poly Haven assets, PBR materials, photo textures or scans (#91-#100) is the legacy look and gets replaced by #122-#127/#133; keep their runtime code, swap models/materials.\u003c/li>\u003c/ul>\u003cdetails id=\"ref-1\">\u003csummary>Low-poly ships (#122, 2026-10-17, placeholder look - the ships get another pass)\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>\u003ccode>Art/Palette.json\u003c/code> = the shared palette (read by \u003ccode>vw_blender.load_palette\u003c/code> and \u003ccode>ContentBuilder.Pal\u003c/code>). \u003ccode>Tools/Blender/lowpoly_ships.py\u003c/code> turns Quaternius &quot;Ultimate Spaceships&quot; (CC0, \u003ccode>Tools/Blender/Sources/Quaternius/\u003c/code>) into \u003ccode>Art/Models/Ships/LowPoly/Ship_&lt;Dart|Mule|Nostos&gt;_LP(.fbx|_Canopy.fbx)\u003c/code>: scaled to length, every face recoloured from its texture to a palette class, canopy faces split off (\u003ccode>canopy\u003c/code> = dark faces in a source-space box, \u003ccode>glass_box\u003c/code> = faces facing up/forward or \u003ccode>glass_dark\u003c/code> in a Unity-space box), prints sizes in Unity coordinates. \u003ccode>Tools/Blender/lowpoly_kit.py\u003c/code> converts the Kenney Space Station Kit (zip in \u003ccode>Sources/KenneyStationKit/\u003c/code>) to \u003ccode>Art/Models/Kit/Kit_&lt;name&gt;.fbx\u003c/code> (Kenney units, a wall tile = 1). \u003ccode>LowPolyShipBuilder\u003c/code> (partial \u003ccode>ContentBuilder\u003c/code>): \u003ccode>VW_LowPoly\u003c/code> material, \u003ccode>LowPolyMesh\u003c/code>, \u003ccode>KitMesh\u003c/code>/\u003ccode>KitPart\u003c/code>, \u003ccode>BuildLowPolyDart\u003c/code> (Omen, 15 m, eye \u003ccode>DartLPEye\u003c/code>) and \u003ccode>BuildLowPolyMule\u003c/code> (Spitfire, 13 m, \u003ccode>MuleLPEye\u003c/code>) with \u003ccode>LowPolyCockpit\u003c/code> (tub, Kenney chair + console, live screens, own stick/throttle with grip IK); \u003ccode>BuildDart\u003c/code>/\u003ccode>BuildMule\u003c/code> prefer them, the Fab/R35 builds stay as fallback. The Nostos still uses the Ark: its interior, airlock and clamps are fitted to the Ark hull, so the Imperial hull is prepared but not wired.\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-2\">\u003csummary>Legacy PBR asset pipeline (#91, being replaced, see &quot;Art &amp; assets&quot;)\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>source files in the repo (models: \u003ccode>Tools/Blender/Sources/&lt;Asset&gt;/\u003c/code>, textures: \u003ccode>Assets/_Project/Art/Models/&lt;Group&gt;/&lt;Asset&gt;/\u003c/code>), a \u003ccode>Tools/Blender/&lt;asset&gt;.py\u003c/code> script normalizes the model (metres, nose Blender -Y = Unity +Z, origin at the bounds centre, target size) and exports \u003ccode>Assets/_Project/Art/Models/&lt;Group&gt;/&lt;Name&gt;.fbx\u003c/code>. \u003ccode>AssetModelBuilder\u003c/code> (partial \u003ccode>ContentBuilder\u003c/code>): \u003ccode>ModelMesh(fbx)\u003c/code> (own UVs/normals, MikkTSpace tangents), \u003ccode>ImportTexture(path, srgb, normal, flipGreen)\u003c/code>, \u003ccode>PackMetallicSmoothness\u003c/code> (Substance metallic + roughness -&gt; URP map, generated PNG), \u003ccode>PbrMaterial(name, dir, prefix)\u003c/code> = URP Lit from a \u003ccode>&lt;prefix&gt;_Base_color/Metallic/Roughness/Normal_DirectX/Mixed_AO/Emissive.jpg\u003c/code> set (DirectX normals are green-flipped by the importer). \u003ccode>PrefabBuilder\u003c/code> places colliders/seats/muzzles/thrusters/lights around the asset and keeps the procedural build as fallback when the FBX is missing (\u003ccode>BuildDart\u003c/code> -&gt; \u003ccode>BuildFabDart\u003c/code>). Cockpits: the pilot sits inside. \u003ccode>fab_spaceship.py\u003c/code> cuts the canopy glass out of the hull (faces in a box whose texture is dark = painted glass) into \u003ccode>*_Canopy.fbx\u003c/code> (smoked \u003ccode>VOIDWARD/Glass\u003c/code>), and builds \u003ccode>*_Cockpit.fbx\u003c/code> = the hull section between two bulkheads, duplicated, flipped and pushed inwards, capped (vw vertex contract, \u003ccode>VW_HullInterior\u003c/code> = VW_Hull without rim); seat, consoles, stick come from \u003ccode>FabDartCockpitMesh\u003c/code>, plus the usual \u003ccode>Dashboard\u003c/code>. The script prints cross-sections (roof/floor/width per z) for placing seat and eye (anchor = eye - 1.2). Check with \u003ccode>ContentBuilder.PreviewShot(&quot;&lt;prefab&gt;&quot;, camLocal, targetLocal, fov, name)\u003c/code> -&gt; \u003ccode>Temp/HeroShots\u003c/code>.\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-3\">\u003csummary>Mule + Ark (#97, the Ark is the Nostos since #49)\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>the Mule is the Fab DROPSHIP R35 (\u003ccode>Tools/Blender/r35_dropship.py\u003c/code>: 15 m, the upper nose cut out as the canopy, cockpit tub = shrunk convex hull of the nose section, open under the canopy, because the R35 hull has deep insets), \u003ccode>BuildR35Mule\u003c/code> puts the Dart&#x27;s fittings on a raised deck via \u003ccode>DartFittings(root, dartHull, walls)\u003c/code> (the Dart fittings in Dart coordinates under a root moved so the Dart eye (0, 0, 3.67) lands on the ship&#x27;s eye). The Ark is the Sketchfab SPACESHIP - CARGO (\u003ccode>Tools/Blender/cargo_ark.py\u003c/code>: posed rig baked, native 36 m, hull faces inside the walkable volume removed, window cut out, airlock door cut into the left flank between the wings); \u003ccode>BuildCargoArk\u003c/code> builds the deck shell (\u003ccode>ArkDeckMesh\u003c/code>: corridor with a chamfered ceiling, bridge with raised pilot platform, airlock + boarding ramp, stations), a hollow collider shell, three gravity volumes (corridor, bridge, airlock), turret/engineer seats with the Dart chair (\u003ccode>ArkChairAt\u003c/code>). The Ark constants (\u003ccode>ArkFloor\u003c/code>, \u003ccode>ArkHall*\u003c/code>, \u003ccode>ArkBridge*\u003c/code>, \u003ccode>ArkDoor*\u003c/code>) must match \u003ccode>cargo_ark.py\u003c/code> ROOMS/DOOR. Derelict Ark = the same prefab: \u003ccode>ShipDerelictLook\u003c/code> (Ship) swaps hull + deck to \u003ccode>ArkDerelictMaterial\u003c/code> / \u003ccode>InteriorDerelictMaterial\u003c/code> and the cabin lights to flickering red emergency light while \u003ccode>ShipCore.Derelict\u003c/code> is set. Interiors seen from inside must be closed by own walls: the hull&#x27;s back faces are culled (you would see space).\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-4\">\u003csummary>Enemies + Warden (#98)\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>assets from Sketchfab glTF (CC BY), normalized by \u003ccode>Tools/Blender/enemy_assets.py\u003c/code> (\u003ccode>--ingest &lt;Downloads&gt;\u003c/code> once: sources zipped to \u003ccode>Tools/Blender/Sources/Enemies/&lt;Name&gt;.zip\u003c/code> without textures, textures as 2K JPG to \u003ccode>Art/Models/Enemies/&lt;Name&gt;/&lt;material&gt;_&lt;baseColor|normal|metallicRoughness|emissive&gt;.jpg\u003c/code>; then a plain run rebuilds every FBX). Swarm hunter (PirateFighter, I_Ship), swarm brood ship (PirateGunship, E_Ship_A), squid (FlyingCritter) = static PBR; crawler (Insectoid), spitter (Alien Ninja), nest guardian (Frost Predator, Rigify -&gt; \u003ccode>rebake_rest\u003c/code> onto the idle pose) = rigged walkers; Warden boss = &quot;alien droneship&quot; (5 chunks decimated to 60k, every face doubled flipped because the source shells are single-sided, vw vertex contract ivory/cyan, crevice glow from the AO bake). Sentinel (DroneSwarm) = own build \u003ccode>Tools/Blender/warden_sentinel.py\u003c/code> (+ \u003ccode>Enemy_Sentinel_Ring.fbx\u003c/code>). Unity side \u003ccode>EnemyModelBuilder\u003c/code> (partial \u003ccode>ContentBuilder\u003c/code>): \u003ccode>EnemyMaterials\u003c/code> (URP Lit per glTF material, cull off), \u003ccode>PrepareEnemyRig\u003c/code> (Generic, used clips, motion node = the run cycle&#x27;s travelling node so clips play in place), \u003ccode>EnemyController\u003c/code> (Speed blend idle/walk/run, Cycle offset, Attack/Alert triggers), \u003ccode>EnemyModel\u003c/code> (&quot;Model&quot; child, null -&gt; legacy mesh). Runtime \u003ccode>EnemyAnimator\u003c/code> (AI, every peer): Speed from the interpolated motion, \u003ccode>EnemyBrain.AttackAnimClientRpc\u003c/code> -&gt; Attack trigger or procedural lunge, Alert (roar) on Patrol -&gt; Chase, floaters swim, ships bank. \u003ccode>SpinPart\u003c/code> (Core) spins the sentinel halo and the boss rings. Blender pitfalls: the Sketchfab scenes carry a scene-sized &quot;Icosphere&quot; helper (only skinned meshes count), the importer stacks every clip as NLA tracks, and animation lives on the evaluated copy (\u003ccode>evaluated_get\u003c/code>) - original pose bones / \u003ccode>modifier_apply\u003c/code> see the rest pose.\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-5\">\u003csummary>World objects + POIs (#99)\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>Sketchfab assets (CC BY) normalized by \u003ccode>Tools/Blender/world_assets.py\u003c/code> (\u003ccode>--ingest &lt;Downloads&gt;\u003c/code> takes glTF zips and original FBX downloads: sources to \u003ccode>Tools/Blender/Sources/World/&lt;Name&gt;.zip\u003c/code>, textures as 2K JPG to \u003ccode>Art/Models/World/&lt;Name&gt;/&lt;material&gt;_&lt;baseColor|normal|metallicRoughness|emissive|ao&gt;.jpg\u003c/code>; FBX texture sets are mapped per asset in \u003ccode>ASSETS\u003c/code> (UE DirectX normals flipped, specular/gloss packed to metallicRoughness, \u003ccode>&quot;auto&quot;\u003c/code> = the FBX&#x27;s own links + flat 4x4 maps); a plain run rebuilds every FBX and prints the numbers PrefabBuilder uses). \u003ccode>World_Station\u003c/code> (Space Station 3, twin rings, 64 m, spins via \u003ccode>TraderStation.spinner\u003c/code>, static MeshCollider copy), \u003ccode>World_Pad\u003c/code> (teleporter pad = landing deck, origin = deck centre; station deck at y -6.5, z 52, Wasp cockpit console as trader terminal), \u003ccode>World_Wreck\u003c/code> (+ \u003ccode>_Chunks\u003c/code>, \u003ccode>World_Scrap\u003c/code> = torn Vigilant destroyer section), \u003ccode>World_Ruin\u003c/code> (Ancient Relic, untextured -&gt; vw vertex contract ivory/cyan like the Warden, \u003ccode>ImportedMesh\u003c/code> + \u003ccode>MatHull\u003c/code>), \u003ccode>World_Nest\u003c/code> (alien eggs), \u003ccode>World_Crate\u003c/code> (+ \u003ccode>_Lid\u003c/code>, hinge (0, 1.118, -0.725)), \u003ccode>World_Rock\u003c/code> (photoscan, node base), \u003ccode>World_Battery\u003c/code> (fuel node canister, generic pickup cell, \u003ccode>fuel\u003c/code> item), \u003ccode>World_Medkit\u003c/code> (medkit tool = \u003ccode>ToolModel(3)\u003c/code>, \u003ccode>medkit\u003c/code> item). Crashed ship = the Fab Dart wrecked and posed by \u003ccode>Tools/Blender/crashed_dart.py\u003c/code> (\u003ccode>Ship_Dart_Crashed*.fbx\u003c/code>, scorch = generated texture \u003ccode>CrashedDartMaterial\u003c/code>, smoke \u003ccode>SmokeColumn\u003c/code>). Unity: \u003ccode>WorldModelBuilder\u003c/code> (\u003ccode>WorldModel\u003c/code>/\u003ccode>WorldModelSolid\u003c/code>/\u003ccode>WorldMesh\u003c/code>, materials via the shared \u003ccode>GltfMaterials\u003c/code>, cut-out parts share a texture folder via \u003ccode>WorldTextureSet\u003c/code>), \u003ccode>WorldPrefabBuilder\u003c/code> (\u003ccode>BuildAsset*\u003c/code>, PrefabBuilder picks them when the FBX exists, else the procedural build). Item models from assets set \u003ccode>ItemDef.ModelMaterials\u003c/code> (WorldPickup swaps mesh + materials; items without a model show the \u003ccode>generic\u003c/code> cell). POI spawn offsets in \u003ccode>SystemDirector\u003c/code> (ruin cache, crash crate/scrap, wreck crates/nodes/pickups) follow the asset sizes. Gotcha: \u003ccode>CrewController()\u003c/code> recreates its asset - reuse \u003ccode>crewCtrl\u003c/code> (or load the controller) outside BuildPawn, else the pawn prefab loses its controller.\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-6\">\u003csummary>Procedural fallback (legacy hero pipeline #26, still used by the astronaut, Mule, Ark, props)\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>build with \u003ccode>Hero()\u003c/code> (weighted normals via \u003ccode>SmoothAngle\u003c/code>, panel detail) and the parametric parts \u003ccode>AddLoft\u003c/code> (fuselages, limbs), \u003ccode>AddLathe\u003c/code> (nozzles, rings, tanks), \u003ccode>AddSlab\u003c/code> (wings, plates), \u003ccode>AddTube\u003c/code>/\u003ccode>Polyline\u003c/code>, liveries via quad-aware \u003ccode>Paint\u003c/code>. Render with \u003ccode>MatHull\u003c/code> (VW_ToonFlat \u003ccode>_SURFACEDETAIL_ON\u003c/code>: triplanar panel seams/rivets/grime from \u003ccode>SurfaceDetailBuilder\u003c/code>, edge wear on chamfers, GGX + probe reflections). Primitives choose winding from geometry, so mirrored matrices (\u003ccode>Scale(-1,1,1)\u003c/code>) are fine. Iterate with menu \u003ccode>Voidward/Dev/Hero Preview Shots\u003c/code> (renders to \u003ccode>Temp/HeroShots\u003c/code>, no full rebuild needed); after Build All Content, \u003ccode>ContentBuilder.PreviewPrefabs(&quot;&lt;name filter&gt;&quot;)\u003c/code> / \u003ccode>PreviewShot(...)\u003c/code> (callable from RunCommand) render built prefabs. Ship exhaust and projectiles = \u003ccode>VW_Plume\u003c/code> (additive fresnel). Soot/burns: \u003ccode>MeshBuilder.Weather\u003c/code>; contact shading: \u003ccode>Grade\u003c/code>. Planet decor, landmarks, asteroids and the menu ground use \u003ccode>VW_Terrain\u003c/code> with a rock detail mask (enable via \u003ccode>MeshBuilder.Panel = 1\u003c/code>). Per-sector color grading lives in \u003ccode>PaletteDef\u003c/code> (runtime volume in \u003ccode>SectorVisuals\u003c/code>).\u003c/p>\u003c/div>\u003c/details>\u003cul>\u003cli>Editor ↔ release build = &quot;NetworkConfig mismatch&quot;. Use a Development build (\u003ccode>Voidward/Build/macOS (Development)\u003c/code> or \u003ccode>Windows (x64, Development)\u003c/code>) or MPPM.\u003c/li>\u003cli>Owning a ship in its spawn frame breaks positioning for remote clients → \u003ccode>RunManager.SeatLater\u003c/code> delays it by 0.6 s.\u003c/li>\u003c/ul>\u003ch2 id=\"ref-7\">Issue workflow (mandatory)\u003c/h2>\u003cp>Repo: \u003ccode>Weofi/Space-Beyond-Infinity\u003c/code>, default branch \u003ccode>main\u003c/code>. When the user hands over an issue:\u003c/p>\u003col>\u003cli>Read the issue (incl. images/mockups) via \u003ccode>gh issue view &lt;nr&gt; --comments\u003c/code>.\u003c/li>\u003cli>\u003ccode>git checkout main &amp;&amp; git pull\u003c/code>, then create a dedicated branch \u003ccode>issue-&lt;nr&gt;-&lt;short-slug&gt;\u003c/code> (never work on \u003ccode>main\u003c/code>).\u003c/li>\u003cli>Push the branch early and open a \u003cstrong>draft PR\u003c/strong> against \u003ccode>main\u003c/code> with \u003ccode>Closes #&lt;nr&gt;\u003c/code> in the body (check for a PR template first).\u003c/li>\u003cli>Implement on that branch with small, descriptive commits (\u003ccode>#&lt;nr&gt;: ...\u003c/code>), push regularly.\u003c/li>\u003cli>When done: compile check + test per the &quot;Testing playbook&quot; (cheapest level first, not a full run), update the PR description (changes, test notes, screenshots), mark it ready for review.\u003c/li>\u003cli>If everything works and the issue is fully done: merge the PR into \u003ccode>main\u003c/code> yourself (user-approved), then \u003ccode>git checkout main &amp;&amp; git pull\u003c/code>. If anything is broken or open, don&#x27;t merge; report back instead.\u003c/li>\u003c/ol>\u003cp>One issue = one branch = one PR. Don&#x27;t mix issues.\u003c/p>\u003ch2 id=\"ref-8\">Agent workflow (Unity MCP)\u003c/h2>\u003cul>\u003cli>Don&#x27;t edit C# while Unity is in Play Mode (a domain reload breaks statics).\u003c/li>\u003cli>Compile check: read \u003ccode>Logs/Editor.log\u003c/code> after the last &quot;Requested script compilation&quot; and grep \u003ccode>): error CS\u003c/code>.\u003c/li>\u003cli>\u003ccode>Unity_RunCommand\u003c/code> returns &quot;Unity not detected&quot; while compiling/reloading → just retry. System.Reflection is not allowed there.\u003c/li>\u003cli>Run menu items (\u003ccode>Voidward/Build All Content\u003c/code>, \u003ccode>Voidward/Build/...\u003c/code>) via ManageMenuItem, not RunCommand. Exception: dev builds, see the testing playbook.\u003c/li>\u003cli>Never call \u003ccode>AssetDatabase.Refresh\u003c/code>/\u003ccode>ImportAsset\u003c/code> in Play Mode: it can trigger a script recompile + domain reload that breaks the session (UIRoot NREs). Shader tweaks: exit Play Mode first, or check them in Edit Mode (render a quad with the material).\u003c/li>\u003cli>Target: zero console errors/warnings from Voidward code. Known foreign noise: AI Inference tensor warnings, PreviewRenderUtility leak.\u003c/li>\u003cli>Unity skills (\u003ccode>.agents/skills\u003c/code>, from \u003ccode>Unity-Technologies/skills\u003c/code>, lock: \u003ccode>skills-lock.json\u003c/code>): use them as domain knowledge only. Implement their recommendations in the builder code (\u003ccode>ContentBuilder\u003c/code>/\u003ccode>PrefabBuilder\u003c/code>/\u003ccode>SceneBuilder\u003c/code>) or in runtime code, never as direct edits to generated scenes/prefabs/assets. Update: \u003ccode>npx skills update -p\u003c/code>.\u003c/li>\u003c/ul>\u003ch2 id=\"ref-9\">Cross-platform (Mac + Windows)\u003c/h2>\u003cul>\u003cli>Same Unity version on both machines (\u003ccode>ProjectSettings/ProjectVersion.txt\u003c/code>). Line endings are pinned to LF via \u003ccode>.gitattributes\u003c/code>.\u003c/li>\u003cli>Before switching machines: commit + push. On the other machine: \u003ccode>git pull\u003c/code> first, then open Unity.\u003c/li>\u003cli>\u003ccode>.mcp.json\u003c/code> is git-ignored (machine-specific Unity relay path); each machine keeps its own.\u003c/li>\u003cli>GitHub: use the GitHub CLI (\u003ccode>gh\u003c/code>, logged in via \u003ccode>gh auth login --web\u003c/code>) for issues, PRs and merges. No GitHub MCP server (its OAuth needs dynamic client registration, which Claude Code can&#x27;t do with GitHub). On Windows, \u003ccode>gh\u003c/code> lives at \u003ccode>C:\\Program Files\\GitHub CLI\\gh.exe\u003c/code> (call it by full path if PATH isn&#x27;t refreshed yet).\u003c/li>\u003cli>Blender: Windows \u003ccode>C:\\Program Files\\Blender Foundation\\Blender 5.2\\blender.exe\u003c/code>; Mac \u003ccode>/Applications/Blender.app/Contents/MacOS/Blender\u003c/code> (install the same 5.2 version there).\u003c/li>\u003c/ul>", "toc": [{"id": "ref-0", "title": "Conventions / gotchas (learned the hard way)"}, {"id": "ref-1", "title": "Low-poly ships (#122, 2026-10-17, placeholder look - the ships get another pass)"}, {"id": "ref-2", "title": "Legacy PBR asset pipeline (#91, being replaced, see \"Art & assets\")"}, {"id": "ref-3", "title": "Mule + Ark (#97, the Ark is the Nostos since #49)"}, {"id": "ref-4", "title": "Enemies + Warden (#98)"}, {"id": "ref-5", "title": "World objects + POIs (#99)"}, {"id": "ref-6", "title": "Procedural fallback (legacy hero pipeline #26, still used by the astronaut, Mule, Ark, props)"}, {"id": "ref-7", "title": "Issue workflow (mandatory)"}, {"id": "ref-8", "title": "Agent workflow (Unity MCP)"}, {"id": "ref-9", "title": "Cross-platform (Mac + Windows)"}], "search": "\u003c!-- Generated by Tools/Docs/build_wiki.py from AGENTS.md. Do not edit. -->\n\n# Development workflow\n\n[Wiki home](README.md) | [Edit source](../../AGENTS.md)\n\n## Conventions / gotchas (learned the hard way)\n\n- One MonoBehaviour/NetworkBehaviour per file, file name = class name (otherwise \"missing script\" on prefabs).\n- Server RPCs: `[Rpc(SendTo.Server, InvokePermission = RpcInvokePermission.Everyone)]` + `RpcParams rp` → `rp.Receive.SenderClientId`.\n- Never write NetworkVariables before spawn: store them in pending fields, then apply them in `OnNetworkSpawn`.\n- Don't use `??` / `?.` on UnityEngine.Object.\n- TMP: ASCII glyphs only (no `…`, arrows, emoji) → otherwise missing-glyph warnings.\n- PrefabBuilder deletes prefabs before re-saving them (keeps `GlobalObjectIdHash` valid). Network prefab list is rebuilt from scratch.\n- Skybox shader must handle reversed-Z (otherwise it draws over everything).\n- **Art direction (#120, rules in \"Art & assets\" below and `Assets/Design/DESIGN.md` \"Visual Identity\"): low poly, flat-shaded with the shared palette (variant A, 2026-10-17).** It replaces the detailed PBR direction of #91. Everything the bullets below describe as Fab/Sketchfab/Poly Haven assets, PBR materials, photo textures or scans (#91-#100) is the legacy look and gets replaced by #122-#127/#133; keep their runtime code, swap models/materials.\n- Low-poly ships (#122, 2026-10-17, placeholder look - the ships get another pass): `Art/Palette.json` = the shared palette (read by `vw_blender.load_palette` and `ContentBuilder.Pal`). `Tools/Blender/lowpoly_ships.py` turns Quaternius \"Ultimate Spaceships\" (CC0, `Tools/Blender/Sources/Quaternius/`) into `Art/Models/Ships/LowPoly/Ship_\u003cDart|Mule|Nostos>_LP(.fbx|_Canopy.fbx)`: scaled to length, every face recoloured from its texture to a palette class, canopy faces split off (`canopy` = dark faces in a source-space box, `glass_box` = faces facing up/forward or `glass_dark` in a Unity-space box), prints sizes in Unity coordinates. `Tools/Blender/lowpoly_kit.py` converts the Kenney Space Station Kit (zip in `Sources/KenneyStationKit/`) to `Art/Models/Kit/Kit_\u003cname>.fbx` (Kenney units, a wall tile = 1). `LowPolyShipBuilder` (partial `ContentBuilder`): `VW_LowPoly` material, `LowPolyMesh`, `KitMesh`/`KitPart`, `BuildLowPolyDart` (Omen, 15 m, eye `DartLPEye`) and `BuildLowPolyMule` (Spitfire, 13 m, `MuleLPEye`) with `LowPolyCockpit` (tub, Kenney chair + console, live screens, own stick/throttle with grip IK); `BuildDart`/`BuildMule` prefer them, the Fab/R35 builds stay as fallback. The Nostos still uses the Ark: its interior, airlock and clamps are fitted to the Ark hull, so the Imperial hull is prepared but not wired.\n- Legacy PBR asset pipeline (#91, being replaced, see \"Art & assets\"): source files in the repo (models: `Tools/Blender/Sources/\u003cAsset>/`, textures: `Assets/_Project/Art/Models/\u003cGroup>/\u003cAsset>/`), a `Tools/Blender/\u003casset>.py` script normalizes the model (metres, nose Blender -Y = Unity +Z, origin at the bounds centre, target size) and exports `Assets/_Project/Art/Models/\u003cGroup>/\u003cName>.fbx`. `AssetModelBuilder` (partial `ContentBuilder`): `ModelMesh(fbx)` (own UVs/normals, MikkTSpace tangents), `ImportTexture(path, srgb, normal, flipGreen)`, `PackMetallicSmoothness` (Substance metallic + roughness -> URP map, generated PNG), `PbrMaterial(name, dir, prefix)` = URP Lit from a `\u003cprefix>_Base_color/Metallic/Roughness/Normal_DirectX/Mixed_AO/Emissive.jpg` set (DirectX normals are green-flipped by the importer). `PrefabBuilder` places colliders/seats/muzzles/thrusters/lights around the asset and keeps the procedural build as fallback when the FBX is missing (`BuildDart` -> `BuildFabDart`). Cockpits: the pilot sits inside. `fab_spaceship.py` cuts the canopy glass out of the hull (faces in a box whose texture is dark = painted glass) into `*_Canopy.fbx` (smoked `VOIDWARD/Glass`), and builds `*_Cockpit.fbx` = the hull section between two bulkheads, duplicated, flipped and pushed inwards, capped (vw vertex contract, `VW_HullInterior` = VW_Hull without rim); seat, consoles, stick come from `FabDartCockpitMesh`, plus the usual `Dashboard`. The script prints cross-sections (roof/floor/width per z) for placing seat and eye (anchor = eye - 1.2). Check with `ContentBuilder.PreviewShot(\"\u003cprefab>\", camLocal, targetLocal, fov, name)` -> `Temp/HeroShots`.\n- Mule + Ark (#97, the Ark is the Nostos since #49): the Mule is the Fab DROPSHIP R35 (`Tools/Blender/r35_dropship.py`: 15 m, the upper nose cut out as the canopy, cockpit tub = shrunk convex hull of the nose section, open under the canopy, because the R35 hull has deep insets), `BuildR35Mule` puts the Dart's fittings on a raised deck via `DartFittings(root, dartHull, walls)` (the Dart fittings in Dart coordinates under a root moved so the Dart eye (0, 0, 3.67) lands on the ship's eye). The Ark is the Sketchfab SPACESHIP - CARGO (`Tools/Blender/cargo_ark.py`: posed rig baked, native 36 m, hull faces inside the walkable volume removed, window cut out, airlock door cut into the left flank between the wings); `BuildCargoArk` builds the deck shell (`ArkDeckMesh`: corridor with a chamfered ceiling, bridge with raised pilot platform, airlock + boarding ramp, stations), a hollow collider shell, three gravity volumes (corridor, bridge, airlock), turret/engineer seats with the Dart chair (`ArkChairAt`). The Ark constants (`ArkFloor`, `ArkHall*`, `ArkBridge*`, `ArkDoor*`) must match `cargo_ark.py` ROOMS/DOOR. Derelict Ark = the same prefab: `ShipDerelictLook` (Ship) swaps hull + deck to `ArkDerelictMaterial` / `InteriorDerelictMaterial` and the cabin lights to flickering red emergency light while `ShipCore.Derelict` is set. Interiors seen from inside must be closed by own walls: the hull's back faces are culled (you would see space).\n- Enemies + Warden (#98): assets from Sketchfab glTF (CC BY), normalized by `Tools/Blender/enemy_assets.py` (`--ingest \u003cDownloads>` once: sources zipped to `Tools/Blender/Sources/Enemies/\u003cName>.zip` without textures, textures as 2K JPG to `Art/Models/Enemies/\u003cName>/\u003cmaterial>_\u003cbaseColor|normal|metallicRoughness|emissive>.jpg`; then a plain run rebuilds every FBX). Swarm hunter (PirateFighter, I_Ship), swarm brood ship (PirateGunship, E_Ship_A), squid (FlyingCritter) = static PBR; crawler (Insectoid), spitter (Alien Ninja), nest guardian (Frost Predator, Rigify -> `rebake_rest` onto the idle pose) = rigged walkers; Warden boss = \"alien droneship\" (5 chunks decimated to 60k, every face doubled flipped because the source shells are single-sided, vw vertex contract ivory/cyan, crevice glow from the AO bake). Sentinel (DroneSwarm) = own build `Tools/Blender/warden_sentinel.py` (+ `Enemy_Sentinel_Ring.fbx`). Unity side `EnemyModelBuilder` (partial `ContentBuilder`): `EnemyMaterials` (URP Lit per glTF material, cull off), `PrepareEnemyRig` (Generic, used clips, motion node = the run cycle's travelling node so clips play in place), `EnemyController` (Speed blend idle/walk/run, Cycle offset, Attack/Alert triggers), `EnemyModel` (\"Model\" child, null -> legacy mesh). Runtime `EnemyAnimator` (AI, every peer): Speed from the interpolated motion, `EnemyBrain.AttackAnimClientRpc` -> Attack trigger or procedural lunge, Alert (roar) on Patrol -> Chase, floaters swim, ships bank. `SpinPart` (Core) spins the sentinel halo and the boss rings. Blender pitfalls: the Sketchfab scenes carry a scene-sized \"Icosphere\" helper (only skinned meshes count), the importer stacks every clip as NLA tracks, and animation lives on the evaluated copy (`evaluated_get`) - original pose bones / `modifier_apply` see the rest pose.\n- World objects + POIs (#99): Sketchfab assets (CC BY) normalized by `Tools/Blender/world_assets.py` (`--ingest \u003cDownloads>` takes glTF zips and original FBX downloads: sources to `Tools/Blender/Sources/World/\u003cName>.zip`, textures as 2K JPG to `Art/Models/World/\u003cName>/\u003cmaterial>_\u003cbaseColor|normal|metallicRoughness|emissive|ao>.jpg`; FBX texture sets are mapped per asset in `ASSETS` (UE DirectX normals flipped, specular/gloss packed to metallicRoughness, `\"auto\"` = the FBX's own links + flat 4x4 maps); a plain run rebuilds every FBX and prints the numbers PrefabBuilder uses). `World_Station` (Space Station 3, twin rings, 64 m, spins via `TraderStation.spinner`, static MeshCollider copy), `World_Pad` (teleporter pad = landing deck, origin = deck centre; station deck at y -6.5, z 52, Wasp cockpit console as trader terminal), `World_Wreck` (+ `_Chunks`, `World_Scrap` = torn Vigilant destroyer section), `World_Ruin` (Ancient Relic, untextured -> vw vertex contract ivory/cyan like the Warden, `ImportedMesh` + `MatHull`), `World_Nest` (alien eggs), `World_Crate` (+ `_Lid`, hinge (0, 1.118, -0.725)), `World_Rock` (photoscan, node base), `World_Battery` (fuel node canister, generic pickup cell, `fuel` item), `World_Medkit` (medkit tool = `ToolModel(3)`, `medkit` item). Crashed ship = the Fab Dart wrecked and posed by `Tools/Blender/crashed_dart.py` (`Ship_Dart_Crashed*.fbx`, scorch = generated texture `CrashedDartMaterial`, smoke `SmokeColumn`). Unity: `WorldModelBuilder` (`WorldModel`/`WorldModelSolid`/`WorldMesh`, materials via the shared `GltfMaterials`, cut-out parts share a texture folder via `WorldTextureSet`), `WorldPrefabBuilder` (`BuildAsset*`, PrefabBuilder picks them when the FBX exists, else the procedural build). Item models from assets set `ItemDef.ModelMaterials` (WorldPickup swaps mesh + materials; items without a model show the `generic` cell). POI spawn offsets in `SystemDirector` (ruin cache, crash crate/scrap, wreck crates/nodes/pickups) follow the asset sizes. Gotcha: `CrewController()` recreates its asset - reuse `crewCtrl` (or load the controller) outside BuildPawn, else the pawn prefab loses its controller.\n- Procedural fallback (legacy hero pipeline #26, still used by the astronaut, Mule, Ark, props): build with `Hero()` (weighted normals via `SmoothAngle`, panel detail) and the parametric parts `AddLoft` (fuselages, limbs), `AddLathe` (nozzles, rings, tanks), `AddSlab` (wings, plates), `AddTube`/`Polyline`, liveries via quad-aware `Paint`. Render with `MatHull` (VW_ToonFlat `_SURFACEDETAIL_ON`: triplanar panel seams/rivets/grime from `SurfaceDetailBuilder`, edge wear on chamfers, GGX + probe reflections). Primitives choose winding from geometry, so mirrored matrices (`Scale(-1,1,1)`) are fine. Iterate with menu `Voidward/Dev/Hero Preview Shots` (renders to `Temp/HeroShots`, no full rebuild needed); after Build All Content, `ContentBuilder.PreviewPrefabs(\"\u003cname filter>\")` / `PreviewShot(...)` (callable from RunCommand) render built prefabs. Ship exhaust and projectiles = `VW_Plume` (additive fresnel). Soot/burns: `MeshBuilder.Weather`; contact shading: `Grade`. Planet decor, landmarks, asteroids and the menu ground use `VW_Terrain` with a rock detail mask (enable via `MeshBuilder.Panel = 1`). Per-sector color grading lives in `PaletteDef` (runtime volume in `SectorVisuals`).\n- Editor ↔ release build = \"NetworkConfig mismatch\". Use a Development build (`Voidward/Build/macOS (Development)` or `Windows (x64, Development)`) or MPPM.\n- Owning a ship in its spawn frame breaks positioning for remote clients → `RunManager.SeatLater` delays it by 0.6 s.\n\n## Issue workflow (mandatory)\n\nRepo: `Weofi/Space-Beyond-Infinity`, default branch `main`. When the user hands over an issue:\n1. Read the issue (incl. images/mockups) via `gh issue view \u003cnr> --comments`.\n2. `git checkout main && git pull`, then create a dedicated branch `issue-\u003cnr>-\u003cshort-slug>` (never work on `main`).\n3. Push the branch early and open a **draft PR** against `main` with `Closes #\u003cnr>` in the body (check for a PR template first).\n4. Implement on that branch with small, descriptive commits (`#\u003cnr>: ...`), push regularly.\n5. When done: compile check + test per the \"Testing playbook\" (cheapest level first, not a full run), update the PR description (changes, test notes, screenshots), mark it ready for review.\n6. If everything works and the issue is fully done: merge the PR into `main` yourself (user-approved), then `git checkout main && git pull`. If anything is broken or open, don't merge; report back instead.\nOne issue = one branch = one PR. Don't mix issues.\n\n## Agent workflow (Unity MCP)\n\n- Don't edit C# while Unity is in Play Mode (a domain reload breaks statics).\n- Compile check: read `Logs/Editor.log` after the last \"Requested script compilation\" and grep `): error CS`.\n- `Unity_RunCommand` returns \"Unity not detected\" while compiling/reloading → just retry. System.Reflection is not allowed there.\n- Run menu items (`Voidward/Build All Content`, `Voidward/Build/...`) via ManageMenuItem, not RunCommand. Exception: dev builds, see the testing playbook.\n- Never call `AssetDatabase.Refresh`/`ImportAsset` in Play Mode: it can trigger a script recompile + domain reload that breaks the session (UIRoot NREs). Shader tweaks: exit Play Mode first, or check them in Edit Mode (render a quad with the material).\n- Target: zero console errors/warnings from Voidward code. Known foreign noise: AI Inference tensor warnings, PreviewRenderUtility leak.\n- Unity skills (`.agents/skills`, from `Unity-Technologies/skills`, lock: `skills-lock.json`): use them as domain knowledge only. Implement their recommendations in the builder code (`ContentBuilder`/`PrefabBuilder`/`SceneBuilder`) or in runtime code, never as direct edits to generated scenes/prefabs/assets. Update: `npx skills update -p`.\n\n## Cross-platform (Mac + Windows)\n\n- Same Unity version on both machines (`ProjectSettings/ProjectVersion.txt`). Line endings are pinned to LF via `.gitattributes`.\n- Before switching machines: commit + push. On the other machine: `git pull` first, then open Unity.\n- `.mcp.json` is git-ignored (machine-specific Unity relay path); each machine keeps its own.\n- GitHub: use the GitHub CLI (`gh`, logged in via `gh auth login --web`) for issues, PRs and merges. No GitHub MCP server (its OAuth needs dynamic client registration, which Claude Code can't do with GitHub). On Windows, `gh` lives at `C:\\Program Files\\GitHub CLI\\gh.exe` (call it by full path if PATH isn't refreshed yet).\n- Blender: Windows `C:\\Program Files\\Blender Foundation\\Blender 5.2\\blender.exe`; Mac `/Applications/Blender.app/Contents/MacOS/Blender` (install the same 5.2 version there).\n\n---\n\n[Journey & game design](journey.md) | [Architecture & systems](architecture.md) | [Development workflow](development.md) | [Art & asset pipeline](art-and-assets.md) | [Testing playbook](testing.md) | [Status & priorities](status.md) | [Wiki maintenance](maintenance.md)\n"}, {"title": "Art & Asset-Pipeline", "eyebrow": "Visuelle Identität", "summary": "Low Poly, flat-shaded mit gemeinsamer Farbpalette (Variante A, #120). Ältere PBR- und Scan-Assets aus #91-#100 werden schrittweise ersetzt.", "highlights": [["Stilregeln", "Harte Facetten, Farbe pro Fläche aus der Palette, Leuchten über Emission; keine Foto-Texturen oder Normal-Maps."], ["Quelle & Lizenz", "Low-Poly-Packs (Quaternius, Kenney, Poly Pizza) oder eigenes Blender-Skript; Auswahl mit dem Nutzer abstimmen."], ["Im Spiel beurteilen", "Neben einem schon umgestellten Asset rendern und Vorher/Nachher-Bilder ablegen."]], "flow": ["Auswahl", "Quelldaten", "Blender + Palette", "Builder", "Spielansicht"], "images": [{"path": "Docs/screenshots/lowpoly-audit/04_stilvarianten.jpg", "caption": "#120 · Stilentscheidung 2026-10-17: links der a
