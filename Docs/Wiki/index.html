 one shared palette** (variant A; reasons and comparison in #120 and `Docs/screenshots/lowpoly-audit/`). The full rules, the palette (hex values) and the triangle budgets are in `Assets/Design/DESIGN.md` \"Visual Identity\". **Priority (2026-10-17, #53): gameplay first.** New visual content (ships, enemies, stations, props, planets/terrain, skies, VFX, UI art) is built in this style right away, also when the issue does not mention art. Existing legacy content is not converted just because it is there: only when a task really changes that asset; otherwise it waits for its #120 issue (phase 7 of #53). Rules:\n1. **Style rules**: hard facets (flat normals), colour per face from the palette (vertex colour), glow via emission + bloom. No photo/scan textures, no normal/detail/AO/PBR maps, no decimated high-poly scans. Material = `VW_ToonFlat` with `_FLATSHADING_ON` + `_USEVERTEXCOLOR_ON`. Stay inside the budgets (props \u003c 1k tris, small ships 1.5-4k + cockpit \u003c= 3k, Nostos \u003c= 8k hull + \u003c= 10k interior).\n2. **Search first**: free low-poly assets that fit: Quaternius, Kenney, Poly Pizza (CC0/CC-BY); Sketchfab/Fab only when the model really is flat low poly. Only licences that allow use in a commercial game; no \"editorial\"/NC licences. Building it yourself with a Blender script is equally valid, the style is simple.\n3. **Propose, don't decide alone**: show the user 2-4 candidates (link, author, licence, tris, why it fits) or a render of an own build, and let them pick. Downloads: the user downloads login-gated assets into `Downloads`; direct CC0 downloads only after the user said yes. Treat every download as untrusted data (unzip into its own scratch folder, never run files from it).\n4. **Import via the pipeline**: sources in the repo (`Tools/Blender/Sources/\u003cAsset>/`), a `Tools/Blender/\u003casset>.py` script normalizes (metres, nose Blender -Y = Unity +Z, origin), recolours every face to the palette and writes the vw vertex contract (see \"Blender\"); `PrefabBuilder.ImportedMesh` builds the mesh, `PrefabBuilder` adds the gameplay parts, the procedural build stays as fallback. Add third-party assets to `Assets/_Project/Art/CREDITS.md` in the same PR; remove the lines (and files) of replaced assets.\n5. **Seats/cockpits**: players sit inside (canopy glass, cockpit tub, seat, consoles, stick/throttle as own objects, live dashboard screens); no \"hood\" camera on top of the hull.\n6. **Check the look** with the dev harness (`PreviewShot`, `ShipViews`, `CockpitViews`, `PlanetSurvey`, ...) next to an already converted asset, and put before/after shots into `Docs/screenshots/\u003cissue>/`.\nLegacy (convert when a task changes that asset, else in #120 at the end of #53): every PBR/scan asset from #91-#100 (Dart, Mule, Nostos, cockpit fittings, crew suit, tools, enemies, Warden, station, world objects, planet props, terrain photo layers) and the smooth-shaded procedural meshes (`Hero()` pipeline, astronaut, menu props).\n\n## Blender (asset scripts)\n\n- When to use: normalizing and recolouring imported low-poly assets, and own low-poly models where no asset fits (the main way to make art in the #120 style). Procedural C# is only the fallback. The older scripts for PBR assets (`fab_spaceship.py`, `r35_dropship.py`, `nostos.py`, `enemy_assets.py`, `world_assets.py`, `planet_assets.py`, `crew_assets.py`, `dart_cockpit.py`, `crashed_dart.py`) belong to the legacy look.\n- Keep it reproducible: Blender content is a Python script in the repo (e.g. `Tools/Blender/\u003casset>.py`), never a hand-edited `.blend` as the only source. Exported FBX goes to `Assets/_Project/Art/Models/` and is committed (Unity must build without Blender); `PrefabBuilder` references it.\n- Run headless: `blender -b --factory-startup -P script.py -- \u003cargs>`. In 5.2, FBX export applies modifiers via `use_mesh_modifiers=True` (not `apply_modifiers`). Unity is Y-up / Blender Z-up: export with `axis_forward='-Z', axis_up='Y'` and check scale (1 unit = 1 m).\n- Shared helpers: `Tools/Blender/vw_blender.py` (skin skeletons, warp, displacement, Cycles AO bake, export). Vertex data contract: colour attribute `Col` (sRGB) = base colour, UV map `surf` = (gloss, glow), UV map `detail` = (metal, baked AO; low-poly assets leave AO at 1); model faces Blender -Y (becomes Unity +Z; Blender +X becomes Unity -X). `PrefabBuilder.ImportedMesh` converts such an FBX to the MeshBuilder layout (C# meshes stay as fallback). Example: `Tools/Blender/aliens.py`.\n- After a first open/reimport on a machine, check `git status` before committing: reimport noise (package `.meta` files, emptied `m_List` in `UniversalRenderPipelineGlobalSettings.asset`) must not be committed.\n\n## Visual examples\n\n![Vergleich heutiger PBR-Look gegen drei Low-Poly-Varianten von Landschaft und Dart](../../Docs/screenshots/lowpoly-audit/04_stilvarianten.jpg)\n\n#120 · Stilentscheidung 2026-10-17: links der alte PBR-Look, daneben die Varianten A (gewählt), B und C als schnelle automatische Umwandlung desselben Darts und einer Testlandschaft.\n\n![Raster aus zwölf aktuellen Assets wie Dart, Mule, Nostos, Crew-Anzug, Station und Loot-Kiste](../../Docs/screenshots/lowpoly-audit/01_passt_nicht_assets.jpg)\n\n#120 · Audit: diese PBR- und Scan-Assets aus #91-#100 passen nicht zum Low-Poly-Stil und werden in #122-#127 ersetzt.\n\n![Planetenvergleich mit verschiedenen Biomen und Betrachtungsdistanzen](../../Docs/screenshots/issue-115/provinces_all_biomes.jpg)\n\n#115 · Terrainformen über mehrere Biome. Die Formen bleiben; die Foto-Bodentexturen werden in #124 durch den facettierten Look ersetzt.\n\n---\n\n[Journey & game design](journey.md) | [Architecture & systems](architecture.md) | [Development workflow](development.md) | [Art & asset pipeline](art-and-assets.md) | [Testing playbook](testing.md) | [Status & priorities](status.md) | [Wiki maintenance](maintenance.md)\n"}, {"title": "Tests & visuelle Prüfung", "eyebrow": "Verifizieren", "summary": "Eine konkrete Situation prüfen, statt einen ganzen Run durchzuspielen. Das Dev-Harness liefert Szenarien, reproduzierbare Aktionen und Kontaktbögen.", "highlights": [["Edit Mode", "Materialien und einfache Ansichten möglichst ohne Spielsitzung prüfen."], ["QuickStart", "Passendes Szenario öffnen, die Situation auslösen und Logs oder Ansichten prüfen."], ["Multiplayer", "Bei RPCs, NetworkVariables und Authority zusätzlich Host und Client vergleichen."]], "flow": ["Szenario", "Aktion", "Log / Screenshot", "Beurteilen"], "images": [{"path": "Docs/screenshots/issue-115/after_ingame_ice.jpg", "caption": "#115 · Kontaktbogen eines Eisplaneten: Boden, Flug und Orbit in einer Übersicht. Ein vorhandenes Prüfartefakt, kein Nachweis für einen neuen Testlauf.", "alt": "Sechs Spielansichten eines Eisplaneten mit HUD in Boden- und Orbitperspektiven"}], "id": "testing", "audience": "developer", "html": "\u003ch2 id=\"ref-0\">Testing playbook (dev harness, #65)\u003c/h2>\u003cp>Goal: test the situation, not a whole run, and keep tool output small. Harness = \u003ccode>Scripts/Dev\u003c/code> (\u003ccode>Voidward.Dev\u003c/code>, editor + development builds only).\u003c/p>\u003cul>\u003cli>\u003cstrong>Pick the cheapest level\u003c/strong>: shader/particle look → Edit Mode (render a quad / \u003ccode>DevShots.Shot(name, pose)\u003c/code> works outside Play Mode) or the Lab; gameplay in context → \u003ccode>QuickStart\u003c/code> + a few shots; MP only when RPCs/NetworkVariables/authority changed.\u003c/li>\u003c/ul>\u003cdetails id=\"ref-1\">\u003csummary>Start\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>(one RunCommand line from Edit Mode, survives the domain reload): \u003ccode>Voidward.Dev.DevTest.Play(Voidward.Dev.DevScenario.Lab)\u003c/code>; then \u003ccode>bash Tools/Dev/dev-wait.sh quickstart\u003c/code> (no sleeps). Scenarios: \u003ccode>Space\u003c/code> (pilot seat), \u003ccode>Planet\u003c/code> (on foot, sunlit dry ground, blaster, god mode), \u003ccode>Lab\u003c/code> (5 test walls Metal/Rock/Dirt/Organic/Shield next to the trader station, same on every peer), \u003ccode>Galaxy\u003c/code> (pilot seat, galaxy map open). Already playing: \u003ccode>DevTest.QuickStart(...)\u003c/code>. Humans: menu \u003ccode>Voidward/Dev/Play: ...\u003c/code>.\u003c/p>\u003c/div>\u003c/details>\u003cul>\u003cli>\u003cstrong>Act\u003c/strong>: \u003ccode>DevTest.Fire(kind, from, to)\u003c/code> (server, dmg 0), \u003ccode>Hitscan(from, to)\u003c/code>, \u003ccode>PawnShoot(target, rifle)\u003c/code> + \u003ccode>GroundAhead(dist, side)\u003c/code>, \u003ccode>SpawnEnemy(kind, pos, lookAt)\u003c/code>, \u003ccode>Teleport\u003c/code>, \u003ccode>God\u003c/code>, \u003ccode>ClearDecals\u003c/code>, \u003ccode>DecalCount\u003c/code>; damage taken: \u003ccode>HurtPawn(amount, fromDir)\u003c/code> / \u003ccode>HurtShip(amount, fromDir)\u003c/code> (server hit from a world direction, ignores god mode; ship = shield first), \u003ccode>SetVitals(health01, shield01)\u003c/code>; lab: \u003ccode>LabTargets[i]\u003c/code>, \u003ccode>LabGun(i)\u003c/code>, \u003ccode>LabCam\u003c/code>, \u003ccode>LabClose(i)\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Journey (#46)\u003c/strong>: \u003ccode>GotoGalaxy(g, s)\u003c/code> / \u003ccode>GotoSystem(s)\u003c/code> (server, instant warp, logs \u003ccode>[Dev] end goto &lt;SystemInfo&gt;\u003c/code>), \u003ccode>SystemInfo\u003c/code> (galaxy, system, kind, planets, visited, run time), \u003ccode>GalaxySystems\u003c/code> (&quot;0:Planetary 1:Nomads ...&quot;), \u003ccode>SaveRun()\u003c/code> / \u003ccode>HasRunSave\u003c/code>; continue test: \u003ccode>ServerReturnToLobby()\u003c/code> then \u003ccode>SessionManager.Instance.ContinueRun()\u003c/code>. Ending a run (\u003ccode>EndRun\u003c/code>) records it in the real meta save: \u003ccode>BackupMeta()\u003c/code> first, \u003ccode>RestoreMeta()\u003c/code> after.\u003c/li>\u003c/ul>\u003cdetails id=\"ref-2\">\u003csummary>\u003cstrong>Warp drive (#78)\u003c/strong>\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>\u003ccode>SetDrive(tier)\u003c/code> / \u003ccode>SetDrive(core, nav, cooling, tank)\u003c/code>, \u003ccode>SetFuel(x)\u003c/code> (server), \u003ccode>DriveInfo\u003c/code> (&quot;core 2 nav 2 cool 1 tank 1 | exotic 4/12 | next 10:00 (8) skip ... home ... | factor 1.08&quot;); warp with \u003ccode>RunManager.Instance.ServerWarp(RunManager.WarpNextGalaxy / WarpSkipGalaxy)\u003c/code> (aborts without fuel unless god mode). MP: with \u003ccode>-devshots\u003c/code> the client also logs \u003ccode>[Dev] client&lt;id&gt;_&lt;t&gt; galaxy G drive &lt;DriveInfo&gt;\u003c/code> (compare with the host). Pure ETA numbers need no Play Mode: \u003ccode>DriveMath.Compute(ContentCatalog.Instance.WarpDrive, ...)\u003c/code> in Edit Mode.\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-3\">\u003csummary>\u003cstrong>Warp flight (#79)\u003c/strong>\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>scenario \u003ccode>Warp\u003c/code> (lead pilot in a flown warp M33 -&gt; M31, Mk II, cruising 60 %). \u003ccode>StartWarp(target)\u003c/code> (server, skips countdown, loads the fuel it needs; logs \u003ccode>[Dev] end warp &lt;WarpInfo&gt;\u003c/code>), \u003ccode>WarpInfo\u003c/code> (&quot;1 -&gt; 2 | 34.2/210.0 km 16% GALAXY HALO | throttle .. heat .. cruise .. stall .. hot .. | lead .. hazard .. | out .. | exotic .. | scan .. | destroyed ..&quot;), \u003ccode>WarpSegment(WarpZone)\u003c/code>, \u003ccode>WarpAhead(WarpHazard, dist)\u003c/code> (next obstacle of a kind \u003ccode>dist\u003c/code> m ahead), \u003ccode>WarpSignalAhead(dist)\u003c/code>, \u003ccode>WarpProgress(0..1)\u003c/code>, \u003ccode>SetThrottle(t, cruise)\u003c/code>, \u003ccode>WarpLeadTo(y, z)\u003c/code> (lead ship to a lateral lane), \u003ccode>WarpDropOut()\u003c/code> (server, as [G]: drop out at the signal in range / start the 5 s resume countdown; works without editor focus), \u003ccode>WarpPatrolAhead()\u003c/code> (bubble just before the next interceptor patrol chunk; they spawn once it moves). Slingshot test: hold the lead on a lane 2x the well radius beside a gravity well with a \u003ccode>Sequence\u003c/code> step calling \u003ccode>WarpLeadTo\u003c/code> + \u003ccode>SetThrottle\u003c/code> each frame (unpiloted, the well&#x27;s pull drags the ship into the core). Server log: \u003ccode>[Warp] begin/impact/slingshot/arrived\u003c/code>. A route is pure: \u003ccode>new WarpRoute(seed, from, to, length)\u003c/code> works in Edit Mode. MP: the client log line also carries \u003ccode>| warp &lt;WarpInfo&gt;\u003c/code>.\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-4\">\u003csummary>\u003cstrong>Cruise / hops (#80)\u003c/strong>\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>\u003ccode>Cruise(on, force)\u003c/code> (local pilot, skips the spool-up; respects the locks unless forced), \u003ccode>CruiseInfo\u003c/code> (&quot;cruise Cruising 993/1000 m/s | clear 2311 m Planet(Clone) | block - | spool 1.00&quot;), \u003ccode>SeatShip\u003c/code>, \u003ccode>ShipsCruise\u003c/code> (&quot;111:Cruising:993 112:Off:0&quot;, also in the MP client log line), \u003ccode>FacePlanet(i, clearance)\u003c/code> (server: ship \u003ccode>clearance\u003c/code> m outside planet i&#x27;s gravity lock, nose on it; negative = inside), \u003ccode>StartHop(system)\u003c/code> (server, skips countdown and locks; logs \u003ccode>[Dev] end hop &lt;WarpInfo&gt;\u003c/code>). The real spool path: call \u003ccode>SeatShip.Flight.SetCruiseInput(held, pressed)\u003c/code> per frame in a \u003ccode>Sequence\u003c/code>. Warp lock: a jump zone with an engaged enemy near it shows \u003ccode>Combat\u003c/code> in \u003ccode>JumpZoneInfo\u003c/code>. Server log: \u003ccode>[Warp] begin 1 -&gt; 1 system s\u003c/code>, \u003ccode>[Warp] arrived at system s\u003c/code>, \u003ccode>[Warp] interdicted: ...\u003c/code>.\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-5\">\u003csummary>\u003cstrong>Jump zones (#108)\u003c/strong>\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>\u003ccode>JumpZoneInfo\u003c/code> (&quot;entry - veil 0.00 crew-missing 0 align -1:0.00 | 0:Hop&gt;1 Open @5.0km 1:Rim&gt;-1 Fuel @6.9km ...&quot;), \u003ccode>FaceJumpZone(zone, distance)\u003c/code> (server: local pilot&#x27;s ship \u003ccode>distance\u003c/code> m before the zone plane, nose outward; negative = past it), \u003ccode>FlyOutJumpZone(zone, cruise, timeout)\u003c/code> (the real path: in front of the zone, then cruise through or, cruise false, sit just past the plane aligned for the 3 s timer; logs \u003ccode>[Dev] end jump after n s | &lt;WarpInfo&gt;\u003c/code> or FAILED with the zone state). Crew rule: \u003ccode>Pawn.CurrentShipSeat.RequestLeave()\u003c/code> -&gt; every zone \u003ccode>Crew\u003c/code>; re-seat with \u003ccode>Board(ShipClass.Dart)\u003c/code>. Fuel hold: \u003ccode>GotoSystem(last)\u003c/code> + \u003ccode>SetFuel(0)\u003c/code> + \u003ccode>FlyOutJumpZone(rim)\u003c/code> -&gt; FAILED, HUD &quot;JUMP ZONE HOLDS&quot;. Exit: during a flight \u003ccode>ServerSetProgress(Length - 500)\u003c/code>, then \u003ccode>CruiseInfo\u003c/code> / \u003ccode>JumpZoneInfo\u003c/code>. Server log: \u003ccode>[Jump] entry: ...\u003c/code>, \u003ccode>[Jump] rebased into the bubble around ... (n more ships)\u003c/code>, \u003ccode>[Warp] out of the bubble at ... (from system s)\u003c/code>. \u003ccode>StartWarp\u003c/code>/\u003ccode>StartHop\u003c/code>/\u003ccode>GotoSystem\u003c/code> keep the instant dev path.\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-6\">\u003csummary>\u003cstrong>Flight home / Rift (#81)\u003c/strong>\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>scenario \u003ccode>Finale\u003c/code> (lead pilot in the flight home LMC -&gt; Sol, Home Drive, the Rift awake, cruising 80 %). \u003ccode>StartFinale(tier)\u003c/code> (server, goes to galaxy 5 first, all parts at \u003ccode>tier\u003c/code>; logs \u003ccode>[Dev] end finale &lt;WarpInfo&gt;\u003c/code>), \u003ccode>RiftAt(seconds)\u003c/code> (server: Rift that many seconds behind, wakes it), \u003ccode>WardenWave()\u003c/code> (server: the last guard now), \u003ccode>RiftInfo\u003c/code> (&quot;rift 31.2 s 36.5 km @1170 m/s close 0.00 | from 0.0 km&quot;, also appended to \u003ccode>WarpInfo\u003c/code> and the MP client log line). \u003ccode>WarpProgress\u003c/code> keeps the Rift&#x27;s distance. A pilotless lead stalls on the first collision, so the Rift catches it: \u003ccode>God(true)\u003c/code> + \u003ccode>WarpSegment(WarpZone.Void)\u003c/code> for look tests, \u003ccode>BackupMeta()\u003c/code>/\u003ccode>RestoreMeta()\u003c/code> around an arrival or catch (both end the run). Look-back pose: \u003ccode>new DevPose(new Vector3(60, 25, 40), new Vector3(-800, 0, 0), 70)\u003c/code>. Server log: \u003ccode>[Warp] rift awake at\u003c/code>, \u003ccode>[Warp] warden wave: n\u003c/code>, \u003ccode>[Warp] caught by the rift at\u003c/code>, \u003ccode>[Warp] arrived at stop 6\u003c/code>.\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-7\">\u003csummary>\u003cstrong>Time loop (#86)\u003c/strong>\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>\u003ccode>KillCrew()\u003c/code> (server: every pawn lost = the real crew-wipe path; waits for collapse + logbook; logs \u003ccode>[Dev] end killcrew &lt;LoopInfo&gt;\u003c/code>), \u003ccode>NewLoop()\u003c/code> (host on the logbook, as the button; \u003ccode>[Dev] end newloop &lt;LoopInfo&gt;\u003c/code>), \u003ccode>LoopInfo\u003c/code> (&quot;loop 4 Playing seed .. | meta loops 3 best galaxy 2 best eta 36 h 20 min | log 1 | screen None | time 1.00&quot;), \u003ccode>Logbook\u003c/code> (server, one entry per line). Rift path: scenario \u003ccode>Finale\u003c/code> + \u003ccode>RiftAt(0.3f)\u003c/code>. Both record the run in the real meta save: \u003ccode>BackupMeta()\u003c/code> / \u003ccode>RestoreMeta()\u003c/code>. A \u003ccode>Sequence\u003c/code> started together with \u003ccode>KillCrew\u003c/code> samples in scaled time, so the slow-mo collapse fits in its first ~0.5 s.\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-8\">\u003csummary>\u003cstrong>Loot / music / meta (#43)\u003c/strong>\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>\u003ccode>DropLoot(id, from, count)\u003c/code> (server; pops out of \u003ccode>from\u003c/code> like an enemy drop), \u003ccode>DropRarityRow(from)\u003c/code> (one item per rarity, ids in \u003ccode>RarityItems\u003c/code>), \u003ccode>LootCount\u003c/code>, \u003ccode>LootMagnetized\u003c/code>, \u003ccode>ClearLoot()\u003c/code>; music: \u003ccode>SetThreat(level01, boss, seconds)\u003c/code> (client override of \u003ccode>Threat\u003c/code>, -1 clears), \u003ccode>MusicState\u003c/code> / \u003ccode>LogMusic(tag)\u003c/code> (threat + combat/boss stem mix); meta: \u003ccode>BackupMeta()\u003c/code> -&gt; \u003ccode>AddMemories(n)\u003c/code> -&gt; ... -&gt; \u003ccode>RestoreMeta()\u003c/code> (the meta save is the real local save). Currency (#112): \u003ccode>SalvageInfo\u003c/code> (&quot;0:80 1:105&quot;, also in the MP client log line as \u003ccode>| salvage ...\u003c/code>). Perk unlock UI: push \u003ccode>UIRoot.Instance.Push(Screen.Hangar)\u003c/code> from the main menu and invoke an \u003ccode>Unlock (..)\u003c/code> button&#x27;s onClick inside a \u003ccode>Sequence\u003c/code>.\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-9\">\u003csummary>\u003cstrong>Planets (#70)\u003c/strong>\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>\u003ccode>DevTest.PlanetSurvey(name, shapes, views, radius, seed)\u003c/code> (play mode, any phase) builds each \u003ccode>PlanetShapeDef\u003c/code> as a temporary planet far outside the sector, drives the main camera through the \u003ccode>PlanetView\u003c/code> flags (Orbit, Limb, Flight 300 m, Ground, Shore) so LOD/decor/ambience react like in game, and writes ONE sheet (row = shape, column = view, no HUD). Shapes: \u003ccode>DevTest.CatalogShapes()\u003c/code> or load \u003ccode>Data/Planets/Planet_&lt;id&gt;.asset\u003c/code> via AssetDatabase. Use it as before/after for any planet shader or preset change. \u003ccode>PlanetView.Ground | PlanetView.Shore\u003c/code> with 4 shapes = a sheet readable at full size. \u003ccode>DevTest.TerrainLayerCost(seconds)\u003c/code> = frame time with the PBR layers on vs off at the current view (\u003ccode>[Dev] end terraincost on X ms off Y ms\u003c/code>, editor numbers: compare only).\u003c/p>\u003c/div>\u003c/details>\u003cul>\u003cli>\u003cstrong>Low-poly ships (#122)\u003c/strong>: Edit Mode \u003ccode>ContentBuilder.PreviewLowPoly(&quot;Dart&quot;|&quot;Mule&quot;, cams[], targets[], fov)\u003c/code> builds the ship without saving any prefab and renders \u003ccode>Temp/HeroShots/&lt;ship&gt;_LP_&lt;i&gt;.png\u003c/code> (camera/target in ship space), then reopens \u003ccode>Voidward.unity\u003c/code>. Single prefabs must not be saved on their own (SavePrefab recreates the asset: new GlobalObjectIdHash), so ship changes end with Build All Content.\u003c/li>\u003c/ul>\u003cdetails id=\"ref-10\">\u003csummary>\u003cstrong>Cockpit (#94)\u003c/strong>\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>\u003ccode>DevTest.PilotView(name)\u003c/code> renders the player&#x27;s current view (main camera pose + FOV, no HUD) at 1920x1080 to \u003ccode>%TEMP%/VoidwardDev/name.jpg\u003c/code> (judge display readability there, the editor game view is tiny); \u003ccode>DevTest.InteractPrompt\u003c/code> = the local pawn&#x27;s [F] prompt. \u003ccode>DevTest.CockpitViews(name)\u003c/code> = one sheet of four views from the seated eye (back over the seat, left shoulder, up through the canopy, right console). Seat test: \u003ccode>Pawn.CurrentShipSeat.RequestLeave()\u003c/code>, then \u003ccode>Teleport\u003c/code> around the ship (feet = eye - up x 1.62) inside a \u003ccode>Sequence\u003c/code> and log \u003ccode>InteractPrompt\u003c/code> per spot.\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-11\">\u003csummary>\u003cstrong>Mule / Ark (#97)\u003c/strong>\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>\u003ccode>DevTest.Board(ShipClass, role, claim, index)\u003c/code> (server: the local player sits in the index-th seat of that role of a ship of that class, a working one before a derelict; spawns one 45 m beside the player&#x27;s ship if none exists; claim = restore a derelict first; logs \u003ccode>[Dev] end board ...\u003c/code>), \u003ccode>SetDerelict(cls, on)\u003c/code> (server, ShipDerelictLook test). \u003ccode>CockpitViews\u003c/code> / \u003ccode>SeatBodyViews\u003c/code> take the occupied seat&#x27;s view point when no eyeZ is given (Mule eye (0, 0.55, 3.3), Ark (0, 0.2, 14.6)). Mule as warp lead: \u003ccode>Board(ShipClass.Mule)\u003c/code> then \u003ccode>StartWarp()\u003c/code>. Walk test inside the Ark: leave the seat, then \u003ccode>Teleport\u003c/code> to ship-local spots in a \u003ccode>Sequence\u003c/code> (repeat \u003ccode>RequestLeave\u003c/code> while still seated after boarding two ships) and log \u003ccode>InteractPrompt\u003c/code>; deck floor y -1.55, pilot platform -1.16. After an editor restart check the active scene (\u003ccode>Voidward.unity\u003c/code>): an empty Untitled scene starts a run without players (\u003ccode>end quickstart FAILED: no local pawn\u003c/code>).\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-12\">\u003csummary>\u003cstrong>Home ship Nostos (#49)\u003c/strong>\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>scenario \u003ccode>Nostos\u003c/code> (at the Nostos helm, own Dart docked; \u003ccode>Space\u003c/code>/\u003ccode>Lab\u003c/code>/\u003ccode>Galaxy\u003c/code> launch the Dart first, \u003ccode>Warp\u003c/code>/\u003ccode>Finale\u003c/code> board the Nostos). \u003ccode>HomeInfo\u003c/code> (&quot;Nostos hull 990/990 shield 380 | clamps 0:84 1:- 2:- 3:- | pods 4 | cryo 4 | pilot 0 | me Dart docked 0&quot;), \u003ccode>Launch()\u003c/code> / \u003ccode>Dock(clamp)\u003c/code> (server, the local player&#x27;s ship), \u003ccode>CryoTest()\u003c/code> (lethal hit, waits for the cryo wake-up; \u003ccode>[Dev] end cryo pod i at d m | inside True ...\u003c/code>), \u003ccode>DestroyHome()\u003c/code> (ends the loop; \u003ccode>BackupMeta()\u003c/code>/\u003ccode>RestoreMeta()\u003c/code> around it). Real dock path: seat in the Dart, \u003ccode>Launch()\u003c/code>, then put it a few m above a free clamp with zero velocity and call \u003ccode>Flight.SetPilotInput(zero...)\u003c/code> every frame in a \u003ccode>Sequence\u003c/code> (the clamp grabs it). Leave a docked Dart&#x27;s seat -&gt; the pawn stands at the clamp&#x27;s hatch inside. Heavy landing: put the Nostos 80 m over the ground with -30 m/s while piloted and log \u003ccode>Flight.Altitude\u003c/code> + the descent. Edit Mode: \u003ccode>ContentBuilder.PreviewShot(&quot;Ship_Nostos&quot;, camLocal, targetLocal, fov, name)\u003c/code> (deck y -2.33; hall z -9.4..6.4, cryo 6.4..9.9, bridge 9.9..25.3, engine room -16..-9.4).\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-13\">\u003csummary>\u003cstrong>Crew body (#95)\u003c/strong>\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>\u003ccode>DevTest.BodyViews(name)\u003c/code> (the local on-foot body as others see it, 4 views incl. the tool hand), \u003ccode>DevTest.WalkViews(name)\u003c/code> (scenario \u003ccode>Planet\u003c/code>: carried along the ground at walk/jog/sprint/backwards, one tile each, wait with \u003ccode>dev-wait.sh name\u003c/code>), \u003ccode>DevTest.SeatBodyViews(name)\u003c/code> (seated body from outside: side, front, stick hand, throttle hand), \u003ccode>DevTest.CrewInfo\u003c/code> (&quot;0:Ground/1/0 6.0 Move 1:seat Pilot Sit&quot;, also in the MP client log line as \u003ccode>| crew ...\u003c/code>). \u003ccode>GroundAhead\u003c/code> ignores the pawn&#x27;s own colliders. Body renderers of the owner only cast shadows: the view helpers switch them on for the shot.\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-14\">\u003csummary>\u003cstrong>Enemies (#98)\u003c/strong>\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>\u003ccode>DevTest.SpawnEnemy(kind, pos, lookAt)\u003c/code> per type (Planet scenario: \u003ccode>GroundAhead(dist, side)\u003c/code>), \u003ccode>DevTest.SpawnWarden(ahead)\u003c/code> (server: the real enclave wake-up path anywhere, 260 m ahead of the local ship; logs \u003ccode>[Dev] end warden &lt;pos&gt;\u003c/code>). Edit Mode: \u003ccode>ContentBuilder.PreviewClips(prefab, clips, normalizedTimes, camLocal, targetLocal, fov)\u003c/code> samples a rigged prefab&#x27;s clips into \u003ccode>Temp/HeroShots/&lt;prefab&gt;_&lt;clip&gt;_&lt;i&gt;.png\u003c/code> and logs \u003ccode>[Voidward] Preview ... posed bones min/max\u003c/code> (feet near y 0). Check a rig&#x27;s FBX export by bone positions / bind poses, not by \u003ccode>BakeMesh\u003c/code> (double-scales).\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-15\">\u003csummary>\u003cstrong>World objects (#99)\u003c/strong>\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>\u003ccode>DevTest.SpawnPoi(kind, ahead, side)\u003c/code> (server: &quot;Ruin&quot;, &quot;Crash&quot;, &quot;Nest&quot;, &quot;Wreck&quot;, &quot;Station&quot;, &quot;Crate&quot;, &quot;Ore&quot;/&quot;Crystal&quot;/&quot;Scrap&quot;/&quot;Fuel&quot; nodes, &quot;Pickup:&lt;item id&gt;&quot; on the ground in front of the pawn; logs \u003ccode>[Dev] end poi &lt;kind&gt; &lt;pos&gt;\u003c/code>); frame a shot by the spawned object&#x27;s renderer bounds (hilly planets make fixed poses useless). Station walk test: scenario \u003ccode>Lab\u003c/code>, \u003ccode>RequestLeave\u003c/code>, \u003ccode>Teleport(station.TransformPoint(0, -6.4, 46), station.up, -station.forward)\u003c/code> -&gt; \u003ccode>InteractPrompt\u003c/code> = &quot;[F] Trade&quot;. Crate lid: \u003ccode>LootCrate.Interact(null)\u003c/code> opens only within 8 m of the host pawn. Edit Mode: \u003ccode>ContentBuilder.PreviewShot(&quot;TraderStation&quot; | &quot;Wreck&quot; | &quot;Ruin&quot; | ...)\u003c/code>.\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-16\">\u003csummary>\u003cstrong>Light / sky / VFX (#96)\u003c/strong>\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>\u003ccode>DevTest.ShipViews(name)\u003c/code> (seated ship from outside: front three-quarter, rear, wide with the sky, close along the hull), \u003ccode>DevTest.VfxViews(name, distance)\u003c/code> (explosion, muzzle burst, metal/rock/laser impacts, shield hit/break in front of the ship, 6 tiles over 2.5 s; use distance ~22 to judge them; wait with \u003ccode>dev-wait.sh name\u003c/code>). \u003ccode>DevTest.ProjectileViews(name)\u003c/code> (scenario \u003ccode>Space\u003c/code>, server: laser, enemy laser, blaster, missile, flak, boss orb fly across a side camera, 4 tiles over 0.4 s). Reflections: put URP/Lit metal spheres (metallic 1, smoothness 0.95/0.7/0.4) in front of the ship and \u003ccode>Shot\u003c/code> them.\u003c/p>\u003c/div>\u003c/details>\u003cul>\u003cli>\u003cstrong>Look\u003c/strong>: \u003ccode>DevTest.Sequence(&quot;name&quot;, seconds, (frame, t) =&gt; {...}, new[] { 0.1f, 0.5f, 2f }, DevTest.LabCam)\u003c/code> runs the step every frame and writes ONE contact sheet (640x360 tiles; pose = free camera, omit it for the player&#x27;s screen incl. HUD) to \u003ccode>%TEMP%/VoidwardDev/name.jpg\u003c/code>; wait with \u003ccode>dev-wait.sh name\u003c/code>. Read sheets instead of many full screenshots. \u003ccode>DevTest.Screen(name)\u003c/code> = single downscaled screen grab.\u003c/li>\u003cli>\u003cstrong>Log protocol\u003c/strong>: every call logs \u003ccode>[Dev] begin &lt;tag&gt;\u003c/code> synchronously and \u003ccode>[Dev] end &lt;tag&gt; ...\u003c/code> (or \u003ccode>FAILED\u003c/code>) when done; \u003ccode>dev-wait.sh &lt;tag&gt; [timeout]\u003c/code> prints the end line (\u003ccode>VW_LOG=&lt;file&gt;\u003c/code> for a client log).\u003c/li>\u003cli>\u003cstrong>Dev build without log flood\u003c/strong>: RunCommand \u003ccode>Voidward.EditorTools.DevBuild.WindowsDevQuiet()\u003c/code> (Mac: \u003ccode>MacDevQuiet()\u003c/code>), returns one line; the menu build via RunCommand returns ~150k chars of foreign shader warnings. \u003ccode>EditorApplication.delayCall\u003c/code> does not fire while the editor is in the background, don&#x27;t rely on it.\u003c/li>\u003cli>\u003cstrong>MP\u003c/strong>: \u003ccode>DevTest.Play(DevScenario.Lab, 2)\u003c/code> (host waits for 2 players), then \u003ccode>bash Tools/Dev/mp-client.sh lab 3\u003c/code> (dev build with \u003ccode>-autojoin -skipintro -devscenario=lab -devshots=3\u003c/code>; it renders the lab camera every 3 s and logs \u003ccode>[Dev] client1_&lt;t&gt; decals N\u003c/code> into \u003ccode>%TEMP%/VoidwardDev/client.log\u003c/code>). Compare host/client via log lines, look at one client image at most. Stop: \u003ccode>Stop-Process -Name Voidward\u003c/code> / \u003ccode>pkill -f Voidward.app\u003c/code>.\u003c/li>\u003cli>Write a test step as a small RunCommand using the harness; if a helper is missing, add it to \u003ccode>DevTest\u003c/code> instead of pasting long ad-hoc scripts.\u003c/li>\u003cli>\u003cstrong>Keep the harness growing\u003c/strong>: when a feature brings its own typical test steps (e.g. spawn a boss phase, open a crate, dock at a station), add them as \u003ccode>DevTest\u003c/code> helpers or a new \u003ccode>DevScenario\u003c/code> in the same PR, so later issues reuse them. Document every new helper, scenario or flag here (one line is enough) - this section is how the next session learns about it.\u003c/li>\u003c/ul>", "toc": [{"id": "ref-0", "title": "Testing playbook (dev harness, #65)"}, {"id": "ref-1", "title": "Start"}, {"id": "ref-2", "title": "Warp drive (#78)"}, {"id": "ref-3", "title": "Warp flight (#79)"}, {"id": "ref-4", "title": "Cruise / hops (#80)"}, {"id": "ref-5", "title": "Jump zones (#108)"}, {"id": "ref-6", "title": "Flight home / Rift (#81)"}, {"id": "ref-7", "title": "Time loop (#86)"}, {"id": "ref-8", "title": "Loot / music / meta (#43)"}, {"id": "ref-9", "title": "Planets (#70)"}, {"id": "ref-10", "title": "Cockpit (#94)"}, {"id": "ref-11", "title": "Mule / Ark (#97)"}, {"id": "ref-12", "title": "Home ship Nostos (#49)"}, {"id": "ref-13", "title": "Crew body (#95)"}, {"id": "ref-14", "title": "Enemies (#98)"}, {"id": "ref-15", "title": "World objects (#99)"}, {"id": "ref-16", "title": "Light / sky / VFX (#96)"}], "search": "\u003c!-- Generated by Tools/Docs/build_wiki.py from AGENTS.md. Do not edit. -->\n\n# Testing playbook\n\n[Wiki home](README.md) | [Edit source](../../AGENTS.md)\n\n## Testing playbook (dev harness, #65)\n\nGoal: test the situation, not a whole run, and keep tool output small. Harness = `Scripts/Dev` (`Voidward.Dev`, editor + development builds only).\n- **Pick the cheapest level**: shader/particle look → Edit Mode (render a quad / `DevShots.Shot(name, pose)` works outside Play Mode) or the Lab; gameplay in context → `QuickStart` + a few shots; MP only when RPCs/NetworkVariables/authority changed.\n- **Start** (one RunCommand line from Edit Mode, survives the domain reload): `Voidward.Dev.DevTest.Play(Voidward.Dev.DevScenario.Lab)`; then `bash Tools/Dev/dev-wait.sh quickstart` (no sleeps). Scenarios: `Space` (pilot seat), `Planet` (on foot, sunlit dry ground, blaster, god mode), `Lab` (5 test walls Metal/Rock/Dirt/Organic/Shield next to the trader station, same on every peer), `Galaxy` (pilot seat, galaxy map open). Already playing: `DevTest.QuickStart(...)`. Humans: menu `Voidward/Dev/Play: ...`.\n- **Act**: `DevTest.Fire(kind, from, to)` (server, dmg 0), `Hitscan(from, to)`, `PawnShoot(target, rifle)` + `GroundAhead(dist, side)`, `SpawnEnemy(kind, pos, lookAt)`, `Teleport`, `God`, `ClearDecals`, `DecalCount`; damage taken: `HurtPawn(amount, fromDir)` / `HurtShip(amount, fromDir)` (server hit from a world direction, ignores god mode; ship = shield first), `SetVitals(health01, shield01)`; lab: `LabTargets[i]`, `LabGun(i)`, `LabCam`, `LabClose(i)`.\n- **Journey (#46)**: `GotoGalaxy(g, s)` / `GotoSystem(s)` (server, instant warp, logs `[Dev] end goto \u003cSystemInfo>`), `SystemInfo` (galaxy, system, kind, planets, visited, run time), `GalaxySystems` (\"0:Planetary 1:Nomads ...\"), `SaveRun()` / `HasRunSave`; continue test: `ServerReturnToLobby()` then `SessionManager.Instance.ContinueRun()`. Ending a run (`EndRun`) records it in the real meta save: `BackupMeta()` first, `RestoreMeta()` after.\n- **Warp drive (#78)**: `SetDrive(tier)` / `SetDrive(core, nav, cooling, tank)`, `SetFuel(x)` (server), `DriveInfo` (\"core 2 nav 2 cool 1 tank 1 | exotic 4/12 | next 10:00 (8) skip ... home ... | factor 1.08\"); warp with `RunManager.Instance.ServerWarp(RunManager.WarpNextGalaxy / WarpSkipGalaxy)` (aborts without fuel unless god mode). MP: with `-devshots` the client also logs `[Dev] client\u003cid>_\u003ct> galaxy G drive \u003cDriveInfo>` (compare with the host). Pure ETA numbers need no Play Mode: `DriveMath.Compute(ContentCatalog.Instance.WarpDrive, ...)` in Edit Mode.\n- **Warp flight (#79)**: scenario `Warp` (lead pilot in a flown warp M33 -> M31, Mk II, cruising 60 %). `StartWarp(target)` (server, skips countdown, loads the fuel it needs; logs `[Dev] end warp \u003cWarpInfo>`), `WarpInfo` (\"1 -> 2 | 34.2/210.0 km 16% GALAXY HALO | throttle .. heat .. cruise .. stall .. hot .. | lead .. hazard .. | out .. | exotic .. | scan .. | destroyed ..\"), `WarpSegment(WarpZone)`, `WarpAhead(WarpHazard, dist)` (next obstacle of a kind `dist` m ahead), `WarpSignalAhead(dist)`, `WarpProgress(0..1)`, `SetThrottle(t, cruise)`, `WarpLeadTo(y, z)` (lead ship to a lateral lane), `WarpDropOut()` (server, as [G]: drop out at the signal in range / start the 5 s resume countdown; works without editor focus), `WarpPatrolAhead()` (bubble just before the next interceptor patrol chunk; they spawn once it moves). Slingshot test: hold the lead on a lane 2x the well radius beside a gravity well with a `Sequence` step calling `WarpLeadTo` + `SetThrottle` each frame (unpiloted, the well's pull drags the ship into the core). Server log: `[Warp] begin/impact/slingshot/arrived`. A route is pure: `new WarpRoute(seed, from, to, length)` works in Edit Mode. MP: the client log line also carries `| warp \u003cWarpInfo>`.\n- **Cruise / hops (#80)**: `Cruise(on, force)` (local pilot, skips the spool-up; respects the locks unless forced), `CruiseInfo` (\"cruise Cruising 993/1000 m/s | clear 2311 m Planet(Clone) | block - | spool 1.00\"), `SeatShip`, `ShipsCruise` (\"111:Cruising:993 112:Off:0\", also in the MP client log line), `FacePlanet(i, clearance)` (server: ship `clearance` m outside planet i's gravity lock, nose on it; negative = inside), `StartHop(system)` (server, skips countdown and locks; logs `[Dev] end hop \u003cWarpInfo>`). The real spool path: call `SeatShip.Flight.SetCruiseInput(held, pressed)` per frame in a `Sequence`. Warp lock: a jump zone with an engaged enemy near it shows `Combat` in `JumpZoneInfo`. Server log: `[Warp] begin 1 -> 1 system s`, `[Warp] arrived at system s`, `[Warp] interdicted: ...`.\n- **Jump zones (#108)**: `JumpZoneInfo` (\"entry - veil 0.00 crew-missing 0 align -1:0.00 | 0:Hop>1 Open @5.0km 1:Rim>-1 Fuel @6.9km ...\"), `FaceJumpZone(zone, distance)` (server: local pilot's ship `distance` m before the zone plane, nose outward; negative = past it), `FlyOutJumpZone(zone, cruise, timeout)` (the real path: in front of the zone, then cruise through or, cruise false, sit just past the plane aligned for the 3 s timer; logs `[Dev] end jump after n s | \u003cWarpInfo>` or FAILED with the zone state). Crew rule: `Pawn.CurrentShipSeat.RequestLeave()` -> every zone `Crew`; re-seat with `Board(ShipClass.Dart)`. Fuel hold: `GotoSystem(last)` + `SetFuel(0)` + `FlyOutJumpZone(rim)` -> FAILED, HUD \"JUMP ZONE HOLDS\". Exit: during a flight `ServerSetProgress(Length - 500)`, then `CruiseInfo` / `JumpZoneInfo`. Server log: `[Jump] entry: ...`, `[Jump] rebased into the bubble around ... (n more ships)`, `[Warp] out of the bubble at ... (from system s)`. `StartWarp`/`StartHop`/`GotoSystem` keep the instant dev path.\n- **Flight home / Rift (#81)**: scenario `Finale` (lead pilot in the flight home LMC -> Sol, Home Drive, the Rift awake, cruising 80 %). `StartFinale(tier)` (server, goes to galaxy 5 first, all parts at `tier`; logs `[Dev] end finale \u003cWarpInfo>`), `RiftAt(seconds)` (server: Rift that many seconds behind, wakes it), `WardenWave()` (server: the last guard now), `RiftInfo` (\"rift 31.2 s 36.5 km @1170 m/s close 0.00 | from 0.0 km\", also appended to `WarpInfo` and the MP client log line). `WarpProgress` keeps the Rift's distance. A pilotless lead stalls on the first collision, so the Rift catches it: `God(true)` + `WarpSegment(WarpZone.Void)` for look tests, `BackupMeta()`/`RestoreMeta()` around an arrival or catch (both end the run). Look-back pose: `new DevPose(new Vector3(60, 25, 40), new Vector3(-800, 0, 0), 70)`. Server log: `[Warp] rift awake at`, `[Warp] warden wave: n`, `[Warp] caught by the rift at`, `[Warp] arrived at stop 6`.\n- **Time loop (#86)**: `KillCrew()` (server: every pawn lost = the real crew-wipe path; waits for collapse + logbook; logs `[Dev] end killcrew \u003cLoopInfo>`), `NewLoop()` (host on the logbook, as the button; `[Dev] end newloop \u003cLoopInfo>`), `LoopInfo` (\"loop 4 Playing seed .. | meta loops 3 best galaxy 2 best eta 36 h 20 min | log 1 | screen None | time 1.00\"), `Logbook` (server, one entry per line). Rift path: scenario `Finale` + `RiftAt(0.3f)`. Both record the run in the real meta save: `BackupMeta()` / `RestoreMeta()`. A `Sequence` started together with `KillCrew` samples in scaled time, so the slow-mo collapse fits in its first ~0.5 s.\n- **Loot / music / meta (#43)**: `DropLoot(id, from, count)` (server; pops out of `from` like an enemy drop), `DropRarityRow(from)` (one item per rarity, ids in `RarityItems`), `LootCount`, `LootMagnetized`, `ClearLoot()`; music: `SetThreat(level01, boss, seconds)` (client override of `Threat`, -1 clears), `MusicState` / `LogMusic(tag)` (threat + combat/boss stem mix); meta: `BackupMeta()` -> `AddMemories(n)` -> ... -> `RestoreMeta()` (the meta save is the real local save). Currency (#112): `SalvageInfo` (\"0:80 1:105\", also in the MP client log line as `| salvage ...`). Perk unlock UI: push `UIRoot.Instance.Push(Screen.Hangar)` from the main menu and invoke an `Unlock (..)` button's onClick inside a `Sequence`.\n- **Planets (#70)**: `DevTest.PlanetSurvey(name, shapes, views, radius, seed)` (play mode, any phase) builds each `PlanetShapeDef` as a temporary planet far outside the sector, drives the main camera through the `PlanetView` flags (Orbit, Limb, Flight 300 m, Ground, Shore) so LOD/decor/ambience react like in game, and writes ONE sheet (row = shape, column = view, no HUD). Shapes: `DevTest.CatalogShapes()` or load `Data/Planets/Planet_\u003cid>.asset` via AssetDatabase. Use it as before/after for any planet shader or preset change. `PlanetView.Ground | PlanetView.Shore` with 4 shapes = a sheet readable at full size. `DevTest.TerrainLayerCost(seconds)` = frame time with the PBR layers on vs off at the current view (`[Dev] end terraincost on X ms off Y ms`, editor numbers: compare only).\n- **Low-poly ships (#122)**: Edit Mode `ContentBuilder.PreviewLowPoly(\"Dart\"|\"Mule\", cams[], targets[], fov)` builds the ship without saving any prefab and renders `Temp/HeroShots/\u003cship>_LP_\u003ci>.png` (camera/target in ship space), then reopens `Voidward.unity`. Single prefabs must not be saved on their own (SavePrefab recreates the asset: new GlobalObjectIdHash), so ship changes end with Build All Content.\n- **Cockpit (#94)**: `DevTest.PilotView(name)` renders the player's current view (main camera pose + FOV, no HUD) at 1920x1080 to `%TEMP%/VoidwardDev/name.jpg` (judge display readability there, the editor game view is tiny); `DevTest.InteractPrompt` = the local pawn's [F] prompt. `DevTest.CockpitViews(name)` = one sheet of four views from the seated eye (back over the seat, left shoulder, up through the canopy, right console). Seat test: `Pawn.CurrentShipSeat.RequestLeave()`, then `Teleport` around the ship (feet = eye - up x 1.62) inside a `Sequence` and log `InteractPrompt` per spot.\n- **Mule / Ark (#97)**: `DevTest.Board(ShipClass, role, claim, index)` (server: the local player sits in the index-th seat of that role of a ship of that class, a working one before a derelict; spawns one 45 m beside the player's ship if none exists; claim = restore a derelict first; logs `[Dev] end board ...`), `SetDerelict(cls, on)` (server, ShipDerelictLook test). `CockpitViews` / `SeatBodyViews` take the occupied seat's view point when no eyeZ is given (Mule eye (0, 0.55, 3.3), Ark (0, 0.2, 14.6)). Mule as warp lead: `Board(ShipClass.Mule)` then `StartWarp()`. Walk test inside the Ark: leave the seat, then `Teleport` to ship-local spots in a `Sequence` (repeat `RequestLeave` while still seated after boarding two ships) and log `InteractPrompt`; deck floor y -1.55, pilot platform -1.16. After an editor restart check the active scene (`Voidward.unity`): an empty Untitled scene starts a run without players (`end quickstart FAILED: no local pawn`).\n- **Home ship Nostos (#49)**: scenario `Nostos` (at the Nostos helm, own Dart docked; `Space`/`Lab`/`Galaxy` launch the Dart first, `Warp`/`Finale` board the Nostos). `HomeInfo` (\"Nostos hull 990/990 shield 380 | clamps 0:84 1:- 2:- 3:- | pods 4 | cryo 4 | pilot 0 | me Dart docked 0\"), `Launch()` / `Dock(clamp)` (server, the local player's ship), `CryoTest()` (lethal hit, waits for the cryo wake-up; `[Dev] end cryo pod i at d m | inside True ...`), `DestroyHome()` (ends the loop; `BackupMeta()`/`RestoreMeta()` around it). Real dock path: seat in the Dart, `Launch()`, then put it a few m above a free clamp with zero velocity and call `Flight.SetPilotInput(zero...)` every frame in a `Sequence` (the clamp grabs it). Leave a docked Dart's seat -> the pawn stands at the clamp's hatch inside. Heavy landing: put the Nostos 80 m over the ground with -30 m/s while piloted and log `Flight.Altitude` + the descent. Edit Mode: `ContentBuilder.PreviewShot(\"Ship_Nostos\", camLocal, targetLocal, fov, name)` (deck y -2.33; hall z -9.4..6.4, cryo 6.4..9.9, bridge 9.9..25.3, engine room -16..-9.4).\n- **Crew body (#95)**: `DevTest.BodyViews(name)` (the local on-foot body as others see it, 4 views incl. the tool hand), `DevTest.WalkViews(name)` (scenario `Planet`: carried along the ground at walk/jog/sprint/backwards, one tile each, wait with `dev-wait.sh name`), `DevTest.SeatBodyViews(name)` (seated body from outside: side, front, stick hand, throttle hand), `DevTest.CrewInfo` (\"0:Ground/1/0 6.0 Move 1:seat Pilot Sit\", also in the MP client log line as `| crew ...`). `GroundAhead` ignores the pawn's own colliders. Body renderers of the owner only cast shadows: the view helpers switch them on for the shot.\n- **Enemies (#98)**: `DevTest.SpawnEnemy(kind, pos, lookAt)` per type (Planet scenario: `GroundAhead(dist, side)`), `DevTest.SpawnWarden(ahead)` (server: the real enclave wake-up path anywhere, 260 m ahead of the local ship; logs `[Dev] end warden \u003cpos>`). Edit Mode: `ContentBuilder.PreviewClips(prefab, clips, normalizedTimes, camLocal, targetLocal, fov)` samples a rigged prefab's clips into `Temp/HeroShots/\u003cprefab>_\u003cclip>_\u003ci>.png` and logs `[Voidward] Preview ... posed bones min/max` (feet near y 0). Check a rig's FBX export by bone positions / bind poses, not by `BakeMesh` (double-scales).\n- **World objects (#99)**: `DevTest.SpawnPoi(kind, ahead, side)` (server: \"Ruin\", \"Crash\", \"Nest\", \"Wreck\", \"Station\", \"Crate\", \"Ore\"/\"Crystal\"/\"Scrap\"/\"Fuel\" nodes, \"Pickup:\u003citem id>\" on the ground in front of the pawn; logs `[Dev] end poi \u003ckind> \u003cpos>`); frame a shot by the spawned object's renderer bounds (hilly planets make fixed poses useless). Station walk test: scenario `Lab`, `RequestLeave`, `Teleport(station.TransformPoint(0, -6.4, 46), station.up, -station.forward)` -> `InteractPrompt` = \"[F] Trade\". Crate lid: `LootCrate.Interact(null)` opens only within 8 m of the host pawn. Edit Mode: `ContentBuilder.PreviewShot(\"TraderStation\" | \"Wreck\" | \"Ruin\" | ...)`.\n- **Light / sky / VFX (#96)**: `DevTest.ShipViews(name)` (seated ship from outside: front three-quarter, rear, wide with the sky, close along the hull), `DevTest.VfxViews(name, distance)` (explosion, muzzle burst, metal/rock/laser impacts, shield hit/break in front of the ship, 6 tiles over 2.5 s; use distance ~22 to judge them; wait with `dev-wait.sh name`). `DevTest.ProjectileViews(name)` (scenario `Space`, server: laser, enemy laser, blaster, missile, flak, boss orb fly across a side camera, 4 tiles over 0.4 s). Reflections: put URP/Lit metal spheres (metallic 1, smoothness 0.95/0.7/0.4) in front of the ship and `Shot` them.\n- **Look**: `DevTest.Sequence(\"name\", seconds, (frame, t) => {...}, new[] { 0.1f, 0.5f, 2f }, DevTest.LabCam)` runs the step every frame and writes ONE contact sheet (640x360 tiles; pose = free camera, omit it for the player's screen incl. HUD) to `%TEMP%/VoidwardDev/name.jpg`; wait with `dev-wait.sh name`. Read sheets instead of many full screenshots. `DevTest.Screen(name)` = single downscaled screen grab.\n- **Log protocol**: every call logs `[Dev] begin \u003ctag>` synchronously and `[Dev] end \u003ctag> ...` (or `FAILED`) when done; `dev-wait.sh \u003ctag> [timeout]` prints the end line (`VW_LOG=\u003cfile>` for a client log).\n- **Dev build without log flood**: RunCommand `Voidward.EditorTools.DevBuild.WindowsDevQuiet()` (Mac: `MacDevQuiet()`), returns one line; the menu build via RunCommand returns ~150k chars of foreign shader warnings. `EditorApplication.delayCall` does not fire while the editor is in the background, don't rely on it.\n- **MP**: `DevTest.Play(DevScenario.Lab, 2)` (host waits for 2 players), then `bash Tools/Dev/mp-client.sh lab 3` (dev build with `-autojoin -skipintro -devscenario=lab -devshots=3`; it renders the lab camera every 3 s and logs `[Dev] client1_\u003ct> decals N` into `%TEMP%/VoidwardDev/client.log`). Compare host/client via log lines, look at one client image at most. Stop: `Stop-Process -Name Voidward` / `pkill -f Voidward.app`.\n- Write a test step as a small RunCommand using the harness; if a helper is missing, add it to `DevTest` instead of pasting long ad-hoc scripts.\n- **Keep the harness growing**: when a feature brings its own typical test steps (e.g. spawn a boss phase, open a crate, dock at a station), add them as `DevTest` helpers or a new `DevScenario` in the same PR, so later issues reuse them. Document every new helper, scenario or flag here (one line is enough) - this section is how the next session learns about it.\n\n## Visual examples\n\n![Sechs Spielansichten eines Eisplaneten mit HUD in Boden- und Orbitperspektiven](../../Docs/screenshots/issue-115/after_ingame_ice.jpg)\n\n#115 · Kontaktbogen eines Eisplaneten: Boden, Flug und Orbit in einer Übersicht. Ein vorhandenes Prüfartefakt, kein Nachweis für einen neuen Testlauf.\n\n---\n\n[Journey & game design](journey.md) | [Architecture & systems](architecture.md) | [Development workflow](development.md) | [Art & asset pipeline](art-and-assets.md) | [Testing playbook](testing.md) | [Status & priorities](status.md) | [Wiki maintenance](maintenance.md)\n"}, {"title": "Stand & nächste Schritte", "eyebrow": "Projektstand", "summary": "Dokumentierte Implementierung, bekannte Grenzen und der Verweis auf die verbindliche Roadmap. Datierte Einträge beschreiben den zuletzt festgehaltenen Wissensstand.", "highlights": [["Umgesetzt", "Reisestruktur, geflogener Warp, Zeitschleife und Nostos sind im Übergabestand beschrieben."], ["Noch offen", "Unter anderem Story-Intro, Prolog und die vollständige Heimkehr gemäß ihren Issues."], ["Reihenfolge", "Roadmap #53 enthält die verbindliche Arbeitsreihenfolge. Hier entsteht keine zweite Checkliste."]], "note": "Diese Übersicht fasst die lokale Übergabe zusammen. Sie fragt keine Live-Issues ab und bestätigt keinen aktuellen Build.", "images": [], "id": "status", "audience": "developer", "html": "\u003ch2 id=\"ref-0\">Status (2026-10-13)\u003c/h2>\u003cp>Journey structure (#46) playable and tested: lobby -&gt; M33 ... LMC (5 galaxies x 4-6 systems, galaxy map warps, Warden enclaves) -&gt; flight home with the Rift chase (#81) -&gt; homecoming result, or crew wipe / caught by the Rift -&gt; collapse -&gt; loop logbook -&gt; New Loop (deja-vu start) (#86); suspend save + continue; 2-player MP (Editor &lt;-&gt; dev build) warps tested. Steam is untested with 2 real accounts. Release + dev macOS builds exist in \u003ccode>Builds/\u003c/code> (git-ignored). Game feel pass #43 (hit feedback, damage taken, loot juice, dynamic music) done. Docs switched to the new gameplan (#72). Home ship Nostos (#49, 2026-10-17): docking, cryo respawn, warp lead, heavy landing; tested solo + 2-player MP, not hand-flown.\u003c/p>\u003cp>Art (2026-10-17): the look is mixed - PBR/scan assets from #91-#100 (Dart, cockpit, Mule, Nostos, crew suit, tools, enemies + Warden, station, wrecks, POIs, crates, pickups, planet terrain photo layers, planet decor, landmarks, asteroids) next to procedural parts (vents, ember rocks, arches, monoliths, bones, obsidian spires). The target is the low-poly style #120; the conversion runs in #122-#127/#133. Other known limitations: procedural placeholder audio, no terrain deformation, LOD without geomorphing, no swimming (pawns walk on the seabed), owner authority without prediction, Ark can only be claimed (not built).\u003c/p>\u003ch2 id=\"ref-1\">Next priorities\u003c/h2>\u003cp>\u003cstrong>The order of work is roadmap #53 (pinned, the only \u003ccode>documentation\u003c/code> issue)\u003c/strong>: it holds nothing but the numbered issue order; work the issues strictly in that order (each one only builds on earlier ones) and take the first unchecked issue there. It is the only source of truth for the order: tick an issue there when it is merged, and don&#x27;t keep a second copy of the order here. Design lives in \u003ccode>Assets/Design/DESIGN.md\u003c/code> (#72 is closed). A playtest (solo + MP) follows each phase. New ideas = new issue, slotted into #53 with a number. Older feedback still applies: menu, graphics and gameplay need major improvement; clarify concrete goals/references with the user before large changes. Focus is gameplay; story and the low-poly conversion #120 come last in #53 (visuals may still change meanwhile). New things are built in the low-poly style right away, existing assets are only converted when a task changes them (see &quot;Art &amp; assets&quot;).\u003c/p>", "toc": [{"id": "ref-0", "title": "Status (2026-10-13)"}, {"id": "ref-1", "title": "Next priorities"}], "search": "\u003c!-- Generated by Tools/Docs/build_wiki.py from AGENTS.md. Do not edit. -->\n\n# Status & priorities\n\n[Wiki home](README.md) | [Edit source](../../AGENTS.md)\n\n## Status (2026-10-13)\n\nJourney structure (#46) playable and tested: lobby -> M33 ... LMC (5 galaxies x 4-6 systems, galaxy map warps, Warden enclaves) -> flight home with the Rift chase (#81) -> homecoming result, or crew wipe / caught by the Rift -> collapse -> loop logbook -> New Loop (deja-vu start) (#86); suspend save + continue; 2-player MP (Editor \u003c-> dev build) warps tested. Steam is untested with 2 real accounts. Release + dev macOS builds exist in `Builds/` (git-ignored). Game feel pass #43 (hit feedback, damage taken, loot juice, dynamic music) done. Docs switched to the new gameplan (#72). Home ship Nostos (#49, 2026-10-17): docking, cryo respawn, warp lead, heavy landing; tested solo + 2-player MP, not hand-flown.\n\nArt (2026-10-17): the look is mixed - PBR/scan assets from #91-#100 (Dart, cockpit, Mule, Nostos, crew suit, tools, enemies + Warden, station, wrecks, POIs, crates, pickups, planet terrain photo layers, planet decor, landmarks, asteroids) next to procedural parts (vents, ember rocks, arches, monoliths, bones, obsidian spires). The target is the low-poly style #120; the conversion runs in #122-#127/#133. Other known limitations: procedural placeholder audio, no terrain deformation, LOD without geomorphing, no swimming (pawns walk on the seabed), owner authority without prediction, Ark can only be claimed (not built).\n\n## Next priorities\n\n**The order of work is roadmap #53 (pinned, the only `documentation` issue)**: it holds nothing but the numbered issue order; work the issues strictly in that order (each one only builds on earlier ones) and take the first unchecked issue there. It is the only source of truth for the order: tick an issue there when it is merged, and don't keep a second copy of the order here. Design lives in `Assets/Design/DESIGN.md` (#72 is closed). A playtest (solo + MP) follows each phase. New ideas = new issue, slotted into #53 with a number.\nOlder feedback still applies: menu, graphics and gameplay need major improvement; clarify concrete goals/references with the user before large changes. Focus is gameplay; story and the low-poly conversion #120 come last in #53 (visuals may still change meanwhile). New things are built in the low-poly style right away, existing assets are only converted when a task changes them (see \"Art & assets\").\n\n---\n\n[Journey & game design](journey.md) | [Architecture & systems](architecture.md) | [Development workflow](development.md) | [Art & asset pipeline](art-and-assets.md) | [Testing playbook](testing.md) | [Status & priorities](status.md) | [Wiki maintenance](maintenance.md)\n"}, {"title": "So bleibt das Wiki aktuell", "eyebrow": "Gemeinsam pflegen", "summary": "Claude und andere Agenten pflegen das Wissen während der Arbeit am Repository. Die lesbare Ansicht und die Markdown-Seiten werden aus denselben Quellen erzeugt.", "highlights": [["AGENTS.md", "Zentrale technische Fakten, Regeln, bekannte Grenzen und Testabläufe."], ["Visuelle Redaktion", "Einstiege, Bildauswahl und Bildunterschriften in Tools/Docs/wiki_content.json pflegen."], ["Automatisch prüfen", "Der Generator erzeugt beide Ansichten; CI erkennt fehlende oder veraltete Ausgaben."]], "flow": ["Code ändern", "Wissen aktualisieren", "Bilder einordnen", "Generieren", "Prüfen"], "note": "Die Synchronitätsprüfung erkennt Abweichungen zwischen Quellen und Ausgaben. Ob eine Aussage noch zum Code passt, müssen Agenten und Reviewer prüfen.", "images": [], "id": "maintenance", "audience": "developer", "html": "\u003ch2 id=\"ref-0\">Living wiki (mandatory)\u003c/h2>\u003cul>\u003cli>The wiki lives in \u003ca href=\"../../Docs/Wiki/README.md\">Docs/Wiki\u003c/a>, versioned with the code. This file (\u003ccode>AGENTS.md\u003c/code>, plural) is the technical wiki&#x27;s source of truth; do not create a separate \u003ccode>agent.md\u003c/code> or duplicate instructions in \u003ccode>CLAUDE.md\u003c/code>. The player handbook has its own source, described below.\u003c/li>\u003cli>At the start of a task, read the relevant sections here and the affected implementation. Before finishing any change to gameplay, architecture, setup, tooling, assets, tests or known limitations, update the affected facts here in the same change. Record new gotchas and reusable test helpers. Update \u003ccode>README.md\u003c/code> for player-facing changes and \u003ccode>Assets/Design/DESIGN.md\u003c/code> for agreed design changes.\u003c/li>\u003cli>Distinguish implemented behavior, planned design and verified results. Only claim tests actually run; date a status entry when its facts were checked. Roadmap #53 remains the only source for work order; do not copy its checklist into the wiki.\u003c/li>\u003cli>Regenerate the wiki with \u003ccode>python3 Tools/Docs/build_wiki.py\u003c/code>, then verify with \u003ccode>python3 Tools/Docs/build_wiki.py --check\u003c/code>. Commit the source and generated pages together. Never edit generated wiki pages directly. When adding or renaming a level-two section here, update the generator&#x27;s page mapping if needed; every section must appear in the wiki.\u003c/li>\u003cli>Claude and other agents perform this maintenance during repository tasks. There is no unattended AI service or scheduled Claude job. CI checks that the wiki matches this file; it cannot prove that prose matches the implementation.\u003c/li>\u003c/ul>\u003cdetails id=\"ref-1\">\u003csummary>Keep developer documentation in this repository so reviews, history and branches include it. Published site\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>https://weofi.github.io/Space-Beyond-Infinity/ (redirects to \u003ccode>Docs/Wiki/\u003c/code>). \u003ccode>.github/workflows/pages.yml\u003c/code> deploys it on every push to \u003ccode>main\u003c/code> that touches the wiki or its sources (also manually via &quot;Run workflow&quot;): \u003ccode>build_wiki.py --check\u003c/code>, then \u003ccode>Tools/Docs/pages_site.sh\u003c/code> copies \u003ccode>Docs/Wiki\u003c/code>, \u003ccode>Docs/screenshots\u003c/code> and the linked source files in the repo layout (the reader resolves images and source links relative to \u003ccode>Docs/Wiki\u003c/code>). Local preview: \u003ccode>bash Tools/Docs/pages_site.sh /tmp/site &amp;&amp; python3 -m http.server -d /tmp/site\u003c/code>. Images referenced by the wiki must live under \u003ccode>Docs/screenshots\u003c/code>, or the script must copy their folder too. Keep player guides in \u003ccode>README.md\u003c/code> and asset licences in \u003ccode>Assets/_Project/Art/CREDITS.md\u003c/code>.\u003c/p>\u003c/div>\u003c/details>\u003cul>\u003cli>Visual reader: open \u003ccode>Docs/Wiki/index.html\u003c/code> directly in a browser (offline, no server/dependencies). It has navigation, full-text search, an article outline, light/dark themes and expandable references. \u003ccode>Tools/Docs/reader.html\u003c/code> is its template; \u003ccode>Tools/Docs/wiki_reader.py\u003c/code> renders technical Markdown; \u003ccode>Tools/Docs/wiki_content.json\u003c/code> holds curated introductions, flows and captioned screenshots. These are sources; the generated HTML is checked by the same \u003ccode>--check\u003c/code> command.\u003c/li>\u003c/ul>\u003cdetails id=\"ref-2\">\u003csummary>Visual documentation is part of maintenance\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>when a visible feature changes, add or replace relevant screenshots in \u003ccode>Docs/screenshots/&lt;issue&gt;/\u003c/code>, select them in \u003ccode>wiki_content.json\u003c/code> and explain what they show. Use descriptive alt text and captions with issue/context; label historical images and don&#x27;t present older assets as the current art reference. Keep overview claims aligned with this file and don&#x27;t claim a new screenshot or test without capturing/running it. Missing image files fail generation. Editorial summaries supplement the technical source; update both when their facts change.\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-3\">\u003csummary>Player handbook (default landing view, 2026-10-17)\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>\u003ccode>Tools/Docs/player_guide.json\u003c/code> contains seven German, task-oriented guides: first expedition, controls/HUD, exploration/survival, equipment/crafting/trading, Nostos/crew, travel and help/death/saving. \u003ccode>#home\u003c/code> opens player content; \u003ccode>#developer\u003c/code> opens the existing technical index. Both are generated to HTML and Markdown. Keep player instructions concrete (where to go, what key/button to use, prerequisites, what happens next), with numbered steps, visual grouping and captioned screenshots; developer details belong in the separate developer area. Preserve the distinction between normal ship Fuel, Exotic Matter in the warp tank, and Salvage.\u003c/p>\u003c/div>\u003c/details>\u003cul>\u003cli>When gameplay, controls or menu labels change, update the affected handbook guides in the same change. Check actual implementation as well as these notes; each guide records evidence paths and a source-check date. Do not turn planned behavior into a playable instruction. In particular, the current code supports automatic cryo respawn; no manual crew-revive interaction was found. Lobby start labels are Start Mission / New Loop, and working on the shared drive requires the Nostos while it exists. Sources were checked, not a new playthrough.\u003c/li>\u003cli>Wiki tooling checks: \u003ccode>python3 Tools/Docs/test_wiki.py\u003c/code> covers stale output, missing images/captions, unmapped source sections, player-guide links/evidence and safe reference rendering. CI runs it alongside \u003ccode>--check\u003c/code>. After reader interaction or CSS changes, also inspect desktop/mobile navigation, search, image enlargement and reference expansion in a browser; Unity tests are unnecessary for documentation-only changes.\u003c/li>\u003c/ul>", "toc": [{"id": "ref-0", "title": "Living wiki (mandatory)"}, {"id": "ref-1", "title": "Keep developer documentation in this repository so reviews, history and branches include it. Published site"}, {"id": "ref-2", "title": "Visual documentation is part of maintenance"}, {"id": "ref-3", "title": "Player handbook (default landing view, 2026-10-17)"}], "search": "\u003c!-- Generated by Tools/Docs/build_wiki.py from AGENTS.md. Do not edit. -->\n\n# Wiki maintenance\n\n[Wiki home](README.md) | [Edit source](../../AGENTS.md)\n\n## Living wiki (mandatory)\n\n- The wiki lives in [Docs/Wiki](../../Docs/Wiki/README.md), versioned with the code. This file (`AGENTS.md`, plural) is the technical wiki's source of truth; do not create a separate `agent.md` or duplicate instructions in `CLAUDE.md`. The player handbook has its own source, described be
