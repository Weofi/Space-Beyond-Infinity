'use strict';
const wiki = {"home": {"title": "Wissen für die Reise nach Hause.", "summary": "Spielidee, Systeme und Werkzeuge von Voidward. Ein gemeinsamer Ort zum Verstehen, Entwickeln und Nachschlagen.", "image": "Docs/screenshots/issue-115/after_ingame_ice.jpg", "caption": "Eisplanet: vom Boden bis in den Orbit. Aufnahmen aus dem Entwicklungsschritt #115, kein neu erstellter Test."}, "guide": {"title": "Dein Weg ins Spiel.", "summary": "Du bist mit deiner Crew in einer fremden Galaxie gestrandet. Hier lernst du Schritt für Schritt, was du tun kannst – und wie ihr zusammen nach Hause kommt.", "checked": "2026-10-17", "pages": [{"id": "first-steps", "title": "Deine erste Expedition", "eyebrow": "Hier anfangen", "summary": "Dein erstes Ziel: die Nostos kennenlernen, mit der Dart einen kurzen Ausflug machen und mit Beute zurückkehren. Du musst noch keine ganze Galaxie durchqueren.", "goal": "Am Ende kannst du aussteigen, fliegen, einen Fund einsammeln und wieder an Bord gehen.", "quick": [["F", "Interagieren / Sitz verlassen"], ["M", "Galaxiekarte"], ["Tab", "Inventar & Ausrüstung"]], "sections": [{"id": "start", "title": "1. Eine Sitzung starten", "text": "Im Hauptmenü wählst du Host Game. Allein spielen funktioniert ebenfalls als Host. Für eine gemeinsame Runde kommen die anderen zuerst in deine Lobby.", "steps": [{"title": "Mission starten", "text": "Als Host klickst du in der Lobby auf Start Mission beim ersten Start oder auf New Loop bei späteren Durchläufen."}, {"title": "Vorhandene Reise fortsetzen", "text": "Wenn ein gespeicherter Run existiert, bietet die Lobby Continue Run an. Das setzt die Reise des Hosts fort."}], "result": "Im regulären neuen Run startet ihr bei der Nostos; jede Person sitzt in ihrer angedockten Dart. Ein Intro kann dem Spielbeginn vorausgehen."}, {"id": "aboard", "title": "2. Erst einmal an Bord umsehen", "steps": [{"title": "Noch nicht losfliegen", "text": "Drücke in der angedockten Dart F. Du verlässt den Sitz und stehst am Zugang im Inneren der Nostos."}, {"title": "Die Nostos erkunden", "text": "Bewege dich mit WASD, sieh dich mit der Maus um. Auf der Brücke findest du das Steuer, im Frachtraum Cargo und Fabricator, im Maschinenraum den Warp-Antrieb."}, {"title": "Interaktionshinweise suchen", "text": "Gehe nah an einen Sitz oder ein Terminal und schaue darauf. Sobald ein Hinweis wie [F] Take the helm erscheint, kannst du mit F interagieren."}], "result": "Die Nostos ist eure gemeinsame Basis. Zum ersten Kennenlernen musst du weder den Warp-Antrieb bedienen noch das Schiff verlassen."}, {"id": "outing", "title": "3. Ein kleiner Ausflug mit der Dart", "steps": [{"title": "Die Dart besteigen", "text": "Suche an ihrem Zugang den Hinweis Board … und drücke F. Halte W kurz gedrückt, um von der Andockklammer zu starten."}, {"title": "Fluggefühl ausprobieren", "text": "Mit der Maus steuerst du die Nase, mit WASD bewegst du das Schiff, mit Space / Strg nach oben und unten. X bremst. Bleibe zum Üben in der Nähe der Nostos."}, {"title": "Ein nahes Ziel wählen", "text": "M öffnet die Übersicht über das System und die Nachbarsysteme. Suche im HUD einen Planeten, eine Fundstelle oder eine Station. Für den ersten Ausflug reicht ein nahes Ziel im selben System."}, {"title": "Langsam ankommen", "text": "Bremse vor der Oberfläche oder Station. Für eine Landung wählst du eine freie, möglichst ebene Stelle und sinkst langsam. F verlässt den Sitz – benutze es erst, wenn du sicher aussteigen kannst."}], "related": ["controls", "exploration"]}, {"id": "first-loot", "title": "4. Etwas finden und wieder heimbringen", "steps": [{"title": "Eine Kiste öffnen oder einen Rohstoff abbauen", "text": "Gehe nah heran. Kisten öffnest du mit F beim Hinweis Open crate. Für eine Rohstoffader wählst du 1 und hältst die linke Maustaste auf das Vorkommen."}, {"title": "Beute prüfen", "text": "Öffne mit Tab dein Inventory. Dort siehst du, was im Rucksack liegt. Behalte draußen den Sauerstoff im Blick und kehre frühzeitig zum Schiff zurück."}, {"title": "Zur Nostos zurückkehren", "text": "Fliege langsam an eine freie Andockklammer. Die Dart dockt bei geringer Relativgeschwindigkeit automatisch an. Mit F verlässt du den Sitz ins Innere."}], "result": "Deine erste Expedition ist gelungen, sobald du mit Beute zurück bist. Danach kannst du Cargo sortieren, etwas herstellen oder ein besseres Teil einbauen.", "related": ["equipment", "nostos"]}, {"id": "next", "title": "Was mache ich danach?", "cards": [{"title": "Mehr entdecken", "text": "Fundstellen, Wracks und Stationen besuchen. Rohstoffe und bessere Ausrüstung sammeln.", "page": "exploration"}, {"title": "Die Heimreise verkürzen", "text": "Den gemeinsamen Warp-Antrieb mit besseren Teilen ausrüsten. Beobachte dabei die Home ETA.", "page": "equipment"}, {"title": "Das System verlassen", "text": "Die Nostos steuern und eine passende Sprungzone durchfliegen.", "page": "travel"}]}], "images": [], "sources": ["Assets/_Project/Scripts/UI/MenuScreens.cs", "Assets/_Project/Scripts/World/RunManager.cs", "Assets/_Project/Scripts/Ship/ShipSeat.cs", "Assets/_Project/Scripts/Ship/ShipFlight.cs"]}, {"id": "controls", "title": "Steuerung & Anzeigen", "eyebrow": "Schnell nachschlagen", "summary": "Die wichtigsten Tasten für deinen nächsten Schritt. Die Belegung ist der Standard; in Settings kannst du sie ändern. Im Spiel angezeigte Tasten haben Vorrang.", "goal": "Du findest die richtige Taste und erkennst die Anzeigen, auf die es gerade ankommt.", "sections": [{"id": "basics", "title": "Immer nützlich", "controls": [["F", "Mit dem anvisierten Objekt interagieren; im Sitz: aufstehen."], ["Tab", "Inventory, Ship, Crafting und Warp Drive öffnen."], ["M", "Galaxiekarte öffnen und Reiseziele / Sprungzonen ansehen."], ["T / mittlere Maustaste", "Ein Ziel für die Crew markieren."], ["Esc", "Menü öffnen."]]}, {"id": "walking", "title": "Zu Fuß & im Raumanzug", "controls": [["W A S D + Maus", "Laufen und umsehen."], ["Space / Strg", "Springen / Jetpack; im freien Raum auf- und absteigen."], ["Shift", "Sprint / Boost."], ["Q / E", "Im freien Raum rollen."], ["L", "Helmlampe umschalten."], ["1 + linke Maustaste halten", "Bohrer wählen und ein Vorkommen abbauen."], ["2 + linke Maustaste", "Blaster wählen und schießen."], ["3 + linke Maustaste halten", "Gewehr benutzen, wenn du eines freigeschaltet hast."], ["4 + linke Maustaste", "Ein Medkit aus dem Rucksack verbrauchen."]]}, {"id": "flying", "title": "Im Pilotensitz", "controls": [["Maus", "Nase des Schiffs steuern."], ["W / S", "Vorwärts / rückwärts; im Warp: Schub erhöhen / senken."], ["A / D", "Seitwärts bewegen."], ["Space / Strg", "Auf- und absteigen."], ["Q / E", "Schiff rollen."], ["X", "Bremsen; im Warp den Schub abschalten."], ["Shift", "Boost im normalen Flug."], ["C halten", "Im System den schnellen Reiseflug aufladen, ungefähr 2 Sekunden."], ["C drücken", "Im Warp die Schubregelung umschalten; im aktiven System-Reiseflug: beenden."], ["G", "Im Warp bei einem Signal aussteigen; nach dem Ausstieg den Warp fortsetzen."], ["Linke / rechte Maustaste", "Schiffswaffe 1 / 2 abfeuern."]]}, {"id": "hud", "title": "Welche Anzeigen sind wichtig?", "cards": [{"title": "HOME ETA", "text": "Eure geschätzte Flugzeit bis nach Hause mit dem eingebauten Antrieb. Bessere Teile sollen diese Zeit senken."}, {"title": "Gesundheit & Sauerstoff", "text": "Zeigen, wie lange du draußen bleiben kannst. Bei knapper Luft frühzeitig zum Schiff zurückkehren."}, {"title": "Hull / Shield / Fuel", "text": "Zustand und normaler Treibstoff deines Schiffs. Exotic Matter ist der getrennte Vorrat für Galaxienwarps."}, {"title": "Markierungen & Warnungen", "text": "Weisen auf Fundstellen, Stationen und Sprungzonen hin. Hinweise in der Bildschirmmitte erklären zum Beispiel, warum ein Sprung blockiert ist."}], "image": {"path": "Docs/screenshots/issue-115/after_ingame_ice.jpg", "alt": "Spielansichten mit Zielanzeige, Kompass sowie Anzug- und Schiffswerten", "caption": "Entwicklungsaufnahme aus #115: Ziel und Navigation oben, persönliche Werte unten links, Schiffswerte unten rechts. Die Anordnung hilft bei der Orientierung; der heutige Build kann abweichen."}}], "images": [], "sources": ["Assets/_Project/Scripts/Core/VwInput.cs", "Assets/_Project/Scripts/UI/HudView.cs", "Assets/_Project/Scripts/Player/PlayerPawn.cs", "Assets/_Project/Scripts/Ship/ShipSeat.cs"]}, {"id": "exploration", "title": "Erkunden, sammeln & überleben", "eyebrow": "Auf Expedition", "summary": "Planeten und Wracks liefern Rohstoffe, Ausrüstung und Teile für den Heimweg. Starte mit einem überschaubaren Ausflug und bringe deine Funde sicher zurück.", "goal": "Du weißt, welche Ziele sich lohnen, wie du Beute bekommst und wann du umkehren solltest.", "sections": [{"id": "destinations", "title": "Was kann ich entdecken?", "cards": [{"title": "Planeten & Fundstellen", "text": "HUD-Markierungen führen unter anderem zu Ruinen, Absturzstellen, Vorratskisten und Rohstoffvorkommen."}, {"title": "Wracks & Asteroidenfelder", "text": "Suche nach Bergungsgut und Kisten. Langsam anfliegen, bevor du dich zum Erkunden aus dem Schiff wagst."}, {"title": "Stationen & Nomaden", "text": "Dort kannst du handeln und Schiffsservice nutzen. Im ersten System am Wormhole Exit gibt es eine Station."}, {"title": "Warden-Enklaven", "text": "Gefährliche Orte mit besonders wertvollen Antriebskernen. Für einen ersten Lernflug ist ein leichteres Ziel die bessere Übung."}]}, {"id": "landing", "title": "Ankommen und sicher aussteigen", "steps": [{"title": "Vor dem Ziel langsamer werden", "text": "Nutze X und beende schnellen Reiseflug. Halte die Oberfläche im Blick und suche eine freie, ebene Stelle."}, {"title": "Sanft sinken", "text": "Steuere mit kleinen Bewegungen. Die schwere Nostos braucht besonders flachen Boden und eine langsame Landung; die Dart eignet sich für kurze Erkundungsflüge."}, {"title": "Erst dann den Sitz verlassen", "text": "F ist auch im Flug die Aussteigen-Taste. Prüfe deshalb zuerst deine Position und Geschwindigkeit. Behalte im Freien Sauerstoff und Rückweg im Blick."}], "result": "Zu Fuß kannst du dich einer Fundstelle nähern und die Interaktionshinweise lesen."}, {"id": "gathering", "title": "Rohstoffe abbauen und Kisten öffnen", "steps": [{"title": "Vorkommen anvisieren", "text": "Gehe nah an Erz, Kristall, Schrott oder eine Treibstoffquelle. Der Hinweis nennt das Material und verweist auf den Drill."}, {"title": "Bohrer benutzen", "text": "Drücke 1. Halte die linke Maustaste auf das Vorkommen, bis du Material erhältst. Der Bohrer ist zum Abbau da, nicht F."}, {"title": "Kisten öffnen", "text": "Schaue aus der Nähe auf eine ungeöffnete Kiste und drücke F bei Open crate. Eine bereits geöffnete Kiste zeigt Empty."}, {"title": "Rucksack prüfen", "text": "Öffne Tab → Inventory. Wenn du am Schiff bist, kannst du Gegenstände auswählen und mit To cargo in den Frachtraum verschieben."}], "related": ["equipment"]}, {"id": "survival", "title": "Luft, Heilung und Gegner", "cards": [{"title": "Luft ist dein Rückweg-Timer", "text": "Außerhalb geschützter Bereiche sinkt dein Sauerstoff. Im Schiff oder in einer atembaren Atmosphäre füllt er sich wieder. Warte mit dem Rückflug nicht bis auf null."}, {"title": "Selbst heilen", "text": "Wähle 4 und drücke die linke Maustaste. Das verbraucht ein Medkit aus deinem Rucksack. Ohne Medkit kannst du keines einsetzen."}, {"title": "Auf Gegner reagieren", "text": "Mit 2 wählst du den Blaster. Das Gewehr auf 3 musst du erst herstellen oder kaufen und freischalten. Markiere Bedrohungen mit T für die anderen."}], "note": "Du musst nicht jeden Gegner bekämpfen. Wenn Vorräte knapp sind, brich die Expedition ab und kehre zum Schiff zurück.", "related": ["help"]}, {"id": "landscapes", "title": "Vom Orbit bis zur Oberfläche", "text": "Die gleiche Welt sieht aus dem Orbit und am Boden sehr unterschiedlich aus. Orientiere dich beim Anflug an der Oberfläche und den HUD-Markierungen; der Kontaktbogen zeigt die unterschiedlichen Betrachtungsabstände.", "image": {"path": "Docs/screenshots/issue-115/provinces_all_biomes.jpg", "alt": "Mehrere Planetentypen jeweils aus Orbit, Anflug und am Boden", "caption": "Entwicklungsaufnahmen aus #115: jede Zeile eine Welt, von links nach rechts näher an der Oberfläche. Die Bilder zeigen Landschaften, keine garantierten Fundorte."}}], "images": [], "sources": ["Assets/_Project/Scripts/Inventory/ResourceNode.cs", "Assets/_Project/Scripts/Inventory/LootCrate.cs", "Assets/_Project/Scripts/Player/PlayerPawn.cs", "Assets/_Project/Scripts/Ship/ShipFlight.cs", "Assets/_Project/Scripts/World/SystemDirector.cs"]}, {"id": "equipment", "title": "Beute nutzen & besser ausrüsten", "eyebrow": "Nach der Expedition", "summary": "Beute hilft erst, wenn du sie benutzt. Im Tab-Menü sortierst du den Rucksack, verbesserst dein Schiff, stellst Gegenstände her und rüstest den Warp-Antrieb aus.", "goal": "Du kannst ein gefundenes Teil einbauen, Material ins Cargo legen und Treibstoff richtig zuordnen.", "sections": [{"id": "tabs", "title": "Welcher Reiter macht was?", "cards": [{"title": "Inventory · Rucksack & Cargo", "text": "Gegenstand anklicken. Je nach Typ erscheinen Use oder Install. To cargo lagert ihn am nahen Schiff ein; To backpack holt ihn wieder heraus."}, {"title": "Ship · Dein nahes Schiff", "text": "Module installieren oder entfernen, mit Scrap reparieren und mit Fuel auftanken. Welches Schiff angezeigt wird, hängt davon ab, worin du sitzt oder welchem du nahe bist."}, {"title": "Crafting · Herstellen", "text": "Ein Rezept zeigt benötigte Materialien und deinen Vorrat. Craft funktioniert, wenn die Zutaten im Rucksack liegen und ein Fabricator in Reichweite ist."}, {"title": "Warp Drive · Gemeinsamer Antrieb", "text": "Hier tauscht ihr Antriebsteile und ladet Exotic Matter in den gemeinsamen Tank der Nostos."}]}, {"id": "resources", "title": "Diese Vorräte solltest du unterscheiden", "controls": [["Ore / Crystal / Scrap", "Baumaterialien für Rezepte; Scrap wird auch für Reparaturen genutzt."], ["Fuel", "Normaler Schiffstreibstoff. Im Reiter Ship über Refuel nachfüllen."], ["Exotic Matter", "Treibstoff für den Warp zwischen Galaxien. Im Reiter Warp Drive ausdrücklich in den Tank laden."], ["Salvage", "Währung für Handel und Schiffsservice während des Runs."], ["Memory fragments", "Fortschritt über den einzelnen Run hinaus; im Hangar für Freischaltungen nutzbar."]]}, {"id": "drive", "title": "So verkürzt du den Heimweg", "steps": [{"title": "Ein Antriebsteil finden oder kaufen", "text": "Du suchst Warp Core, Nav Computer, Cooling und Exotic Tank. Kerne gibt es besonders in Warden-Enklaven, andere Teile auch in Kisten, Wracks oder bei Händlern."}, {"title": "Mit dem Teil zur Nostos zurückkehren", "text": "Nimm es in den Rucksack, setze dich in die Nostos oder gehe an Bord und nutze den Antrieb im Maschinenraum. In einer laufenden Warpstrecke kannst du keine Teile tauschen."}, {"title": "Tab → Warp Drive öffnen", "text": "Vergleiche die angezeigte Home ETA mit dem gefundenen Teil. Klicke Install beim gewünschten Teil. Das alte Teil erhältst du zurück."}, {"title": "Die Komponenten zusammen verbessern", "text": "Core bestimmt die mögliche Geschwindigkeit. Nav bestimmt den sicheren Schub in Feldern, Cooling den dauerhaft möglichen Schub. Ein großer Tank ermöglicht längere Warps, macht euch allein aber nicht schneller."}], "result": "Die Home ETA zeigt den Effekt eurer Ausrüstung. Ein schneller Kern lässt sich mit passender Navigation und Kühlung besser nutzen."}, {"id": "fuel", "title": "Exotic Matter ist im Rucksack – reicht das?", "steps": [{"title": "Zur Nostos gehen", "text": "Zum Laden des gemeinsamen Antriebs musst du an oder in der Nostos sein."}, {"title": "Den Tank wirklich befüllen", "text": "Tab → Warp Drive → Load Exotic Matter. Die Zahl im Tank steigt, dein Rucksackvorrat sinkt."}, {"title": "Vor dem Galaxienwechsel prüfen", "text": "Vergleiche den Tankinhalt mit next warp needs. Ist der Tank selbst zu klein, brauchst du einen größeren Exotic Tank."}], "note": "Cargo, Rucksack und Warp-Tank sind verschiedene Aufbewahrungsorte. Material im Cargo musst du für diese Aktionen zuerst in den Rucksack holen.", "related": ["travel", "help"]}, {"id": "trade", "title": "Handeln & reparieren", "text": "Gehe an einer Station zum Handelsterminal, schaue darauf und drücke F bei Trade. Du kannst Waren kaufen, Rucksackgegenstände verkaufen und den angebotenen Schiffsservice gegen Salvage nutzen. Alternativ reparierst du das nahe Schiff im Reiter Ship mit Scrap und tankst mit Fuel nach."}], "images": [], "sources": ["Assets/_Project/Scripts/UI/InventoryView.cs", "Assets/_Project/Scripts/World/WarpDrive.cs", "Assets/_Project/Scripts/UI/TradeView.cs", "Assets/_Project/Scripts/Inventory/PlayerGear.cs", "Assets/_Project/Scripts/Progression/Meta.cs"]}, {"id": "nostos", "title": "Nostos, Dart & Zusammenspiel", "eyebrow": "Eure gemeinsame Basis", "summary": "Die Nostos bringt die Crew nach Hause. Die kleinen Darts sind eure Erkundungsschiffe. Du kannst zwischen Fliegen, Bordarbeit und Expeditionen wechseln.", "goal": "Du findest dich an Bord zurecht und weißt, welches Schiff welche Aufgabe erfüllt.", "sections": [{"id": "ships", "title": "Welches Schiff benutze ich wofür?", "cards": [{"title": "Dart · Der kurze Ausflug", "text": "Persönliches kleines Schiff zum Erkunden und Kämpfen. Du startest angedockt an der Nostos und kannst dort wieder anlegen."}, {"title": "Nostos · Gemeinsam weiterreisen", "text": "Gemeinsames Heimatschiff mit Brücke, Frachtraum, Fabricator, Kryo-Bucht und Warp-Antrieb. Ihr Pilot löst die Sprünge der Crew aus."}], "note": "Eine Dart allein öffnet keine Sprungzone, solange die Nostos vorhanden ist. Für den nächsten System- oder Galaxiensprung setzt sich jemand an ihr Steuer."}, {"id": "rooms", "title": "Wo finde ich was an Bord?", "flow": ["Heck: Maschinenraum", "Frachtraum", "Kryo-Bucht", "Bug: Brücke"], "cards": [{"title": "Maschinenraum", "text": "Warp-Antrieb und Antriebsterminal, Ingenieurstation sowie hinteres Geschütz."}, {"title": "Frachtraum", "text": "Cargo, Fabricator, Luftschleuse und Zugänge zu den Andockklammern der Darts."}, {"title": "Kryo-Bucht", "text": "Hier wachen gefallene Crewmitglieder wieder auf, solange Kryo-Ladungen verfügbar sind."}, {"title": "Brücke", "text": "Am Pilotensitz erscheint Take the helm. Außerdem gibt es ein vorderes Geschütz."}]}, {"id": "docking", "title": "Starten, andocken und ins Innere wechseln", "steps": [{"title": "Starten", "text": "Sitze in deiner angedockten Dart und halte W ungefähr eine Sekunde. Sie löst sich von der Klammer. Im Warp kannst du nicht abdocken."}, {"title": "Wieder anlegen", "text": "Fliege langsam an eine freie Andockklammer der Nostos. Bei höchstens etwa 14 m/s Relativgeschwindigkeit und unter etwa 16 m Abstand kann die Klammer die Dart automatisch greifen. Wenn es nicht klappt: abbremsen und vorsichtig neu anfliegen."}, {"title": "An Bord aussteigen", "text": "Während die Dart angedockt ist, führt F aus dem Sitz zum Zugang im Inneren der Nostos. Willst du draußen frei aussteigen, achte vorher auf Geschwindigkeit und Sauerstoff."}]}, {"id": "crew", "title": "Was können die anderen währenddessen tun?", "cards": [{"title": "Pilot", "text": "Steuert die Nostos, fliegt Sprungzonen an und führt die Warpstrecke."}, {"title": "Geschütz", "text": "An einem freien Geschütz mit F Platz nehmen und die Crew gegen Bedrohungen unterstützen."}, {"title": "Ingenieur & Expedition", "text": "Station bedienen, Vorräte organisieren, Teile einbauen oder außerhalb des Warps auf Erkundung gehen. Rollen sind keine dauerhafte Klassenwahl."}], "result": "Auch allein kannst du Rollen wechseln. Im Co-op hilft es, vor Abflug kurz zu klären, wer fliegt und ob alle wieder an Bord sind."}], "images": [], "sources": ["Assets/_Project/Editor/NostosBuilder.cs", "Assets/_Project/Scripts/Ship/ShipSeat.cs", "Assets/_Project/Scripts/Ship/ShipFlight.cs", "Assets/_Project/Scripts/Ship/DockClamp.cs", "Assets/_Project/Scripts/World/WarpFlight.Jumps.cs"]}, {"id": "travel", "title": "Weiterreisen & nach Hause kommen", "eyebrow": "Der nächste große Schritt", "summary": "Du klickst keinen Warp-Knopf. Du steuerst die Nostos durch eine Sprungzone am Systemrand. Die Reise selbst fliegst du anschließend weiter.", "goal": "Du unterscheidest normalen Flug, schnellen Reiseflug und Warp – und kannst einen Sprung vorbereiten.", "sections": [{"id": "modes", "title": "Drei Arten zu fliegen", "cards": [{"title": "Normaler Flug", "text": "Für Start, Landung, Andocken und Kämpfe. Kleine, kontrollierte Bewegungen statt Höchstgeschwindigkeit."}, {"title": "System-Reiseflug", "text": "Halte C ungefähr 2 Sekunden: Das Schiff beschleunigt für weite Strecken innerhalb des Systems. X, S oder C beenden ihn. Planeten, Hindernisse und Gefechte können ihn ebenfalls beenden."}, {"title": "Warp", "text": "Ein geflogener Korridor zum Nachbarsystem oder zur nächsten Galaxie. W / S steuern hier den Schub; C regelt ihn automatisch, G nutzt passende Signale."}]}, {"id": "prepare", "title": "Einen Sprung vorbereiten", "steps": [{"title": "Ziel auf M ansehen", "text": "Die Galaxiekarte zeigt Systeme und die zugehörigen Sprungzonen. Nachbarsysteme erreichst du über deren Zone. Galactic Rim und die Skip-Zone gibt es nur im äußersten System der Galaxie."}, {"title": "Crew einsammeln", "text": "Alle lebenden Crewmitglieder müssen in einem Schiff sitzen oder im geschützten Innenraum stehen. Wer noch draußen ist, blockiert den Sprung."}, {"title": "Die Nostos steuern", "text": "Setze dich mit F an ihr Steuer. Eine freie Dart löst den Sprung nicht aus. Für Galaxienwarps muss außerdem genug Exotic Matter im gemeinsamen Tank sein."}, {"title": "Aus der Schwerkraft und aus dem Gefecht kommen", "text": "Fliege aus dem Schwerkraftbereich des Planeten und löse dich von angreifenden Gegnern. Lies bei einer Blockade den Grund in der Bildschirmmitte."}], "related": ["nostos", "equipment", "help"]}, {"id": "jump", "title": "Durch die Sprungzone fliegen", "steps": [{"title": "Markierung anfliegen", "text": "Suche im HUD die Zone zum gewünschten Ziel und fliege die Nostos dorthin."}, {"title": "Nach außen ausrichten", "text": "Durchquere die Zonenebene im Reiseflug nach außen. Alternativ halte innerhalb der Zone die Nase etwa 3 Sekunden nach außen, bis ALIGNING vollständig ist."}, {"title": "Einflug abwarten", "text": "Bei WARP ENTRY beginnt der Übergang. Die Crew geht gemeinsam in die Warpstrecke; freie kleine Schiffe werden für die Reise an die Nostos geholt."}], "result": "Ein Sprung zum Nachbarsystem benötigt kein Exotic Matter. Ein Galaxienwarp verbraucht es und führt in eine Richtung weiter."}, {"id": "warp", "title": "Was tue ich während des Warps?", "steps": [{"title": "Schub und Hindernisse beobachten", "text": "W erhöht, S senkt den Schub; mit der Maus lenkst du seitlich an Hindernissen vorbei. X nimmt den Schub heraus. Kollisionen können schaden und einen Notstopp auslösen."}, {"title": "Hitze kontrollieren", "text": "Zu viel Schub über längere Zeit überhitzt den Antrieb. Nimm rechtzeitig Schub zurück. Bessere Kühlung erlaubt dauerhaft mehr Leistung, bessere Navigation hilft in Feldern."}, {"title": "Reiseautomatik bewusst nutzen", "text": "C hält den Warpschub und schaltet sich bei der nächsten Hinderniswarnung ab. Bleibe deshalb aufmerksam."}, {"title": "Ein Signal besuchen", "text": "Wenn ein erreichbares Signal angezeigt wird, kann der führende Pilot mit G den Warp verlassen. Nach der Erkundung bringt G die Crew nach einem kurzen Countdown zurück auf die Strecke."}], "note": "Nahe Gegner oder gegnerische Treffer können den Warp unterbrechen. Kümmere dich um die Bedrohung, statt nur mehr Schub zu geben."}, {"id": "homeward", "title": "Der lange Weg nach Sol", "flow": ["M33", "M31", "NGC 6822", "Leo I", "LMC", "Sol"], "text": "Erkunde eine Galaxie, verbessere den Antrieb und senke die Home ETA. Von der LMC geht es auf den letzten Flug nach Hause. Dort jagt euch der Rift: Abstand halten und Hindernisse durchfliegen; Ausstiege sind während der Verfolgung gesperrt.", "note": "Die vollständige Erdannäherung und Landung gehören noch zum geplanten Ausbau. Der dokumentierte spielbare Abschluss ist derzeit ein Heimkehr-Ergebnisbildschirm."}], "images": [], "sources": ["Assets/_Project/Scripts/World/WarpFlight.Jumps.cs", "Assets/_Project/Scripts/Core/JumpZones.cs", "Assets/_Project/Scripts/Ship/ShipFlight.cs", "Assets/_Project/Scripts/World/WarpFlight.cs", "Assets/_Project/Scripts/UI/HudView.cs"]}, {"id": "help", "title": "Ich komme gerade nicht weiter", "eyebrow": "Hilfe im Spiel", "summary": "Beginne mit dem sichtbaren Problem. Hier findest du kurze Ursachen und den nächsten sinnvollen Schritt – ohne Entwicklerbegriffe.", "goal": "Du kannst häufige Blockaden lösen und weißt, was bei Tod, Schiffsverlust und einer Spielpause passiert.", "sections": [{"id": "cannot-jump", "title": "Die Sprungzone lässt mich nicht durch", "cards": [{"title": "Ich sitze in der Dart", "text": "Wechsle auf die Nostos und übernimm dort das Steuer. Solange sie existiert, führt sie die Sprünge an."}, {"title": "Crew fehlt", "text": "Hole alle lebenden Mitspieler an Bord. Im Innenraum der Nostos dürfen sie stehen; sie müssen nicht alle einen Sitz belegen."}, {"title": "Exotic Matter fehlt", "text": "Tab → Warp Drive öffnen und an der Nostos Load Exotic Matter benutzen. Vorräte im Cargo oder Rucksack zählen noch nicht als Tankinhalt."}, {"title": "Tank zu klein", "text": "Ein größerer Exotic Tank ist nötig. Mehr Material im Rucksack vergrößert den Tank nicht."}, {"title": "Schwerkraft / Kampf", "text": "Entferne dich vom Planeten oder löse die Bedrohung durch angreifende Gegner. Lies den konkreten Grund bei JUMP ZONE HOLDS."}, {"title": "Die Ausrichtung fehlt", "text": "Fliege die richtige Zone nach außen durch oder halte darin die Nase nach außen. Achte auf ALIGNING und anschließend WARP ENTRY."}], "related": ["travel"]}, {"id": "cannot-use", "title": "Interagieren, Craften oder Einbauen klappt nicht", "cards": [{"title": "Kein [F]-Hinweis", "text": "Gehe näher an das Objekt und schaue direkt darauf. Sitze und Terminals sind kleine Ziele. Besetzte Sitze kannst du nicht übernehmen."}, {"title": "Craft ist ausgegraut", "text": "Prüfe die Zutaten im Rucksack und ob ein Fabricator in Reichweite ist. Teile im Cargo zuerst über To backpack holen."}, {"title": "Antriebsteil wird abgewiesen", "text": "Gehe zur Nostos und beende zuerst die Warpstrecke. Antriebsteile kannst du unterwegs im Warp nicht tauschen."}, {"title": "Gewehr auf 3 fehlt", "text": "Es ist kein Startwerkzeug. Stelle es her oder kaufe es und benutze es über Use im Rucksack."}, {"title": "Medkit tut nichts", "text": "Du brauchst ein Medkit im Rucksack. 4 wählt die Funktion, erst die linke Maustaste setzt eines ein."}, {"title": "Schneller Flug bricht ab", "text": "Hindernisse, Planetennähe, Treffer oder ein Gefecht können den System-Reiseflug beenden. Zuerst Abstand und eine freie Flugbahn schaffen."}]}, {"id": "death", "title": "Was passiert, wenn ich sterbe?", "steps": [{"title": "Kryo-Ladung vorhanden", "text": "Ein gefallener Spieler wacht nach einer kurzen Wartezeit normalerweise in seiner Kryo-Kapsel an Bord der Nostos auf. Dabei wird eine gemeinsame Kryo-Ladung verbraucht. CRYO zeigt den Vorrat."}, {"title": "Die eigene Dart ist zerstört", "text": "Nach ungefähr 20 Sekunden wird eine Ersatz-Dart bereitgestellt. Wenn eine Klammer frei ist, wartet sie dort an der Nostos."}, {"title": "Der Run ist verloren", "text": "Sind alle Crewmitglieder endgültig verloren, wird die Nostos zerstört oder holt euch der Rift ein, endet die Reise. Im Logbuch startet der Host mit New Loop den nächsten Durchlauf."}], "note": "Die Kryo-Ladungen sind ein begrenzter gemeinsamer Vorrat. Memory fragments und Freischaltungen gehören zum Fortschritt, den du über einzelne Runs hinaus behältst."}, {"id": "save", "title": "Kann ich eine Pause machen?", "text": "Der Host speichert die Reise automatisch beim Eintritt in eine Galaxie und beim Verlassen der Sitzung. In der Lobby setzt Continue Run diesen Spielstand fort. Bei einem beendeten Run wird der Fortsetzungs-Spielstand gelöscht.", "note": "Ein Speichern während einer Warpstrecke setzt die Crew beim Fortsetzen vor diese Warpstrecke zurück. Es ist kein freies Quicksave-System.", "related": ["first-steps"]}, {"id": "scope", "title": "Was ist schon spielbar?", "cards": [{"title": "Jetzt beschrieben", "text": "Erkunden, abbauen, looten, kämpfen, handeln, craften, die Nostos nutzen, den Antrieb verbessern, geflogene Sprünge und der finale Flug mit dem Rift."}, {"title": "Noch im Ausbau", "text": "Story-Intro, der spielbare Prolog und die vollständige Erdlandung sind im dokumentierten Stand noch nicht fertig. Die Hilfen versprechen diese Szenen nicht."}], "text": "Die Anleitungen wurden am 17.10.2026 mit dem lokalen Code und den Projektnotizen abgeglichen. Das ist kein neuer kompletter Solo- oder Multiplayer-Spieltest."}], "images": [], "sources": ["Assets/_Project/Scripts/World/RunManager.cs", "Assets/_Project/Scripts/World/WarpDrive.cs", "Assets/_Project/Scripts/World/RunSave.cs", "Assets/_Project/Scripts/Inventory/PlayerGear.cs", "Assets/_Project/Scripts/Player/PlayerPawn.cs", "Assets/_Project/Scripts/UI/InventoryView.cs"]}]}, "pages": [{"title": "Die Reise nach Hause", "summary": "Eine Crew, fünf Galaxien und ein gemeinsames Ziel: Sol erreichen. Der Warp-Antrieb bestimmt, wie weit der Weg nach Hause noch ist.", "eyebrow": "Spielkonzept", "highlights": [["01 · Erkunden", "Auf Planeten landen, Ressourcen bergen und Antriebsteile finden."], ["02 · Verbessern", "Die Nostos ausrüsten und die Home ETA senken."], ["03 · Weiterfliegen", "Sprungzonen durchfliegen und gemeinsam die nächste Galaxie erreichen."]], "flow": ["M33", "M31", "NGC 6822", "Leo I", "LMC", "Sol"], "note": "Die Route ist das Zielkonzept. Prolog und Erdlandung sind im dokumentierten Stand noch ausstehend; die technische Referenz trennt Planung und Umsetzung.", "images": [{"path": "Docs/screenshots/issue-115/provinces_all_biomes.jpg", "caption": "Planetenvielfalt aus #115: dieselben Welten aus Orbit, Anflug und Bodennähe. Die Übersicht zeigt Entwicklungsaufnahmen.", "alt": "Kontaktbogen verschiedener Planeten mit jeweils vier Ansichten von Orbit bis Boden"}], "id": "journey", "audience": "developer", "html": "\u003ch2 id=\"ref-0\">Gameplan (2026-10-13, from issue #72; design reference since 2026-10-17: \u003ccode>Assets/Design/DESIGN.md\u003c/code>)\u003c/h2>\u003cp>\u003cstrong>Direction 2026-10-17 (DESIGN.md &quot;Gameplan&quot;):\u003c/strong> one continuous co-op journey, no roguelite runs and no time loop. Progress = upgrading the ships and the warp drive; the short raids are part of the world (choose a target, fly there, land, disembark, raid, carry the loot back, dock). A failed raid costs its loot, the landed ship stays as a salvageable wreck (#132). The Rift (#81) is dropped too; its code is removed in #132. Progression has two layers: the players&#x27; own crew ships (classes Dart -&gt; heavy fighter -&gt; multi-crew frigate, no freighters, #113) and the Nostos as shared hub and quest giver whose upgrades (warp drive first) open further areas. Where the text below describes the loop, that is the current code, not the target. The game is now a \u003cstrong>journey home\u003c/strong>: a moon mission (\u003cem>SELENE-4\u003c/em>) on its return flight to Earth (the family watches it live on the news, #109) is swallowed by an anomaly/wormhole, the crew wakes in M33 and flies through 5 Local Group galaxies (M33 -&gt; M31 -&gt; NGC 6822 -&gt; Leo I -&gt; LMC) home to Sol, upgrading the \u003cstrong>warp drive\u003c/strong> (Mk I-V, Home Drive) to shrink the \u003cstrong>Home ETA\u003c/strong>. Travel = flown warp flights (#73). Death = time loop back to M33 with meta kept (#74, #86); \u003cstrong>planned (2026-10-17): #132 replaces it with a system loop\u003c/strong> (down/revive, solo emergency cryo, crew wipe = the current system loops back to its arrival checkpoint, same layout, rerolled enemies/loot). Gameplay core planned in #128 (galaxy missions: signals, orbital scan, coordinate fragments -&gt; drive core), #129 (expeditions: drill, salvage, ruin, per-planet alert level), #130 (every pilot flies their own ship inside the warp bubble, multi-seat = gunner/engineer), #131 (drive variants with trade-offs). Enemies: nature + aliens only (no pirates); Wardens = alien guardian species (#42). Collapse -&gt; the Rift (finale only). Credits -&gt; Salvage (\u003ccode>NetInventory.Salvage\u003c/code>), Stardust -&gt; Memory fragments (\u003ccode>Meta.Data.Memories\u003c/code>), done in #112.\u003c/p>\u003cdetails id=\"ref-1\">\u003csummary>Gameplay decisions follow \u003ccode>Assets/Design/DESIGN.md\u003c/code> &quot;Gameplan: The Journey Home&quot; and the open issues in roadmap #53, not the legacy code\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>(#72, the original gameplan issue, is closed; &quot;part of #72&quot; in issues is history). #46 (run structure: 5 galaxies, systems, galaxy map, suspend save; gates/Collapse removed) is in. #73 is split into #78 (crew warp drive), #79 (flown warp), #80 (cruise, hops) and #81 (finale), all done. #74 is split into #86 (time loop, done), #87 (prologue: playable return flight from the Moon, anomaly, waking in M33), #109 (story intro: family watching the news, TV -&gt; cockpit, &quot;SIGNAL LOST&quot;), #88 (homecoming: Sol, landing on Earth, closing news scene, credits), #132 (system loop) and #89 (lore), in that order (sub-issues of #74). #49 is now only the home ship \u003cem>Nostos\u003c/em> (the SELENE-4 mission ship, built from the Ark); small ships moved to #113. #108 (done) replaced the warp button/countdown: every hop and galaxy warp starts seamlessly by flying out of a jump zone at the system edge (Galactic Rim + skip zone only in a galaxy&#x27;s outermost system). The flight home from the LMC is the finale with the Rift chase (#81); still legacy until their issues land: the homecoming result screen instead of the Earth/Moon approach and landing (#88), the intro cinematic in a player&#x27;s first loop instead of the prologue (#87) and pirates (#51). The home ship \u003cem>Nostos\u003c/em> is in (#49). Energy Cells are gone (#78: Exotic Matter, item id \u003ccode>exotic\u003c/code>).\u003c/p>\u003c/div>\u003c/details>\u003cul>\u003cli>Design + glossary (DE design term / EN UI term / code name) + names: \u003ccode>Assets/Design/DESIGN.md\u003c/code> &quot;Gameplan: The Journey Home&quot;. Old code names stay until the issue that migrates a system renames it; new code uses the glossary names (\u003ccode>GalaxyDef\u003c/code>, \u003ccode>HomeEta\u003c/code>, \u003ccode>AlertLevel\u003c/code>, \u003ccode>Salvage\u003c/code>, \u003ccode>ExoticMatter\u003c/code>, \u003ccode>Rift\u003c/code>, \u003ccode>Memories\u003c/code> ...). UI language stays English.\u003c/li>\u003c/ul>\u003cp>User speaks German – answer in German.\u003c/p>", "toc": [{"id": "ref-0", "title": "Gameplan (2026-10-13, from issue #72; design reference since 2026-10-17: Assets/Design/DESIGN.md)"}, {"id": "ref-1", "title": "Gameplay decisions follow Assets/Design/DESIGN.md \"Gameplan: The Journey Home\" and the open issues in roadmap #53, not the legacy code"}], "search": "\u003c!-- Generated by Tools/Docs/build_wiki.py from AGENTS.md. Do not edit. -->\n\n# Journey & game design\n\n[Wiki home](README.md) | [Edit source](../../AGENTS.md)\n\n## Gameplan (2026-10-13, from issue #72; design reference since 2026-10-17: `Assets/Design/DESIGN.md`)\n\n**Direction 2026-10-17 (DESIGN.md \"Gameplan\"):** one continuous co-op journey, no roguelite runs and no time loop. Progress = upgrading the ships and the warp drive; the short raids are part of the world (choose a target, fly there, land, disembark, raid, carry the loot back, dock). A failed raid costs its loot, the landed ship stays as a salvageable wreck (#132). The Rift (#81) is dropped too; its code is removed in #132. Progression has two layers: the players' own crew ships (classes Dart -> heavy fighter -> multi-crew frigate, no freighters, #113) and the Nostos as shared hub and quest giver whose upgrades (warp drive first) open further areas. Where the text below describes the loop, that is the current code, not the target.\nThe game is now a **journey home**: a moon mission (*SELENE-4*) on its return flight to Earth (the family watches it live on the news, #109) is swallowed by an anomaly/wormhole, the crew wakes in M33 and flies through 5 Local Group galaxies (M33 -> M31 -> NGC 6822 -> Leo I -> LMC) home to Sol, upgrading the **warp drive** (Mk I-V, Home Drive) to shrink the **Home ETA**. Travel = flown warp flights (#73). Death = time loop back to M33 with meta kept (#74, #86); **planned (2026-10-17): #132 replaces it with a system loop** (down/revive, solo emergency cryo, crew wipe = the current system loops back to its arrival checkpoint, same layout, rerolled enemies/loot). Gameplay core planned in #128 (galaxy missions: signals, orbital scan, coordinate fragments -> drive core), #129 (expeditions: drill, salvage, ruin, per-planet alert level), #130 (every pilot flies their own ship inside the warp bubble, multi-seat = gunner/engineer), #131 (drive variants with trade-offs). Enemies: nature + aliens only (no pirates); Wardens = alien guardian species (#42). Collapse -> the Rift (finale only). Credits -> Salvage (`NetInventory.Salvage`), Stardust -> Memory fragments (`Meta.Data.Memories`), done in #112.\n- **Gameplay decisions follow `Assets/Design/DESIGN.md` \"Gameplan: The Journey Home\" and the open issues in roadmap #53, not the legacy code** (#72, the original gameplan issue, is closed; \"part of #72\" in issues is history). #46 (run structure: 5 galaxies, systems, galaxy map, suspend save; gates/Collapse removed) is in. #73 is split into #78 (crew warp drive), #79 (flown warp), #80 (cruise, hops) and #81 (finale), all done. #74 is split into #86 (time loop, done), #87 (prologue: playable return flight from the Moon, anomaly, waking in M33), #109 (story intro: family watching the news, TV -> cockpit, \"SIGNAL LOST\"), #88 (homecoming: Sol, landing on Earth, closing news scene, credits), #132 (system loop) and #89 (lore), in that order (sub-issues of #74). #49 is now only the home ship *Nostos* (the SELENE-4 mission ship, built from the Ark); small ships moved to #113. #108 (done) replaced the warp button/countdown: every hop and galaxy warp starts seamlessly by flying out of a jump zone at the system edge (Galactic Rim + skip zone only in a galaxy's outermost system). The flight home from the LMC is the finale with the Rift chase (#81); still legacy until their issues land: the homecoming result screen instead of the Earth/Moon approach and landing (#88), the intro cinematic in a player's first loop instead of the prologue (#87) and pirates (#51). The home ship *Nostos* is in (#49). Energy Cells are gone (#78: Exotic Matter, item id `exotic`).\n- Design + glossary (DE design term / EN UI term / code name) + names: `Assets/Design/DESIGN.md` \"Gameplan: The Journey Home\". Old code names stay until the issue that migrates a system renames it; new code uses the glossary names (`GalaxyDef`, `HomeEta`, `AlertLevel`, `Salvage`, `ExoticMatter`, `Rift`, `Memories` ...). UI language stays English.\nUser speaks German – answer in German.\n\n## Visual examples\n\n![Kontaktbogen verschiedener Planeten mit jeweils vier Ansichten von Orbit bis Boden](../../Docs/screenshots/issue-115/provinces_all_biomes.jpg)\n\nPlanetenvielfalt aus #115: dieselben Welten aus Orbit, Anflug und Bodennähe. Die Übersicht zeigt Entwicklungsaufnahmen.\n\n---\n\n[Journey & game design](journey.md) | [Architecture & systems](architecture.md) | [Development workflow](development.md) | [Art & asset pipeline](art-and-assets.md) | [Testing playbook](testing.md) | [Status & priorities](status.md) | [Wiki maintenance](maintenance.md)\n"}, {"title": "Architektur & Systeme", "eyebrow": "Technik verstehen", "summary": "Der Host steuert den Spielzustand. Clients erzeugen Welten aus gemeinsamen Seeds; Besitzer simulieren die Bewegung ihrer Figuren und Schiffe.", "highlights": [["RunManager", "Verwaltet Run, Galaxienwechsel, Schiffe und Speicherstand."], ["WarpFlight", "Steuert die geflogenen Warpstrecken und das Finale mit dem Rift."], ["Builder", "Erzeugen Daten, Materialien, Prefabs und Szenen reproduzierbar."]], "flow": ["Core", "Data", "Ship / Player", "World", "UI"], "note": "Vereinfachte Orientierung im Modulaufbau. Die vollständigen Abhängigkeiten und Networking-Regeln stehen in der Referenz.", "images": [], "id": "architecture", "audience": "developer", "html": "\u003ch2 id=\"ref-0\">Stack\u003c/h2>\u003cul>\u003cli>Unity 6000.6.5f1, URP (\u003ccode>Assets/SourceFiles/Settings/PC_RPAsset\u003c/code>, Forward+), Input System only, TMP (ugui 2.x)\u003c/li>\u003cli>Netcode for GameObjects 2.13.3 + Unity Transport; Facepunch.Steamworks (\u003ccode>Assets/Plugins/Steamworks\u003c/code>, define \u003ccode>VOIDWARD_STEAM\u003c/code>, AppID 480)\u003c/li>\u003cli>Cinemachine 3 (\u003ccode>Unity.Cinemachine\u003c/code>), Multiplayer Play Mode 3.0\u003c/li>\u003cli>Blender 5.2 LTS (optional DCC tool, headless via CLI, no MCP). See &quot;Blender (asset scripts)&quot;.\u003c/li>\u003cli>Developed on two machines: Mac (macOS + WebGL build modules) and Windows PC (Windows build module). See &quot;Cross-platform (Mac + Windows)&quot;.\u003c/li>\u003c/ul>\u003ch2 id=\"ref-1\">Layout (\u003ccode>Assets/_Project\u003c/code>)\u003c/h2>\u003cul>\u003cli>\u003ccode>Scripts/&lt;Module&gt;\u003c/code> with one asmdef each. Dependency order: Core ← Data ← Combat/Inventory/Planet ← Ship ← Player ← AI/World ← Progression/UI; Networking separate.\u003c/li>\u003cli>\u003ccode>Editor/ContentBuilder.cs\u003c/code> (materials, all ScriptableObject data, balance values), \u003ccode>PrefabBuilder.cs\u003c/code> (all procedural meshes + prefabs + network prefab list), \u003ccode>SceneBuilder.cs\u003c/code> (scene \u003ccode>Scenes/Voidward.unity\u003c/code>, lighting, volume, project settings), \u003ccode>PlanetBuilder.cs\u003c/code> (planet presets \u003ccode>Data/Planets\u003c/code>, planet/ocean materials, detail textures, scene \u003ccode>Scenes/PlanetPreview.unity\u003c/code>), \u003ccode>BuildMenu.cs\u003c/code>.\u003c/li>\u003cli>\u003ccode>Shaders/\u003c/code>: VW_ToonFlat (main lit), VW_Planet (triplanar terrain, elevation/slope/region ramp, planet-centered via \u003ccode>_PlanetCenter\u003c/code>), VW_Ocean (depth/opaque-texture water), VW_NebulaSkybox, VW_Atmosphere (depth-based ray-marched scattering shell, Cull Front + ZTest Always), VW_Clouds (procedural cloud shell), VW_Collapse, VW_Unlit, VW_AdditiveParticle, VW_Glass.\u003c/li>\u003cli>\u003cstrong>All content is generated.\u003c/strong> Change the builder code, then run menu \u003ccode>Voidward/Build All Content\u003c/code>. Manual edits to generated prefabs/scene/data are overwritten.\u003c/li>\u003c/ul>\u003ch2 id=\"ref-2\">Architecture\u003c/h2>\u003cul>\u003cli>Session: \u003ccode>SessionManager\u003c/code> (host/join/transport switch, Steam → UTP fallback), \u003ccode>TransportConfig\u003c/code> (CLI: \u003ccode>-transport=utp|steam -autohost -autojoin=IP -autostart -players=N\u003c/code>).\u003c/li>\u003cli>\u003ccode>DirectorSpawner\u003c/code> spawns the GameDirector prefab (\u003ccode>RunManager\u003c/code> + \u003ccode>CombatNet\u003c/code>) on \u003ccode>SessionManager.ServerStarted\u003c/code>.\u003c/li>\u003c/ul>\u003cdetails id=\"ref-3\">\u003csummary>Journey structure (#46)\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>\u003ccode>GalaxyDef\u003c/code> (5 assets, \u003ccode>ContentBuilder.BuildGalaxies\u003c/code>: route, distance, biome pool, enemy mix, \u003ccode>EnemyTier\u003c/code>/\u003ccode>LootTier\u003c/code>, palette, \u003ccode>DriveTier\u003c/code> for #73) -&gt; \u003ccode>GalaxyGenerator.Generate(runSeed, galaxy)\u003c/code> = deterministic \u003ccode>GalaxyPlan\u003c/code> with 4-6 \u003ccode>StarSystem\u003c/code>s (\u003ccode>SystemKind\u003c/code>: Planetary, AsteroidField, Anomaly, Enclave (exactly one, Warden + hoard), Nomads (trader station), Void; system 0 = arrival, galaxy 1 system 0 = &quot;Wormhole Exit&quot; with station). \u003ccode>SystemLayout.Build(seed, galaxy, kind, station)\u003c/code> = the system corridor (planets, fields, wrecks, boss pos). Clients regenerate everything from the synced \u003ccode>RunSeed\u003c/code>/\u003ccode>GalaxyIndex\u003c/code>/\u003ccode>SystemIndex\u003c/code> (\u003ccode>RunManager.Plan\u003c/code>, \u003ccode>CurrentSystem\u003c/code>).\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-4\">\u003csummary>\u003ccode>RunManager\u003c/code>\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>run lifecycle (start / continue / end), galaxy+system flow, warp (no button since #108: \u003ccode>ServerJump(target, lead)\u003c/code> from a jump zone, \u003ccode>ServerWarp(target)\u003c/code> for cheats/dev; \u003ccode>WarpNextGalaxy\u003c/code> = -1 one-way, from galaxy 5 = the flight home (#81); \u003ccode>ServerGoto(g, s)\u003c/code> for dev), ships/players, respawns, run clock (\u003ccode>RunTime\u003c/code>), stats, cheats (\u003ccode>ExecuteCheat(int)\u003c/code>). \u003ccode>SystemDirector\u003c/code> (plain server class): system content (\u003ccode>PopulatePlanet\u003c/code> POIs, wrecks, station), enemy spawning, events, Warden enclave. Revisited systems keep worlds/nodes/nests but spawn no crates (\u003ccode>VisitedMask\u003c/code>). Suspend save: \u003ccode>RunState\u003c/code> (versioned JSON, players by name, ships with modules/cargo) via \u003ccode>RunSave\u003c/code> (one slot \u003ccode>vw_run.json\u003c/code>), written on galaxy entry and \u003ccode>SessionManager.BeforeLeave\u003c/code> (host leaves/quits, also when stopping Play Mode), deleted by \u003ccode>EndRun\u003c/code>; lobby &quot;Continue Run&quot; -&gt; \u003ccode>SessionManager.ContinueRun\u003c/code>. UI: \u003ccode>GalaxyMapView\u003c/code> (key M, \u003ccode>VwInput.Map\u003c/code>), HUD system meter + run clock.\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-5\">\u003csummary>Warp drive (#78)\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>\u003ccode>WarpDrive\u003c/code> (World, on the GameDirector; since #49 the Nostos&#x27;s drive: worked on aboard it, \u003ccode>AtShip\u003c/code>): \u003ccode>Tiers\u003c/code> (NetworkList, tier per \u003ccode>DriveSlot\u003c/code> Core/Navigation/Cooling/Tank, 1-6) + \u003ccode>Exotic\u003c/code> (tank). Parts are items (\u003ccode>ItemKind.DriveComponent\u003c/code>, \u003ccode>ItemDef.Drive\u003c/code> -&gt; \u003ccode>DriveComponentDef\u003c/code>, ids \u003ccode>drive_&lt;core|nav|cooling|tank&gt;_mk&lt;1-6&gt;\u003c/code>), swapped/loaded via \u003ccode>InstallFromInventoryServerRpc\u003c/code> / \u003ccode>LoadExoticServerRpc\u003c/code> near a ship. Balance in \u003ccode>WarpDriveDef\u003c/code> (core speeds, tank sizes, nav/cooling penalties) + \u003ccode>GalaxyDef.LegLength\u003c/code> (minutes with a balanced Mk I) / \u003ccode>LegFuel\u003c/code>; \u003ccode>DriveMath\u003c/code> = pure ETA/fuel math (\u003ccode>Minutes\u003c/code>, \u003ccode>Fuel\u003c/code>, \u003ccode>Eta\u003c/code>, \u003ccode>Delta\u003c/code>; stop \u003ccode>DriveMath.Home\u003c/code> = 6). Galaxy warps (\u003ccode>WarpNextGalaxy\u003c/code>, \u003ccode>WarpSkipGalaxy\u003c/code> = -2) check and burn Exotic Matter in \u003ccode>RunManager.FuelOk/ServerWarp\u003c/code>. UI: inventory tab \u003cem>Warp Drive\u003c/em> (\u003ccode>EventBus.RaiseDrivePanelRequested\u003c/code>), galaxy map ETA/fuel/skip, HUD ETA line, cockpit via \u003ccode>GameState.HomeEta\u003c/code>. Save \u003ccode>RunState\u003c/code> v2 (\u003ccode>DriveTiers\u003c/code>, \u003ccode>Exotic\u003c/code>; v1 loads as Mk I).\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-6\">\u003csummary>Flown galaxy warp (#79)\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>\u003ccode>WarpFlight\u003c/code> (World, on the GameDirector): \u003ccode>RunManager.ServerWarp\u003c/code> to a galaxy stop -&gt; \u003ccode>BeginWarpFlight\u003c/code> (director cleared) -&gt; \u003ccode>WarpFlight.ServerBegin(from, to, lead)\u003c/code> -&gt; ... -&gt; \u003ccode>ServerArrive\u003c/code> -&gt; \u003ccode>RunManager.ServerArrive(stop)\u003c/code> (\u003ccode>WarpTo\u003c/code> or the homecoming). Floating origin: ships stay near x = 0 (\u003ccode>WarpBubble.Axis\u003c/code> = +X), the corridor streams past; route length = model minutes / build factor / \u003ccode>BalancedFactor\u003c/code> x full-throttle speed (\u003ccode>VisualSpeed\u003c/code> per core tier), so a flight at the nav&#x27;s safe speed in fields and full speed elsewhere takes \u003ccode>DriveMath.Minutes\u003c/code>. \u003ccode>WarpRoute\u003c/code> (pure, deterministic per flight seed, obstacles generated per 1 km chunk, id = chunk * 1024 + i): legs, zones (\u003ccode>WarpZone\u003c/code> ExitHalo/Void/ArrivalHalo, 12 % halos per leg), \u003ccode>WarpHazard\u003c/code> (Rock, Debris, Comet, Rift, GravityWell, StrayRock), 3 \u003ccode>WarpSignal\u003c/code>s per leg, \u003ccode>PatrolIn(chunk)\u003c/code>. Server state as NetworkVariables (Progress, Throttle, Heat, Cruise, Stalled, Overheated, Lead, Hazard, DroppedOut, DropSignal, ResumeCountdown, VisitedSignals, \u003ccode>Destroyed\u003c/code> list); fuel burns along the route (a mid-flight suspend save refunds it, the crew continues before the warp). \u003ccode>WarpBubble\u003c/code> (Core, static) carries the local state to Ship/Player: \u003ccode>ShipFlight.WarpStep\u003c/code> (lead: nose/strafe -&gt; lateral velocity, cone 35 deg, corridor walls, \u003ccode>WarpBubble.Pull\u003c/code>; others: formation slot \u003ccode>WarpBubble.FormationOffset\u003c/code>), \u003ccode>ShipSeat.TickPilot\u003c/code> feeds W/S, X, C, G (\u003ccode>VwInput.Cruise/DropOut\u003c/code>), \u003ccode>PlayerPawn\u003c/code> FOV boost. \u003ccode>WarpCorridorView\u003c/code> (client, every peer): obstacle GameObjects inside the scanner range (\u003ccode>ScanRange\u003c/code> = nav fraction x speed x 2.6 s), \u003ccode>WarpObstacleProxy\u003c/code> trigger colliders for shots (like \u003ccode>AsteroidRock\u003c/code>), impact detection for every ship the peer simulates (\u003ccode>ShipFlight.IsSimulating\u003c/code>) -&gt; \u003ccode>ReportImpactServerRpc\u003c/code>, gravity well pull, signal beacon, gas cloud, speed streaks. Sky: \u003ccode>SystemVisuals\u003c/code> swings the destination galaxy ahead and grows it with the progress. Signal sites spawn through \u003ccode>SystemDirector\u003c/code> (\u003ccode>SpawnWreckSite\u003c/code>, \u003ccode>SpawnRoguePlanet\u003c/code>, \u003ccode>TrackedCount\u003c/code>/\u003ccode>TakeTracked\u003c/code>). HUD: route meter + zone, throttle/heat/ETA/Exotic/cruise/signal line, centre warnings, ship card speed = warp throttle.\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-7\">\u003csummary>Flight home + the Rift (#81, \u003cstrong>Rift dropped 2026-10-17, removed in #132\u003c/strong>)\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>the galaxy warp 5 -&gt; \u003ccode>DriveMath.Home\u003c/code> (\u003ccode>WarpFlight.IsFinale\u003c/code>, ~5 min with the Home Drive, LMC \u003ccode>LegLength\u003c/code> 1200 / speed 240). \u003ccode>RiftStart\u003c/code> (NetworkVariable, route m) = \u003ccode>FinaleSeconds\u003c/code> (300 s) of planned flight before the end, walked back over the real zones (\u003ccode>FinaleStartOf\u003c/code>; 0 with the Home Drive, the last ~5 min with weaker drives); \u003ccode>WarpRoute(finaleStart)\u003c/code> makes that stretch denser (void: stray rocks, rift walls, comets, wells), drops signals in/near it and the arrival welcome party. Server: \u003ccode>ServerRift\u003c/code> wakes the Rift at \u003ccode>RiftStart\u003c/code> with a 40 s lead, moves it at 0.8 -&gt; 1.02 x the build&#x27;s planned speed at the Rift&#x27;s own position (\u003ccode>PlannedSpeedAt\u003c/code>: fields = nav fraction, void = sustain, so weak drives are not unfair in halos) -&gt; \u003ccode>RiftGap\u003c/code>/\u003ccode>RiftSpeed\u003c/code> NetworkVariables; close (&lt; \u003ccode>RiftCloseSeconds\u003c/code> 12 s) = warning + extra heat; at 55 % of the chase \u003ccode>ServerWardenWave\u003c/code> (tough interceptors of the last galaxy, they interdict); drop-outs are blocked while it chases; gap &lt;= 0 -&gt; \u003ccode>RunManager.ServerRiftCaught\u003c/code> (the time loop, #86). Arrival -&gt; \u003ccode>ServerArrive(Home)\u003c/code> -&gt; homecoming result (placeholder for the Sol approach, #74). Client: \u003ccode>WarpCorridorView.UpdateRift\u003c/code> = VW_Collapse maw (\u003ccode>ContentCatalog.CollapseMaterial\u003c/code>) + halo ring + tendrils behind the bubble, distance/size by \u003ccode>RiftSeconds\u003c/code>, violet pulse/shake + violet streaks when close; HUD rift pip on the route meter, &quot;THE RIFT n s BEHIND&quot; line, &quot;THE RIFT IS CLOSING IN&quot; centre warning, objective &quot;THE FLIGHT HOME&quot;.\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-8\">\u003csummary>System cruise + hops (#80)\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>\u003ccode>ShipFlight\u003c/code> cruise (authority of a piloted ship): hold C (\u003ccode>ShipSeat\u003c/code> -&gt; \u003ccode>SetCruiseInput\u003c/code>) for \u003ccode>CruiseSpool\u003c/code> 2 s, then \u003ccode>DriveMath.CruiseSpeed\u003c/code> per core tier (\u003ccode>WarpDriveDef.CruiseSpeed\u003c/code> 1-3 km/s, \u003ccode>WarpBubble.CoreTier\u003c/code> written by \u003ccode>WarpDrive\u003c/code>), owner-written \u003ccode>CruiseNet\u003c/code> (\u003ccode>CruiseMode\u003c/code>). Ends: X/S/C, a hull hit (\u003ccode>OnHullHit\u003c/code> = interdiction, blocks 3 s), engaged enemies within \u003ccode>CombatLockRange\u003c/code> (\u003ccode>Threat.EngagedNear\u003c/code>), a sphere cast ahead (collision alert), and towards a planet the closing speed eases down to normal flight at \u003ccode>GravitySource.CruiseRadius\u003c/code> (gravity field, at least radius + 1 km; \u003ccode>CruiseClearance\u003c/code>). Gravity + combat lock also hold jump zones (\u003ccode>RunManager.JumpBlockFor\u003c/code>). System warps are flown hops: \u003ccode>WarpFlight.ServerBeginHop\u003c/code> (\u003ccode>TargetSystem\u003c/code> &gt;= 0, \u003ccode>IsHop\u003c/code>), \u003ccode>WarpRoute(hop: true)\u003c/code> = one leg, 20 % system outskirts at each end with 40 % rock density, no signals/welcome party, \u003ccode>ZoneName\u003c/code>; length from \u003ccode>DriveMath.HopMinutes\u003c/code> (\u003ccode>WarpDriveDef.HopMinutes\u003c/code> 1.5 x factor / speed^0.35), no Exotic Matter; arrival \u003ccode>RunManager.ServerArriveSystem\u003c/code> -&gt; system edge. Interdiction in any warp: engaged enemies within \u003ccode>WarpFlight.InterdictRange\u003c/code> of the lead ship or enemy hits on its hull stop the bubble (\u003ccode>[Warp] interdicted\u003c/code>). Normal flight: module thrust/top speed capped at \u003ccode>ShipCore.NormalFlightCap\u003c/code> (+30 %).\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-9\">\u003csummary>Jump zones (#108)\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>no warp button or countdown. \u003ccode>SystemLayout.AddJumpZones(plan, system)\u003c/code> (also in \u003ccode>GalaxyGenerator.Layout\u003c/code> and \u003ccode>SystemDirector.Enter\u003c/code>) puts \u003ccode>JumpZone\u003c/code>s (Core, \u003ccode>JumpZones\u003c/code> static: \u003ccode>Current\u003c/code>, \u003ccode>Blocks\u003c/code>, \u003ccode>CrewMissing\u003c/code>, \u003ccode>Entering\u003c/code>, \u003ccode>Veil\u003c/code>) on an ellipsoid around the corridor, pushed out until clear of every planet&#x27;s gravity field: a hop zone to each neighbouring system (\u003ccode>GalaxyPlan\u003c/code> order, aimed like the map), and in the outermost system the Galactic Rim (\u003ccode>WarpNextGalaxy\u003c/code>, normal = \u003ccode>SystemVisuals.DestinationDir\u003c/code>; LMC: \u003ccode>JumpKind.Home\u003c/code> towards \u003ccode>MilkyWayDir\u003c/code>) plus the skip zone (\u003ccode>WarpSkipGalaxy\u003c/code>, beside it, further out). \u003ccode>WarpFlight.Jumps.cs\u003c/code> (partial): server packs a \u003ccode>JumpBlock\u003c/code> per zone into \u003ccode>JumpBlocks\u003c/code> (crew not aboard = a living pawn neither seated nor inside a \u003ccode>GravityVolume\u003c/code>; Exotic Matter/tank; combat/gravity lock via \u003ccode>RunManager.JumpBlockFor\u003c/code>); a piloted ship inside an open zone that crosses its plane cruising, or after \u003ccode>JumpZones.AlignSeconds\u003c/code> (3 s) nose outward, starts the entry (\u003ccode>EntryAt\u003c/code> = server time + \u003ccode>EnterSeconds\u003c/code> 2.6 s: FOV, entry speed lines in \u003ccode>WarpCorridorView\u003c/code>, veil) -&gt; \u003ccode>RunManager.ServerJump\u003c/code> -&gt; \u003ccode>BeginWarpFlight(seamless)\u003c/code> -&gt; \u003ccode>WarpFlight.ServerRebaseIntoBubble\u003c/code> (every ship keeps its offset/attitude to the lead turned so the lead&#x27;s nose = \u003ccode>WarpBubble.Axis\u003c/code>; ships &gt; 450 m away get a formation slot; the bubble starts in warp cruise at ~nav/sustain x 0.8). End of the route: \u003ccode>ServerBeginExit\u003c/code> holds the flight \u003ccode>ExitSeconds\u003c/code> 0.8 s while the veil rises, then \u003ccode>RunManager.ServerArrive(System)(.., lead)\u003c/code> -&gt; \u003ccode>RegroupOutOfWarp\u003c/code> (rigid transform to \u003ccode>SystemLayout.Arrival(fromSystem)\u003c/code>: inside the zone leading back, nose inward; galaxies: \u003ccode>StartPoint\u003c/code>) + \u003ccode>ShipFlight.ArriveFromWarpRpc\u003c/code> (owner, applied once the bubble state ended: piloted ships cruise in). The veil (\u003ccode>RebaseAt\u003c/code>, \u003ccode>VeilAt\u003c/code> curve, colour by \u003ccode>VeilKind\u003c/code>) is a full-screen image in \u003ccode>UIRoot\u003c/code>. Blocked zones: \u003ccode>ShipFlight.JumpZoneHold\u003c/code> (owner) dumps cruise and holds the ship at the plane. Visuals: \u003ccode>SystemVisuals.BuildJumpZones\u003c/code> (turning beacon ring + motes, additive dots, colour per \u003ccode>JumpKind\u003c/code>); HUD: zone markers with block reason, centre \u003ccode>JumpMessage\u003c/code> (ALIGNING n% / JUMP ZONE HOLDS - reason / WARP ENTRY); galaxy map = navigation only (hop lanes, zone list, galaxy warp ETA/fuel).\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-10\">\u003csummary>Time loop (#86, \u003cstrong>dropped 2026-10-17, still in the code until #132 removes it\u003c/strong>)\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>every run is a loop; \u003ccode>RunManager.Loop\u003c/code> (NetworkVariable, the host&#x27;s \u003ccode>Meta.Loops\u003c/code> + 1, in \u003ccode>RunState\u003c/code> v3 with the logbook). Story texts are data: \u003ccode>StoryDef\u003c/code> (\u003ccode>ContentCatalog.Story\u003c/code>, \u003ccode>ContentBuilder.BuildStory\u003c/code>: deja-vu radio per loop, radio echoes per galaxy (6 = flight home) with \u003ccode>MinLoop\u003c/code>, crew logbook templates with {loop}/{galaxy}/{eta}/{part}/{ship}, reset banners). Crew logbook: \u003ccode>RunManager.ServerLog(template)\u003c/code> at milestones (loop start, galaxy reached, Warden enclave cleared, better drive part installed (\u003ccode>WarpDrive\u003c/code>), Ark lost, flight home, death, homecoming) -&gt; \u003ccode>EventBus.LogbookEntry\u003c/code> (HUD ticker) + \u003ccode>RunSummary.Log\u003c/code>. Death (crew lost / caught by the Rift) = \u003ccode>EndRun\u003c/code> -&gt; \u003ccode>GamePhase.GameOver\u003c/code> -&gt; every client plays \u003ccode>LoopView.Collapse\u003c/code> (unscaled, \u003ccode>Time.timeScale\u003c/code> slow-mo, violet iris + shutters closing to black, &quot;THE LOOP RESETS&quot;) -&gt; results screen = the loop&#x27;s logbook (cause, galaxy, core, Home ETA + best, log) -&gt; host &quot;New Loop&quot; (\u003ccode>NewLoopServerRpc\u003c/code> -&gt; \u003ccode>ServerNewLoop\u003c/code> = \u003ccode>ClearRun\u003c/code> + \u003ccode>ServerStartRun\u003c/code>) or Lobby. Start: a player&#x27;s first loop (\u003ccode>Meta.Loops == 0\u003c/code>) gets the intro cinematic, later loops the short deja-vu (\u003ccode>LoopView.DejaVu\u003c/code>: violet flash + distorted radio, read 0.6 s after the phase change because clients get \u003ccode>Loop\u003c/code> later); echoes play on entering a galaxy this player has reached before (\u003ccode>Meta.Data.BestSector\u003c/code>). Meta: \u003ccode>Meta.Loops\u003c/code> (= \u003ccode>Runs\u003c/code>), \u003ccode>MetaSave.BestEtaMinutes\u003c/code>.\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-11\">\u003csummary>Home ship Nostos (#49)\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>\u003ccode>ShipClass.HomeShip\u003c/code> (\u003ccode>ShipCore.IsHome\u003c/code>, \u003ccode>ShipCore.Home\u003c/code>), prefab \u003ccode>Ship_Nostos\u003c/code> from \u003ccode>NostosBuilder\u003c/code> (partial \u003ccode>ContentBuilder\u003c/code>; hull = the Ark asset at 1.5 x by \u003ccode>Tools/Blender/nostos.py\u003c/code>, which also ingests/builds \u003ccode>Nostos_Hall\u003c/code> (corridor kit, one wall mirrored, doors removed, airlock cut) and \u003ccode>Nostos_CryoPod\u003c/code>; \u003ccode>GltfModelSource\u003c/code> imports them with their glTF texture folders). Rooms stern to bow: engine room (warp core + \u003ccode>ShipTerminal.Mode.WarpDrive\u003c/code>, engineer, aft turret), cargo hall (the kit at \u003ccode>NHallZ\u003c/code>, airlock + ramp, fabricator, cargo, \u003ccode>DockHatch\u003c/code>es), cryo bay (\u003ccode>CryoPod\u003c/code> x4), bridge (platform + ramp, Dart fittings, forward turret). The \u003ccode>N*\u003c/code> constants in \u003ccode>NostosBuilder\u003c/code> must match \u003ccode>nostos.py\u003c/code> ROOMS/DOOR/HALL_Z. \u003ccode>RunManager\u003c/code>: the run (and the suspend save, \u003ccode>ShipSave\u003c/code> of class HomeShip) spawns the Nostos first (\u003ccode>SpawnHomeShip\u003c/code>), each player&#x27;s Dart docks at clamp = player slot, players start seated in it; destroyed = \u003ccode>EndRun\u003c/code> (&quot;Nostos destroyed&quot;, \u003ccode>StoryDef.ResetHomeLost/LogHomeLost\u003c/code>); fallen players wake at their \u003ccode>CryoPod\u003c/code> (\u003ccode>TryRespawnPoint\u003c/code>, \u003ccode>ShipCore.ServerCryoWake\u003c/code>), \u003ccode>RespawnsLeft\u003c/code> = cryo charges (HUD &quot;CRYO&quot;); replacement Darts wait at a free clamp. Docking: \u003ccode>ShipCore.DockedTo\u003c/code>/\u003ccode>DockIndex\u003c/code> (server-written), \u003ccode>ServerDock/ServerUndock\u003c/code>, \u003ccode>RequestDockServerRpc\u003c/code> (authority of a piloted ship within \u003ccode>DockClamp.CaptureRange\u003c/code> 16 m / \u003ccode>CaptureSpeed\u003c/code> 14 m/s of a free clamp, \u003ccode>ShipFlight.TryDock\u003c/code>), \u003ccode>RequestUndockServerRpc\u003c/code> (pilot holds W/up 0.6 s, not in warp) -&gt; \u003ccode>ShipFlight.LaunchFromDockRpc\u003c/code>; a docked ship has its colliders off, its authority pins it to the clamp (\u003ccode>DockStep\u003c/code>) and every peer snaps it in \u003ccode>LateUpdate\u003c/code> (\u003ccode>ShipFlight\u003c/code> runs at execution order -60, before the seated pawns); \u003ccode>ShipSeat.ExitPoint\u003c/code> of a docked ship = the clamp&#x27;s hatch inside. Warps: \u003ccode>WarpFlight.PickLead\u003c/code> = the Nostos while it exists, only its pilot opens jump zones, \u003ccode>ServerDockForWarp\u003c/code> docks every free small ship under the veil (\u003ccode>PlayerClamp\u003c/code>), docked ships are skipped by formation/regroup/impact code. Heavy landing (\u003ccode>ShipDef.HeavyLanding\u003c/code>, \u003ccode>MaxLandingSlope\u003c/code> 14 deg, \u003ccode>MaxDescentSpeed\u003c/code> 6 m/s): \u003ccode>ShipFlight.HeavyLanding\u003c/code> caps the descent within 120 m and hovers at 10 m over steeper ground (3-point \u003ccode>GroundSlope\u003c/code>). \u003ccode>ShipDef.Hardpoints\u003c/code> (\u003ccode>ShipHardpoint\u003c/code>: name, \u003ccode>ModuleSlot\u003c/code>, position, normal) = data for #50.\u003c/p>\u003c/div>\u003c/details>\u003cdetails id=\"ref-12\">\u003csummary>Crew body (#95)\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>the CoP spacesuit (\u003ccode>Art/Models/Crew/Crew_Suit.fbx\u003c/code>, own UE4-style skeleton, Humanoid) animated by the Quaternius UAL (\u003ccode>Art/Animations/UAL/UAL_Standard.fbx\u003c/code>, CC0, Humanoid, retargeted); \u003ccode>CrewBuilder\u003c/code> (partial \u003ccode>ContentBuilder\u003c/code>) builds the importers, the used clips, \u003ccode>Crew_Locomotion.controller\u003c/code> (Speed signed fwd m/s, Mode 0 ground / 1 air / 2 EVA, Fire trigger; arms layer with mask for held tools) and \u003ccode>Crew_Seated.controller\u003c/code> (sitting loop, IK pass); without the suit FBX the UAL mannequin is the body, without UAL the procedural astronaut. On foot: \u003ccode>CrewAnimator\u003c/code> (Player, every peer, no NetworkAnimator): speed from the pawn&#x27;s interpolated motion, mode/tool/use from the owner-written \u003ccode>PlayerPawn.Pose\u003c/code> byte (\u003ccode>PackPose\u003c/code>/\u003ccode>UnpackPose\u003c/code>), strafe/backwards = body yaw +-70 deg + reversed locomotion, held tool = a copy of the tool model under the right hand (\u003ccode>HandGrip\u003c/code> from the bind pose). Seated: \u003ccode>CrewSeatPose\u003c/code> (Ship) on \u003ccode>ShipSeat.seatedBody\u003c/code>: eyes aligned to the seat&#x27;s ViewPoint once per sit-down, wrist IK + finger curl on optional grips (Dart: \u003ccode>Interior/Stick|Throttle/GripIK\u003c/code>, \u003ccode>SeatGrips\u003c/code>), shown for the local pilot too with the head bone collapsed. Crew colour (#60) = the visor rim (\u003ccode>CrewLights.colorProperty\u003c/code> \u003ccode>_RimColor\u003c/code>). Tools (\u003ccode>GearModelBuilder\u003c/code>): \u003ccode>Art/Models/Tools/Tool_&lt;Drill|Blaster|Rifle&gt;.fbx\u003c/code> from \u003ccode>Tools/Blender/crew_assets.py\u003c/code> (barrel +Z, origin = palm on the grip), materials by importer remap (\u003ccode>RemapMaterials\u003c/code>), first-person viewmodels at real size with \u003ccode>PlayerPawn.toolMuzzles\u003c/code> (\u003ccode>ToolMuzzle\u003c/code>), icons rendered from the models; the medkit stays procedural.\u003c/p>\u003c/div>\u003c/details>\u003cul>\u003cli>\u003ccode>GameState\u003c/code> (Core/Contracts.cs): static shared client state (UIOpen, Phase, SectorIndex, Objective…).\u003c/li>\u003cli>Authority: pawns + ships use owner-authoritative NetworkTransform; pilot seat transfers ship ownership. Projectiles are server-simulated in \u003ccode>CombatNet\u003c/code> with cosmetic client copies. Planets/asteroids are seed-synced, not replicated.\u003c/li>\u003c/ul>\u003cdetails id=\"ref-13\">\u003csummary>Planets (#17, #21)\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>radius 1.0-1.9 km (\u003ccode>SystemLayout.Min/MaxPlanetRadius\u003c/code>, 0-3 per system depending on its kind, alternating corridor sides). \u003ccode>BiomeDef.Shape\u003c/code> -&gt; \u003ccode>PlanetShapeDef\u003c/code> (noise layers, landforms = volcano/mesa/spire/basin/dome, canyon network incl. river/lava channels, craters, ocean, region colors, sites, atmosphere, clouds, decor style, particles, weather). \u003ccode>PlanetTerrain\u003c/code> = deterministic, thread-safe height field (single source of truth for chunks, colliders, decor, sites, \u003ccode>PlanetBody\u003c/code> queries, \u003ccode>Raycast\u003c/code>). \u003ccode>PlanetVisuals\u003c/code> = 6 quadtrees of chunks (\u003ccode>PlanetMesh.BuildChunk\u003c/code> on worker threads, tangent-adjusted cube mapping, skirts, horizon culling), collider tiles streamed around \u003ccode>TerrainAnchor\u003c/code>s (pawn + ship prefabs), per-chunk props (\u003ccode>PlanetDecor\u003c/code>), set pieces (\u003ccode>PlanetLandmarks\u003c/code>), ocean/atmosphere/cloud shells. \u003ccode>PlanetAmbience\u003c/code> (client) = particles, weather, haze/ambient override, wind audio. \u003ccode>PlanetBody.SiteKinds\u003c/code> (deterministic) drive POI clusters in \u003ccode>SystemDirector.PopulatePlanet\u003c/code> and HUD site markers. \u003ccode>GravitySource.GroundRadiusAt\u003c/code> makes altitude checks terrain-aware. Far terrain has no colliders: use \u003ccode>PlanetBody.Raycast/SurfaceWorldPoint\u003c/code> or \u003ccode>GravitySource.GroundPoint\u003c/code>, not Physics, for spawn/placement. Dev preview: menu \u003ccode>Voidward/Open Planet Preview\u003c/code>, then Play. Planet look (#70): VW_Planet = soft wrap lighting (no toon bands), procedural macro noise (never fades), cavity AO from chunk UV1.x (mesh Laplacian), cliff strata; VW_Ocean = depth absorption, reflects the planet&#x27;s own sky (\u003ccode>_SkyColor\u003c/code>/\u003ccode>_HorizonColor\u003c/code>), distance-dependent GGX glint, shore foam, \u003ccode>PlanetShapeDef.Lava\u003c/code> switches to the crust/crack lava mode; VW_Clouds = soft edges + sun-offset self shadow. Planets 3.0 (#115): \u003ccode>PlanetTerrain\u003c/code> erosion (\u003ccode>PlanetShapeDef.ErosionDepth/Scale/Octaves/Slope/Branching\u003c/code>, preset helper \u003ccode>PlanetBuilder.Erosion\u003c/code>) = downhill branching gullies from jittered 3D plane-wave cells, steered by a slope grid precomputed once per planet (parallel, ~0.3 x gully wavelength on the cube faces); \u003ccode>ElevationFrac(d, minWavelength)\u003c/code> band-limits noise octaves + erosion (chunks pass 2.2 x vertex spacing; gameplay queries use full detail; skirts reach \u003ccode>ErosionDepthMeters\u003c/code> deeper). Own RNG, so craters/landforms/sites of a seed did not move. Decor: \u003ccode>Prop.Outcrop\u003c/code> (big rocks half buried in slopes steeper than \u003ccode>MinSlope\u003c/code>, aligned to the hillside); far decor (\u003ccode>PlanetDecor.GenerateFar\u003c/code>, procedural, no colliders, 60 % / 30 % density) on the two LOD levels above the large-decor level, shown only while that node itself is drawn (\u003ccode>Node.FarDecor\u003c/code>). \u003ccode>LodQuality\u003c/code> default 2, \u003ccode>_LayerFade\u003c/code> 300. Water: \u003ccode>VW_Ocean\u003c/code> screen-space reflections (\u003ccode>_SSR\u003c/code>, LOD-0 samples), \u003ccode>ShoreFoam\u003c/code> (1 surf, ~0.3 calm lakes); \u003ccode>VW_Planet\u003c/code> wet shore band via \u003ccode>_SeaRadius\u003c/code>/\u003ccode>_WetBand\u003c/code>. Provinces (#115): \u003ccode>PlanetShapeDef.Provinces\u003c/code> (\u003ccode>ProvinceDef\u003c/code>: Kind Plains/Hills/Mountains/Plateau/Basin, Share, Elevation, Relief, Frequency, Sharpness, Terraces, EdgeCliff, Erosion, Region; preset helpers \u003ccode>PlanetBuilder.Prov/Provinces\u003c/code>) replace most global noise layers: \u003ccode>ProvinceCount\u003c/code> jittered Fibonacci cells (own RNG, kinds by quota so every seed shows the mix, per-cell height \u003ccode>Lift\u003c/code>), soft Voronoi over a two-octave warped direction (\u003ccode>ProvinceBlend\u003c/code>, \u003ccode>ProvinceWarp\u003c/code>); cliff provinces sharpen their elevation step (strength varies along the edge), erosion and the colour zone (\u003ccode>RegionAt\u003c/code>) follow the provinces. Far decor skips rocks (they read as dark specks); \u003ccode>PlanetVisuals.FarDecor\u003c/code> = dev switch. PBR surface layers (#100): \u003ccode>PlanetShapeDef.Ground/Cliff/Region/Low/PeakLayer\u003c/code> (\u003ccode>SurfaceLayer\u003c/code>: albedo, OpenGL normal, ARM mask, scale m, tint, normal, contrast, mean colour filled by the builder) from \u003ccode>Art/Terrain/&lt;Set&gt;/\u003c/code> (CC0 Poly Haven/ambientCG, converted by \u003ccode>Tools/Blender/planet_assets.py --ingest\u003c/code>), assigned per preset in \u003ccode>PlanetBuilder.AssignSurfaceLayers\u003c/code>; \u003ccode>PlanetVisuals.ApplySurfaceLayers\u003c/code> enables \u003ccode>_SURFACE_LAYERS\u003c/code> on VW_Planet: nested weights (region, low = below sea + \u003ccode>ShoreBand\u003c/code>, peak above \u003ccode>PeakStart\u003c/code>, cliff on top), triplanar with explicit gradients (weak layers/projections are skipped), the ramp tints the set by luminance (ramp colour x texture brightness / set mean), ARM roughness drives the highlight; it fades back to the procedural look at \u003ccode>_LayerFade\u003c/code> x ground scale, so orbit views are unchanged. No ground layer = the old procedural look. Asset props (#100): \u003ccode>Tools/Blender/planet_assets.py\u003c/code> (build) exports \u003ccode>Art/Models/Planet/Planet_&lt;Rock|MossRock|Crystal|Ice|AlienTree|FistPlant|MinePlant|AlienPlant|Mushroom&gt;*.fbx\u003c/code> (rocks: centre origin, radius 1; others: bottom origin, height 1; 0.9-4.5k tris), \u003ccode>PlanetModelBuilder\u003c/code> imports them CPU-readable with the source folder&#x27;s materials -&gt; \u003ccode>ContentCatalog.PlanetProps\u003c/code>. \u003ccode>PlanetPropLibrary\u003c/code> (Planet) copies them into arrays once; families by id prefix (&quot;Pod&quot; = the small alien plants). \u003ccode>PlanetDecor.AssetFamily\u003c/code> maps procedural props to families (rocks/pebbles/boulders -&gt; Rock, jungle -&gt; MossRock, desert -&gt; DesertRock; ice shard/spike -&gt; Ice; crystal/spire -&gt; Crystal; pod, tree, mushroom; shrub -&gt; SpruceBush, conifer -&gt; Spruce, cactus -&gt; Saguaro, dry bush -&gt; Rooibos, fern -&gt; Fern, dead tree -&gt; DeadTree, basalt -&gt; Basalt (\u003ccode>StackBasalt\u003c/code>), hoodoo -&gt; stacked DesertRock), the variant comes from the prop&#x27;s own seed (placement unchanged); worker threads bake them into a \u003ccode>PropBatch\u003c/code> per chunk -&gt; \u003ccode>DecorProps\u003c/code> child (submesh per model material; \u003ccode>PlanetVisuals.PropMaterial\u003c/code> tints rock/crystal/ice by \u003ccode>DecorColors\u003c/code>). Still procedural: vent, ember rock (they glow). Foliage cards get bent normals in the build (\u003ccode>FOLIAGE\u003c/code> material keywords), else back-lit cards turn black. Landmarks: frozen spires, elder tree, giant fungi, crystal colossus, floating isles, boulder field, hoodoos, basalt organ use the assets (glow bits stay procedural). \u003ccode>Generated\u003c/code> textures (MetallicSmoothness packs) are imported at once even inside BuildAll&#x27;s asset editing block (\u003ccode>assetBatching\u003c/code>), so a new asset needs one build, not two. Asteroids (\u003ccode>SystemVisuals\u003c/code> fields, \u003ccode>WarpCorridorView\u003c/code> rocks) use the Rock family: one submesh per variant, convex MeshCollider on the scan scaled by the radius, fragments = the scan.\u003c/p>\u003c/div>\u003c/details>\u003cul>\u003cli>Seats don&#x27;t reparent: the pawn follows \u003ccode>ShipSeat.SeatOf\u003c/code> in LateUpdate; seated capsules are disabled on all peers.\u003c/li>\u003c/ul>\u003cdetails id=\"ref-14\">\u003csummary>Light, sky, VFX (#96)\u003c/summary>\u003cdiv class=\"detail-body\">\u003cp>\u003ccode>VW_NebulaSkybox\u003c/code> = NASA SVS star map cubemap (\u003ccode>Art/Sky/Starmap_8k.jpg\u003c/code>, 2048 faces, keyword \u003ccode>_STARMAP\u003c/code>, rotated per galaxy by \u003ccode>SystemVisuals.StarMapRotation\u003c/code>, \u003ccode>PaletteDef.StarField\u003c/code>/\u003ccode>NebulaField\u003c/code>) + domain-warped nebula. Reflections: \u003ccode>SystemVisuals\u003c/code> renders one sky-only realtime \u003ccode>SkyProbe\u003c/code> per system; reflection cameras get the global \u003ccode>_VWReflectionPass\u003c/code> = 1, so the sky adds a soft fill there (PBR metal reflects shape, not black). Realtime probes must stay on in QualitySettings (\u003ccode>SceneBuilder.EnableRealtimeProbes\u003c/code>). Post: ACES, HDR grading, SMAA High, 4K main-light shadows; per-galaxy grade in \u003ccode>PaletteDef\u003c/code>. VFX: \u003ccode>VW_FlipbookParticle\u003c/code> (premultiplied, \u003ccode>_Additive\u003c/code>, frame blending, soft particles); \u003ccode>VfxManager\u003c/code> textured layers (Unity Labs flipbooks, Kenney sprites) from \u003ccode>SkyVfxBuilder\u003c/code>, sources converted by \u003ccode>Tools/Blender/space_textures.py\u003c/code>; missing textures fall back to the procedural look. Projectiles (\u003ccode>CombatNet.DressVisual\u003c/code>): camera-facing head glow/flare (\u003ccode>VW_GlowSprite\u003c/code>, child quad of the pooled bolt, colour by property block), short textured energy trail for bolts/orbs, smoke trail for missiles (catalog \u003ccode>Fx*Material\u003c/code>). Engines: \u003ccode>VW_Plume\u003c/code> shock diamonds + turbulent flicker, \u003ccode>NozzleGlow\u003c/code> sprite per thruster (\u003ccode>PrefabBuilder.Thrusters\u003c/code>). Warp speed lines, comet tails and Rift tendrils use the Kenney streak (\u003ccode>FxStreakMaterial\u003c/code>). Journey sky: \u003ccode>GalaxyDef.NextGalaxyImage\u003c/code> (M31 GALEX, NGC 6822 ESO, Leo I generated, LMC ESO) and \u003ccode>ContentCatalog.MilkyWayImage\u003c/code> (NASA/JPL artist concept), converted by \u003ccode>Tools/Blender/galaxy_textures.py\u003c/code>; \u003ccode>SystemVisuals.SkyImage\u003c/code> = camera-facing quad with a fixed roll (\u003ccode>VW_SkyImage\u003c/code>, unfogged \u003ccode>_FogAmount\u003c/code> 0), the dot spirals stay as the fallback.\u003c/p>\u003c/div>\u003c/details>\u003cul>\u003cli>Floating origin: each system is generated around the origin; on warp, ships and pawns are rebased via \u003ccode>NetTeleport\u003c/code> (sent to the transform owner). \u003ccode>SystemVisuals\u003c/code> (client) builds asteroids, galaxy palette, music and the journey sky (destination galaxy + Milky Way growing per galaxy).\u003c/li>\u003cli>UI is fully code-built (\u003ccode>UIKit\u003c/code>, \u003ccode
