, einen Fund einsammeln und wieder an Bord gehen.\n\n## 1. Eine Sitzung starten\n\nIm Hauptmenü wählst du Host Game. Allein spielen funktioniert ebenfalls als Host. Für eine gemeinsame Runde kommen die anderen zuerst in deine Lobby.\n\n1. **Mission starten.** Als Host klickst du in der Lobby auf Start Mission beim ersten Start oder auf New Loop bei späteren Durchläufen.\n\n2. **Vorhandene Reise fortsetzen.** Wenn ein gespeicherter Run existiert, bietet die Lobby Continue Run an. Das setzt die Reise des Hosts fort.\n\n**Das solltest du sehen:** Im regulären neuen Run startet ihr bei der Nostos; jede Person sitzt in ihrer angedockten Dart. Ein Intro kann dem Spielbeginn vorausgehen.\n\n## 2. Erst einmal an Bord umsehen\n\n1. **Noch nicht losfliegen.** Drücke in der angedockten Dart F. Du verlässt den Sitz und stehst am Zugang im Inneren der Nostos.\n\n2. **Die Nostos erkunden.** Bewege dich mit WASD, sieh dich mit der Maus um. Auf der Brücke findest du das Steuer, im Frachtraum Cargo und Fabricator, im Maschinenraum den Warp-Antrieb.\n\n3. **Interaktionshinweise suchen.** Gehe nah an einen Sitz oder ein Terminal und schaue darauf. Sobald ein Hinweis wie [F] Take the helm erscheint, kannst du mit F interagieren.\n\n**Das solltest du sehen:** Die Nostos ist eure gemeinsame Basis. Zum ersten Kennenlernen musst du weder den Warp-Antrieb bedienen noch das Schiff verlassen.\n\n## 3. Ein kleiner Ausflug mit der Dart\n\n1. **Die Dart besteigen.** Suche an ihrem Zugang den Hinweis Board … und drücke F. Halte W kurz gedrückt, um von der Andockklammer zu starten.\n\n2. **Fluggefühl ausprobieren.** Mit der Maus steuerst du die Nase, mit WASD bewegst du das Schiff, mit Space / Strg nach oben und unten. X bremst. Bleibe zum Üben in der Nähe der Nostos.\n\n3. **Ein nahes Ziel wählen.** M öffnet die Übersicht über das System und die Nachbarsysteme. Suche im HUD einen Planeten, eine Fundstelle oder eine Station. Für den ersten Ausflug reicht ein nahes Ziel im selben System.\n\n4. **Langsam ankommen.** Bremse vor der Oberfläche oder Station. Für eine Landung wählst du eine freie, möglichst ebene Stelle und sinkst langsam. F verlässt den Sitz – benutze es erst, wenn du sicher aussteigen kannst.\n\nWeiterlesen: [Steuerung & Anzeigen](controls.md) · [Erkunden, sammeln & überleben](exploration.md)\n\n## 4. Etwas finden und wieder heimbringen\n\n1. **Eine Kiste öffnen oder einen Rohstoff abbauen.** Gehe nah heran. Kisten öffnest du mit F beim Hinweis Open crate. Für eine Rohstoffader wählst du 1 und hältst die linke Maustaste auf das Vorkommen.\n\n2. **Beute prüfen.** Öffne mit Tab dein Inventory. Dort siehst du, was im Rucksack liegt. Behalte draußen den Sauerstoff im Blick und kehre frühzeitig zum Schiff zurück.\n\n3. **Zur Nostos zurückkehren.** Fliege langsam an eine freie Andockklammer. Die Dart dockt bei geringer Relativgeschwindigkeit automatisch an. Mit F verlässt du den Sitz ins Innere.\n\n**Das solltest du sehen:** Deine erste Expedition ist gelungen, sobald du mit Beute zurück bist. Danach kannst du Cargo sortieren, etwas herstellen oder ein besseres Teil einbauen.\n\nWeiterlesen: [Beute nutzen & besser ausrüsten](equipment.md) · [Nostos, Dart & Zusammenspiel](nostos.md)\n\n## Was mache ich danach?\n\n### Mehr entdecken\n\nFundstellen, Wracks und Stationen besuchen. Rohstoffe und bessere Ausrüstung sammeln.\n\n[Anleitung öffnen](exploration.md)\n\n### Die Heimreise verkürzen\n\nDen gemeinsamen Warp-Antrieb mit besseren Teilen ausrüsten. Beobachte dabei die Home ETA.\n\n[Anleitung öffnen](equipment.md)\n\n### Das System verlassen\n\nDie Nostos steuern und eine passende Sprungzone durchfliegen.\n\n[Anleitung öffnen](travel.md)\n\n---\n\nQuellenabgleich: 2026-10-17. Kein neuer vollständiger Spieltest.\n\n[MenuScreens.cs](../../Assets/_Project/Scripts/UI/MenuScreens.cs) · [RunManager.cs](../../Assets/_Project/Scripts/World/RunManager.cs) · [ShipSeat.cs](../../Assets/_Project/Scripts/Ship/ShipSeat.cs) · [ShipFlight.cs](../../Assets/_Project/Scripts/Ship/ShipFlight.cs)\n"}, {"id": "controls", "title": "Steuerung & Anzeigen", "eyebrow": "Schnell nachschlagen", "summary": "Die wichtigsten Tasten für deinen nächsten Schritt. Die Belegung ist der Standard; in Settings kannst du sie ändern. Im Spiel angezeigte Tasten haben Vorrang.", "goal": "Du findest die richtige Taste und erkennst die Anzeigen, auf die es gerade ankommt.", "sections": [{"id": "basics", "title": "Immer nützlich", "controls": [["F", "Mit dem anvisierten Objekt interagieren; im Sitz: aufstehen."], ["Tab", "Inventory, Ship, Crafting und Warp Drive öffnen."], ["M", "Galaxiekarte öffnen und Reiseziele / Sprungzonen ansehen."], ["T / mittlere Maustaste", "Ein Ziel für die Crew markieren."], ["Esc", "Menü öffnen."]]}, {"id": "walking", "title": "Zu Fuß & im Raumanzug", "controls": [["W A S D + Maus", "Laufen und umsehen."], ["Space / Strg", "Springen / Jetpack; im freien Raum auf- und absteigen."], ["Shift", "Sprint / Boost."], ["Q / E", "Im freien Raum rollen."], ["L", "Helmlampe umschalten."], ["1 + linke Maustaste halten", "Bohrer wählen und ein Vorkommen abbauen."], ["2 + linke Maustaste", "Blaster wählen und schießen."], ["3 + linke Maustaste halten", "Gewehr benutzen, wenn du eines freigeschaltet hast."], ["4 + linke Maustaste", "Ein Medkit aus dem Rucksack verbrauchen."]]}, {"id": "flying", "title": "Im Pilotensitz", "controls": [["Maus", "Nase des Schiffs steuern."], ["W / S", "Vorwärts / rückwärts; im Warp: Schub erhöhen / senken."], ["A / D", "Seitwärts bewegen."], ["Space / Strg", "Auf- und absteigen."], ["Q / E", "Schiff rollen."], ["X", "Bremsen; im Warp den Schub abschalten."], ["Shift", "Boost im normalen Flug."], ["C halten", "Im System den schnellen Reiseflug aufladen, ungefähr 2 Sekunden."], ["C drücken", "Im Warp die Schubregelung umschalten; im aktiven System-Reiseflug: beenden."], ["G", "Im Warp bei einem Signal aussteigen; nach dem Ausstieg den Warp fortsetzen."], ["Linke / rechte Maustaste", "Schiffswaffe 1 / 2 abfeuern."]]}, {"id": "hud", "title": "Welche Anzeigen sind wichtig?", "cards": [{"title": "HOME ETA", "text": "Eure geschätzte Flugzeit bis nach Hause mit dem eingebauten Antrieb. Bessere Teile sollen diese Zeit senken."}, {"title": "Gesundheit & Sauerstoff", "text": "Zeigen, wie lange du draußen bleiben kannst. Bei knapper Luft frühzeitig zum Schiff zurückkehren."}, {"title": "Hull / Shield / Fuel", "text": "Zustand und normaler Treibstoff deines Schiffs. Exotic Matter ist der getrennte Vorrat für Galaxienwarps."}, {"title": "Markierungen & Warnungen", "text": "Weisen auf Fundstellen, Stationen und Sprungzonen hin. Hinweise in der Bildschirmmitte erklären zum Beispiel, warum ein Sprung blockiert ist."}], "image": {"path": "Docs/screenshots/issue-115/after_ingame_ice.jpg", "alt": "Spielansichten mit Zielanzeige, Kompass sowie Anzug- und Schiffswerten", "caption": "Entwicklungsaufnahme aus #115: Ziel und Navigation oben, persönliche Werte unten links, Schiffswerte unten rechts. Die Anordnung hilft bei der Orientierung; der heutige Build kann abweichen."}}], "images": [], "sources": ["Assets/_Project/Scripts/Core/VwInput.cs", "Assets/_Project/Scripts/UI/HudView.cs", "Assets/_Project/Scripts/Player/PlayerPawn.cs", "Assets/_Project/Scripts/Ship/ShipSeat.cs"], "audience": "player", "search": "\u003c!-- Generated from Tools/Docs/player_guide.json. Do not edit. -->\n\n# Steuerung & Anzeigen\n\n[Visuelles Wiki](index.html) | [Alle Kapitel](README.md)\n\nDie wichtigsten Tasten für deinen nächsten Schritt. Die Belegung ist der Standard; in Settings kannst du sie ändern. Im Spiel angezeigte Tasten haben Vorrang.\n\n**Dein Ziel:** Du findest die richtige Taste und erkennst die Anzeigen, auf die es gerade ankommt.\n\n## Immer nützlich\n\n| Taste / Begriff | Bedeutung |\n| --- | --- |\n| F | Mit dem anvisierten Objekt interagieren; im Sitz: aufstehen. |\n| Tab | Inventory, Ship, Crafting und Warp Drive öffnen. |\n| M | Galaxiekarte öffnen und Reiseziele / Sprungzonen ansehen. |\n| T / mittlere Maustaste | Ein Ziel für die Crew markieren. |\n| Esc | Menü öffnen. |\n\n## Zu Fuß & im Raumanzug\n\n| Taste / Begriff | Bedeutung |\n| --- | --- |\n| W A S D + Maus | Laufen und umsehen. |\n| Space / Strg | Springen / Jetpack; im freien Raum auf- und absteigen. |\n| Shift | Sprint / Boost. |\n| Q / E | Im freien Raum rollen. |\n| L | Helmlampe umschalten. |\n| 1 + linke Maustaste halten | Bohrer wählen und ein Vorkommen abbauen. |\n| 2 + linke Maustaste | Blaster wählen und schießen. |\n| 3 + linke Maustaste halten | Gewehr benutzen, wenn du eines freigeschaltet hast. |\n| 4 + linke Maustaste | Ein Medkit aus dem Rucksack verbrauchen. |\n\n## Im Pilotensitz\n\n| Taste / Begriff | Bedeutung |\n| --- | --- |\n| Maus | Nase des Schiffs steuern. |\n| W / S | Vorwärts / rückwärts; im Warp: Schub erhöhen / senken. |\n| A / D | Seitwärts bewegen. |\n| Space / Strg | Auf- und absteigen. |\n| Q / E | Schiff rollen. |\n| X | Bremsen; im Warp den Schub abschalten. |\n| Shift | Boost im normalen Flug. |\n| C halten | Im System den schnellen Reiseflug aufladen, ungefähr 2 Sekunden. |\n| C drücken | Im Warp die Schubregelung umschalten; im aktiven System-Reiseflug: beenden. |\n| G | Im Warp bei einem Signal aussteigen; nach dem Ausstieg den Warp fortsetzen. |\n| Linke / rechte Maustaste | Schiffswaffe 1 / 2 abfeuern. |\n\n## Welche Anzeigen sind wichtig?\n\n### HOME ETA\n\nEure geschätzte Flugzeit bis nach Hause mit dem eingebauten Antrieb. Bessere Teile sollen diese Zeit senken.\n\n### Gesundheit & Sauerstoff\n\nZeigen, wie lange du draußen bleiben kannst. Bei knapper Luft frühzeitig zum Schiff zurückkehren.\n\n### Hull / Shield / Fuel\n\nZustand und normaler Treibstoff deines Schiffs. Exotic Matter ist der getrennte Vorrat für Galaxienwarps.\n\n### Markierungen & Warnungen\n\nWeisen auf Fundstellen, Stationen und Sprungzonen hin. Hinweise in der Bildschirmmitte erklären zum Beispiel, warum ein Sprung blockiert ist.\n\n![Spielansichten mit Zielanzeige, Kompass sowie Anzug- und Schiffswerten](../../Docs/screenshots/issue-115/after_ingame_ice.jpg)\n\nEntwicklungsaufnahme aus #115: Ziel und Navigation oben, persönliche Werte unten links, Schiffswerte unten rechts. Die Anordnung hilft bei der Orientierung; der heutige Build kann abweichen.\n\n---\n\nQuellenabgleich: 2026-10-17. Kein neuer vollständiger Spieltest.\n\n[VwInput.cs](../../Assets/_Project/Scripts/Core/VwInput.cs) · [HudView.cs](../../Assets/_Project/Scripts/UI/HudView.cs) · [PlayerPawn.cs](../../Assets/_Project/Scripts/Player/PlayerPawn.cs) · [ShipSeat.cs](../../Assets/_Project/Scripts/Ship/ShipSeat.cs)\n"}, {"id": "exploration", "title": "Erkunden, sammeln & überleben", "eyebrow": "Auf Expedition", "summary": "Planeten und Wracks liefern Rohstoffe, Ausrüstung und Teile für den Heimweg. Starte mit einem überschaubaren Ausflug und bringe deine Funde sicher zurück.", "goal": "Du weißt, welche Ziele sich lohnen, wie du Beute bekommst und wann du umkehren solltest.", "sections": [{"id": "destinations", "title": "Was kann ich entdecken?", "cards": [{"title": "Planeten & Fundstellen", "text": "HUD-Markierungen führen unter anderem zu Ruinen, Absturzstellen, Vorratskisten und Rohstoffvorkommen."}, {"title": "Wracks & Asteroidenfelder", "text": "Suche nach Bergungsgut und Kisten. Langsam anfliegen, bevor du dich zum Erkunden aus dem Schiff wagst."}, {"title": "Stationen & Nomaden", "text": "Dort kannst du handeln und Schiffsservice nutzen. Im ersten System am Wormhole Exit gibt es eine Station."}, {"title": "Warden-Enklaven", "text": "Gefährliche Orte mit besonders wertvollen Antriebskernen. Für einen ersten Lernflug ist ein leichteres Ziel die bessere Übung."}]}, {"id": "landing", "title": "Ankommen und sicher aussteigen", "steps": [{"title": "Vor dem Ziel langsamer werden", "text": "Nutze X und beende schnellen Reiseflug. Halte die Oberfläche im Blick und suche eine freie, ebene Stelle."}, {"title": "Sanft sinken", "text": "Steuere mit kleinen Bewegungen. Die schwere Nostos braucht besonders flachen Boden und eine langsame Landung; die Dart eignet sich für kurze Erkundungsflüge."}, {"title": "Erst dann den Sitz verlassen", "text": "F ist auch im Flug die Aussteigen-Taste. Prüfe deshalb zuerst deine Position und Geschwindigkeit. Behalte im Freien Sauerstoff und Rückweg im Blick."}], "result": "Zu Fuß kannst du dich einer Fundstelle nähern und die Interaktionshinweise lesen."}, {"id": "gathering", "title": "Rohstoffe abbauen und Kisten öffnen", "steps": [{"title": "Vorkommen anvisieren", "text": "Gehe nah an Erz, Kristall, Schrott oder eine Treibstoffquelle. Der Hinweis nennt das Material und verweist auf den Drill."}, {"title": "Bohrer benutzen", "text": "Drücke 1. Halte die linke Maustaste auf das Vorkommen, bis du Material erhältst. Der Bohrer ist zum Abbau da, nicht F."}, {"title": "Kisten öffnen", "text": "Schaue aus der Nähe auf eine ungeöffnete Kiste und drücke F bei Open crate. Eine bereits geöffnete Kiste zeigt Empty."}, {"title": "Rucksack prüfen", "text": "Öffne Tab → Inventory. Wenn du am Schiff bist, kannst du Gegenstände auswählen und mit To cargo in den Frachtraum verschieben."}], "related": ["equipment"]}, {"id": "survival", "title": "Luft, Heilung und Gegner", "cards": [{"title": "Luft ist dein Rückweg-Timer", "text": "Außerhalb geschützter Bereiche sinkt dein Sauerstoff. Im Schiff oder in einer atembaren Atmosphäre füllt er sich wieder. Warte mit dem Rückflug nicht bis auf null."}, {"title": "Selbst heilen", "text": "Wähle 4 und drücke die linke Maustaste. Das verbraucht ein Medkit aus deinem Rucksack. Ohne Medkit kannst du keines einsetzen."}, {"title": "Auf Gegner reagieren", "text": "Mit 2 wählst du den Blaster. Das Gewehr auf 3 musst du erst herstellen oder kaufen und freischalten. Markiere Bedrohungen mit T für die anderen."}], "note": "Du musst nicht jeden Gegner bekämpfen. Wenn Vorräte knapp sind, brich die Expedition ab und kehre zum Schiff zurück.", "related": ["help"]}, {"id": "landscapes", "title": "Vom Orbit bis zur Oberfläche", "text": "Die gleiche Welt sieht aus dem Orbit und am Boden sehr unterschiedlich aus. Orientiere dich beim Anflug an der Oberfläche und den HUD-Markierungen; der Kontaktbogen zeigt die unterschiedlichen Betrachtungsabstände.", "image": {"path": "Docs/screenshots/issue-115/provinces_all_biomes.jpg", "alt": "Mehrere Planetentypen jeweils aus Orbit, Anflug und am Boden", "caption": "Entwicklungsaufnahmen aus #115: jede Zeile eine Welt, von links nach rechts näher an der Oberfläche. Die Bilder zeigen Landschaften, keine garantierten Fundorte."}}], "images": [], "sources": ["Assets/_Project/Scripts/Inventory/ResourceNode.cs", "Assets/_Project/Scripts/Inventory/LootCrate.cs", "Assets/_Project/Scripts/Player/PlayerPawn.cs", "Assets/_Project/Scripts/Ship/ShipFlight.cs", "Assets/_Project/Scripts/World/SystemDirector.cs"], "audience": "player", "search": "\u003c!-- Generated from Tools/Docs/player_guide.json. Do not edit. -->\n\n# Erkunden, sammeln & überleben\n\n[Visuelles Wiki](index.html) | [Alle Kapitel](README.md)\n\nPlaneten und Wracks liefern Rohstoffe, Ausrüstung und Teile für den Heimweg. Starte mit einem überschaubaren Ausflug und bringe deine Funde sicher zurück.\n\n**Dein Ziel:** Du weißt, welche Ziele sich lohnen, wie du Beute bekommst und wann du umkehren solltest.\n\n## Was kann ich entdecken?\n\n### Planeten & Fundstellen\n\nHUD-Markierungen führen unter anderem zu Ruinen, Absturzstellen, Vorratskisten und Rohstoffvorkommen.\n\n### Wracks & Asteroidenfelder\n\nSuche nach Bergungsgut und Kisten. Langsam anfliegen, bevor du dich zum Erkunden aus dem Schiff wagst.\n\n### Stationen & Nomaden\n\nDort kannst du handeln und Schiffsservice nutzen. Im ersten System am Wormhole Exit gibt es eine Station.\n\n### Warden-Enklaven\n\nGefährliche Orte mit besonders wertvollen Antriebskernen. Für einen ersten Lernflug ist ein leichteres Ziel die bessere Übung.\n\n## Ankommen und sicher aussteigen\n\n1. **Vor dem Ziel langsamer werden.** Nutze X und beende schnellen Reiseflug. Halte die Oberfläche im Blick und suche eine freie, ebene Stelle.\n\n2. **Sanft sinken.** Steuere mit kleinen Bewegungen. Die schwere Nostos braucht besonders flachen Boden und eine langsame Landung; die Dart eignet sich für kurze Erkundungsflüge.\n\n3. **Erst dann den Sitz verlassen.** F ist auch im Flug die Aussteigen-Taste. Prüfe deshalb zuerst deine Position und Geschwindigkeit. Behalte im Freien Sauerstoff und Rückweg im Blick.\n\n**Das solltest du sehen:** Zu Fuß kannst du dich einer Fundstelle nähern und die Interaktionshinweise lesen.\n\n## Rohstoffe abbauen und Kisten öffnen\n\n1. **Vorkommen anvisieren.** Gehe nah an Erz, Kristall, Schrott oder eine Treibstoffquelle. Der Hinweis nennt das Material und verweist auf den Drill.\n\n2. **Bohrer benutzen.** Drücke 1. Halte die linke Maustaste auf das Vorkommen, bis du Material erhältst. Der Bohrer ist zum Abbau da, nicht F.\n\n3. **Kisten öffnen.** Schaue aus der Nähe auf eine ungeöffnete Kiste und drücke F bei Open crate. Eine bereits geöffnete Kiste zeigt Empty.\n\n4. **Rucksack prüfen.** Öffne Tab → Inventory. Wenn du am Schiff bist, kannst du Gegenstände auswählen und mit To cargo in den Frachtraum verschieben.\n\nWeiterlesen: [Beute nutzen & besser ausrüsten](equipment.md)\n\n## Luft, Heilung und Gegner\n\n### Luft ist dein Rückweg-Timer\n\nAußerhalb geschützter Bereiche sinkt dein Sauerstoff. Im Schiff oder in einer atembaren Atmosphäre füllt er sich wieder. Warte mit dem Rückflug nicht bis auf null.\n\n### Selbst heilen\n\nWähle 4 und drücke die linke Maustaste. Das verbraucht ein Medkit aus deinem Rucksack. Ohne Medkit kannst du keines einsetzen.\n\n### Auf Gegner reagieren\n\nMit 2 wählst du den Blaster. Das Gewehr auf 3 musst du erst herstellen oder kaufen und freischalten. Markiere Bedrohungen mit T für die anderen.\n\n> Du musst nicht jeden Gegner bekämpfen. Wenn Vorräte knapp sind, brich die Expedition ab und kehre zum Schiff zurück.\n\nWeiterlesen: [Ich komme gerade nicht weiter](help.md)\n\n## Vom Orbit bis zur Oberfläche\n\nDie gleiche Welt sieht aus dem Orbit und am Boden sehr unterschiedlich aus. Orientiere dich beim Anflug an der Oberfläche und den HUD-Markierungen; der Kontaktbogen zeigt die unterschiedlichen Betrachtungsabstände.\n\n![Mehrere Planetentypen jeweils aus Orbit, Anflug und am Boden](../../Docs/screenshots/issue-115/provinces_all_biomes.jpg)\n\nEntwicklungsaufnahmen aus #115: jede Zeile eine Welt, von links nach rechts näher an der Oberfläche. Die Bilder zeigen Landschaften, keine garantierten Fundorte.\n\n---\n\nQuellenabgleich: 2026-10-17. Kein neuer vollständiger Spieltest.\n\n[ResourceNode.cs](../../Assets/_Project/Scripts/Inventory/ResourceNode.cs) · [LootCrate.cs](../../Assets/_Project/Scripts/Inventory/LootCrate.cs) · [PlayerPawn.cs](../../Assets/_Project/Scripts/Player/PlayerPawn.cs) · [ShipFlight.cs](../../Assets/_Project/Scripts/Ship/ShipFlight.cs) · [SystemDirector.cs](../../Assets/_Project/Scripts/World/SystemDirector.cs)\n"}, {"id": "equipment", "title": "Beute nutzen & besser ausrüsten", "eyebrow": "Nach der Expedition", "summary": "Beute hilft erst, wenn du sie benutzt. Im Tab-Menü sortierst du den Rucksack, verbesserst dein Schiff, stellst Gegenstände her und rüstest den Warp-Antrieb aus.", "goal": "Du kannst ein gefundenes Teil einbauen, Material ins Cargo legen und Treibstoff richtig zuordnen.", "sections": [{"id": "tabs", "title": "Welcher Reiter macht was?", "cards": [{"title": "Inventory · Rucksack & Cargo", "text": "Gegenstand anklicken. Je nach Typ erscheinen Use oder Install. To cargo lagert ihn am nahen Schiff ein; To backpack holt ihn wieder heraus."}, {"title": "Ship · Dein nahes Schiff", "text": "Module installieren oder entfernen, mit Scrap reparieren und mit Fuel auftanken. Welches Schiff angezeigt wird, hängt davon ab, worin du sitzt oder welchem du nahe bist."}, {"title": "Crafting · Herstellen", "text": "Ein Rezept zeigt benötigte Materialien und deinen Vorrat. Craft funktioniert, wenn die Zutaten im Rucksack liegen und ein Fabricator in Reichweite ist."}, {"title": "Warp Drive · Gemeinsamer Antrieb", "text": "Hier tauscht ihr Antriebsteile und ladet Exotic Matter in den gemeinsamen Tank der Nostos."}]}, {"id": "resources", "title": "Diese Vorräte solltest du unterscheiden", "controls": [["Ore / Crystal / Scrap", "Baumaterialien für Rezepte; Scrap wird auch für Reparaturen genutzt."], ["Fuel", "Normaler Schiffstreibstoff. Im Reiter Ship über Refuel nachfüllen."], ["Exotic Matter", "Treibstoff für den Warp zwischen Galaxien. Im Reiter Warp Drive ausdrücklich in den Tank laden."], ["Salvage", "Währung für Handel und Schiffsservice während des Runs."], ["Memory fragments", "Fortschritt über den einzelnen Run hinaus; im Hangar für Freischaltungen nutzbar."]]}, {"id": "drive", "title": "So verkürzt du den Heimweg", "steps": [{"title": "Ein Antriebsteil finden oder kaufen", "text": "Du suchst Warp Core, Nav Computer, Cooling und Exotic Tank. Kerne gibt es besonders in Warden-Enklaven, andere Teile auch in Kisten, Wracks oder bei Händlern."}, {"title": "Mit dem Teil zur Nostos zurückkehren", "text": "Nimm es in den Rucksack, setze dich in die Nostos oder gehe an Bord und nutze den Antrieb im Maschinenraum. In einer laufenden Warpstrecke kannst du keine Teile tauschen."}, {"title": "Tab → Warp Drive öffnen", "text": "Vergleiche die angezeigte Home ETA mit dem gefundenen Teil. Klicke Install beim gewünschten Teil. Das alte Teil erhältst du zurück."}, {"title": "Die Komponenten zusammen verbessern", "text": "Core bestimmt die mögliche Geschwindigkeit. Nav bestimmt den sicheren Schub in Feldern, Cooling den dauerhaft möglichen Schub. Ein großer Tank ermöglicht längere Warps, macht euch allein aber nicht schneller."}], "result": "Die Home ETA zeigt den Effekt eurer Ausrüstung. Ein schneller Kern lässt sich mit passender Navigation und Kühlung besser nutzen."}, {"id": "fuel", "title": "Exotic Matter ist im Rucksack – reicht das?", "steps": [{"title": "Zur Nostos gehen", "text": "Zum Laden des gemeinsamen Antriebs musst du an oder in der Nostos sein."}, {"title": "Den Tank wirklich befüllen", "text": "Tab → Warp Drive → Load Exotic Matter. Die Zahl im Tank steigt, dein Rucksackvorrat sinkt."}, {"title": "Vor dem Galaxienwechsel prüfen", "text": "Vergleiche den Tankinhalt mit next warp needs. Ist der Tank selbst zu klein, brauchst du einen größeren Exotic Tank."}], "note": "Cargo, Rucksack und Warp-Tank sind verschiedene Aufbewahrungsorte. Material im Cargo musst du für diese Aktionen zuerst in den Rucksack holen.", "related": ["travel", "help"]}, {"id": "trade", "title": "Handeln & reparieren", "text": "Gehe an einer Station zum Handelsterminal, schaue darauf und drücke F bei Trade. Du kannst Waren kaufen, Rucksackgegenstände verkaufen und den angebotenen Schiffsservice gegen Salvage nutzen. Alternativ reparierst du das nahe Schiff im Reiter Ship mit Scrap und tankst mit Fuel nach."}], "images": [], "sources": ["Assets/_Project/Scripts/UI/InventoryView.cs", "Assets/_Project/Scripts/World/WarpDrive.cs", "Assets/_Project/Scripts/UI/TradeView.cs", "Assets/_Project/Scripts/Inventory/PlayerGear.cs", "Assets/_Project/Scripts/Progression/Meta.cs"], "audience": "player", "search": "\u003c!-- Generated from Tools/Docs/player_guide.json. Do not edit. -->\n\n# Beute nutzen & besser ausrüsten\n\n[Visuelles Wiki](index.html) | [Alle Kapitel](README.md)\n\nBeute hilft erst, wenn du sie benutzt. Im Tab-Menü sortierst du den Rucksack, verbesserst dein Schiff, stellst Gegenstände her und rüstest den Warp-Antrieb aus.\n\n**Dein Ziel:** Du kannst ein gefundenes Teil einbauen, Material ins Cargo legen und Treibstoff richtig zuordnen.\n\n## Welcher Reiter macht was?\n\n### Inventory · Rucksack & Cargo\n\nGegenstand anklicken. Je nach Typ erscheinen Use oder Install. To cargo lagert ihn am nahen Schiff ein; To backpack holt ihn wieder heraus.\n\n### Ship · Dein nahes Schiff\n\nModule installieren oder entfernen, mit Scrap reparieren und mit Fuel auftanken. Welches Schiff angezeigt wird, hängt davon ab, worin du sitzt oder welchem du nahe bist.\n\n### Crafting · Herstellen\n\nEin Rezept zeigt benötigte Materialien und deinen Vorrat. Craft funktioniert, wenn die Zutaten im Rucksack liegen und ein Fabricator in Reichweite ist.\n\n### Warp Drive · Gemeinsamer Antrieb\n\nHier tauscht ihr Antriebsteile und ladet Exotic Matter in den gemeinsamen Tank der Nostos.\n\n## Diese Vorräte solltest du unterscheiden\n\n| Taste / Begriff | Bedeutung |\n| --- | --- |\n| Ore / Crystal / Scrap | Baumaterialien für Rezepte; Scrap wird auch für Reparaturen genutzt. |\n| Fuel | Normaler Schiffstreibstoff. Im Reiter Ship über Refuel nachfüllen. |\n| Exotic Matter | Treibstoff für den Warp zwischen Galaxien. Im Reiter Warp Drive ausdrücklich in den Tank laden. |\n| Salvage | Währung für Handel und Schiffsservice während des Runs. |\n| Memory fragments | Fortschritt über den einzelnen Run hinaus; im Hangar für Freischaltungen nutzbar. |\n\n## So verkürzt du den Heimweg\n\n1. **Ein Antriebsteil finden oder kaufen.** Du suchst Warp Core, Nav Computer, Cooling und Exotic Tank. Kerne gibt es besonders in Warden-Enklaven, andere Teile auch in Kisten, Wracks oder bei Händlern.\n\n2. **Mit dem Teil zur Nostos zurückkehren.** Nimm es in den Rucksack, setze dich in die Nostos oder gehe an Bord und nutze den Antrieb im Maschinenraum. In einer laufenden Warpstrecke kannst du keine Teile tauschen.\n\n3. **Tab → Warp Drive öffnen.** Vergleiche die angezeigte Home ETA mit dem gefundenen Teil. Klicke Install beim gewünschten Teil. Das alte Teil erhältst du zurück.\n\n4. **Die Komponenten zusammen verbessern.** Core bestimmt die mögliche Geschwindigkeit. Nav bestimmt den sicheren Schub in Feldern, Cooling den dauerhaft möglichen Schub. Ein großer Tank ermöglicht längere Warps, macht euch allein aber nicht schneller.\n\n**Das solltest du sehen:** Die Home ETA zeigt den Effekt eurer Ausrüstung. Ein schneller Kern lässt sich mit passender Navigation und Kühlung besser nutzen.\n\n## Exotic Matter ist im Rucksack – reicht das?\n\n1. **Zur Nostos gehen.** Zum Laden des gemeinsamen Antriebs musst du an oder in der Nostos sein.\n\n2. **Den Tank wirklich befüllen.** Tab → Warp Drive → Load Exotic Matter. Die Zahl im Tank steigt, dein Rucksackvorrat sinkt.\n\n3. **Vor dem Galaxienwechsel prüfen.** Vergleiche den Tankinhalt mit next warp needs. Ist der Tank selbst zu klein, brauchst du einen größeren Exotic Tank.\n\n> Cargo, Rucksack und Warp-Tank sind verschiedene Aufbewahrungsorte. Material im Cargo musst du für diese Aktionen zuerst in den Rucksack holen.\n\nWeiterlesen: [Weiterreisen & nach Hause kommen](travel.md) · [Ich komme gerade nicht weiter](help.md)\n\n## Handeln & reparieren\n\nGehe an einer Station zum Handelsterminal, schaue darauf und drücke F bei Trade. Du kannst Waren kaufen, Rucksackgegenstände verkaufen und den angebotenen Schiffsservice gegen Salvage nutzen. Alternativ reparierst du das nahe Schiff im Reiter Ship mit Scrap und tankst mit Fuel nach.\n\n---\n\nQuellenabgleich: 2026-10-17. Kein neuer vollständiger Spieltest.\n\n[InventoryView.cs](../../Assets/_Project/Scripts/UI/InventoryView.cs) · [WarpDrive.cs](../../Assets/_Project/Scripts/World/WarpDrive.cs) · [TradeView.cs](../../Assets/_Project/Scripts/UI/TradeView.cs) · [PlayerGear.cs](../../Assets/_Project/Scripts/Inventory/PlayerGear.cs) · [Meta.cs](../../Assets/_Project/Scripts/Progression/Meta.cs)\n"}, {"id": "nostos", "title": "Nostos, Dart & Zusammenspiel", "eyebrow": "Eure gemeinsame Basis", "summary": "Die Nostos bringt die Crew nach Hause. Die kleinen Darts sind eure Erkundungsschiffe. Du kannst zwischen Fliegen, Bordarbeit und Expeditionen wechseln.", "goal": "Du findest dich an Bord zurecht und weißt, welches Schiff welche Aufgabe erfüllt.", "sections": [{"id": "ships", "title": "Welches Schiff benutze ich wofür?", "cards": [{"title": "Dart · Der kurze Ausflug", "text": "Persönliches kleines Schiff zum Erkunden und Kämpfen. Du startest angedockt an der Nostos und kannst dort wieder anlegen."}, {"title": "Nostos · Gemeinsam weiterreisen", "text": "Gemeinsames Heimatschiff mit Brücke, Frachtraum, Fabricator, Kryo-Bucht und Warp-Antrieb. Ihr Pilot löst die Sprünge der Crew aus."}], "note": "Eine Dart allein öffnet keine Sprungzone, solange die Nostos vorhanden ist. Für den nächsten System- oder Galaxiensprung setzt sich jemand an ihr Steuer."}, {"id": "rooms", "title": "Wo finde ich was an Bord?", "flow": ["Heck: Maschinenraum", "Frachtraum", "Kryo-Bucht", "Bug: Brücke"], "cards": [{"title": "Maschinenraum", "text": "Warp-Antrieb und Antriebsterminal, Ingenieurstation sowie hinteres Geschütz."}, {"title": "Frachtraum", "text": "Cargo, Fabricator, Luftschleuse und Zugänge zu den Andockklammern der Darts."}, {"title": "Kryo-Bucht", "text": "Hier wachen gefallene Crewmitglieder wieder auf, solange Kryo-Ladungen verfügbar sind."}, {"title": "Brücke", "text": "Am Pilotensitz erscheint Take the helm. Außerdem gibt es ein vorderes Geschütz."}]}, {"id": "docking", "title": "Starten, andocken und ins Innere wechseln", "steps": [{"title": "Starten", "text": "Sitze in deiner angedockten Dart und halte W ungefähr eine Sekunde. Sie löst sich von der Klammer. Im Warp kannst du nicht abdocken."}, {"title": "Wieder anlegen", "text": "Fliege langsam an eine freie Andockklammer der Nostos. Bei höchstens etwa 14 m/s Relativgeschwindigkeit und unter etwa 16 m Abstand kann die Klammer die Dart automatisch greifen. Wenn es nicht klappt: abbremsen und vorsichtig neu anfliegen."}, {"title": "An Bord aussteigen", "text": "Während die Dart angedockt ist, führt F aus dem Sitz zum Zugang im Inneren der Nostos. Willst du draußen frei aussteigen, achte vorher auf Geschwindigkeit und Sauerstoff."}]}, {"id": "crew", "title": "Was können die anderen währenddessen tun?", "cards": [{"title": "Pilot", "text": "Steuert die Nostos, fliegt Sprungzonen an und führt die Warpstrecke."}, {"title": "Geschütz", "text": "An einem freien Geschütz mit F Platz nehmen und die Crew gegen Bedrohungen unterstützen."}, {"title": "Ingenieur & Expedition", "text": "Station bedienen, Vorräte organisieren, Teile einbauen oder außerhalb des Warps auf Erkundung gehen. Rollen sind keine dauerhafte Klassenwahl."}], "result": "Auch allein kannst du Rollen wechseln. Im Co-op hilft es, vor Abflug kurz zu klären, wer fliegt und ob alle wieder an Bord sind."}], "images": [], "sources": ["Assets/_Project/Editor/NostosBuilder.cs", "Assets/_Project/Scripts/Ship/ShipSeat.cs", "Assets/_Project/Scripts/Ship/ShipFlight.cs", "Assets/_Project/Scripts/Ship/DockClamp.cs", "Assets/_Project/Scripts/World/WarpFlight.Jumps.cs"], "audience": "player", "search": "\u003c!-- Generated from Tools/Docs/player_guide.json. Do not edit. -->\n\n# Nostos, Dart & Zusammenspiel\n\n[Visuelles Wiki](index.html) | [Alle Kapitel](README.md)\n\nDie Nostos bringt die Crew nach Hause. Die kleinen Darts sind eure Erkundungsschiffe. Du kannst zwischen Fliegen, Bordarbeit und Expeditionen wechseln.\n\n**Dein Ziel:** Du findest dich an Bord zurecht und weißt, welches Schiff welche Aufgabe erfüllt.\n\n## Welches Schiff benutze ich wofür?\n\n### Dart · Der kurze Ausflug\n\nPersönliches kleines Schiff zum Erkunden und Kämpfen. Du startest angedockt an der Nostos und kannst dort wieder anlegen.\n\n### Nostos · Gemeinsam weiterreisen\n\nGemeinsames Heimatschiff mit Brücke, Frachtraum, Fabricator, Kryo-Bucht und Warp-Antrieb. Ihr Pilot löst die Sprünge der Crew aus.\n\n> Eine Dart allein öffnet keine Sprungzone, solange die Nostos vorhanden ist. Für den nächsten System- oder Galaxiensprung setzt sich jemand an ihr Steuer.\n\n## Wo finde ich was an Bord?\n\n### Maschinenraum\n\nWarp-Antrieb und Antriebsterminal, Ingenieurstation sowie hinteres Geschütz.\n\n### Frachtraum\n\nCargo, Fabricator, Luftschleuse und Zugänge zu den Andockklammern der Darts.\n\n### Kryo-Bucht\n\nHier wachen gefallene Crewmitglieder wieder auf, solange Kryo-Ladungen verfügbar sind.\n\n### Brücke\n\nAm Pilotensitz erscheint Take the helm. Außerdem gibt es ein vorderes Geschütz.\n\nHeck: Maschinenraum → Frachtraum → Kryo-Bucht → Bug: Brücke\n\n## Starten, andocken und ins Innere wechseln\n\n1. **Starten.** Sitze in deiner angedockten Dart und halte W ungefähr eine Sekunde. Sie löst sich von der Klammer. Im Warp kannst du nicht abdocken.\n\n2. **Wieder anlegen.** Fliege langsam an eine freie Andockklammer der Nostos. Bei höchstens etwa 14 m/s Relativgeschwindigkeit und unter etwa 16 m Abstand kann die Klammer die Dart automatisch greifen. Wenn es nicht klappt: abbremsen und vorsichtig neu anfliegen.\n\n3. **An Bord aussteigen.** Während die Dart angedockt ist, führt F aus dem Sitz zum Zugang im Inneren der Nostos. Willst du draußen frei aussteigen, achte vorher auf Geschwindigkeit und Sauerstoff.\n\n## Was können die anderen währenddessen tun?\n\n### Pilot\n\nSteuert die Nostos, fliegt Sprungzonen an und führt die Warpstrecke.\n\n### Geschütz\n\nAn einem freien Geschütz mit F Platz nehmen und die Crew gegen Bedrohungen unterstützen.\n\n### Ingenieur & Expedition\n\nStation bedienen, Vorräte organisieren, Teile einbauen oder außerhalb des Warps auf Erkundung gehen. Rollen sind keine dauerhafte Klassenwahl.\n\n**Das solltest du sehen:** Auch allein kannst du Rollen wechseln. Im Co-op hilft es, vor Abflug kurz zu klären, wer fliegt und ob alle wieder an Bord sind.\n\n---\n\nQuellenabgleich: 2026-10-17. Kein neuer vollständiger Spieltest.\n\n[NostosBuilder.cs](../../Assets/_Project/Editor/NostosBuilder.cs) · [ShipSeat.cs](../../Assets/_Project/Scripts/Ship/ShipSeat.cs) · [ShipFlight.cs](../../Assets/_Project/Scripts/Ship/ShipFlight.cs) · [DockClamp.cs](../../Assets/_Project/Scripts/Ship/DockClamp.cs) · [WarpFlight.Jumps.cs](../../Assets/_Project/Scripts/World/WarpFlight.Jumps.cs)\n"}, {"id": "travel", "title": "Weiterreisen & nach Hause kommen", "eyebrow": "Der nächste große Schritt", "summary": "Du klickst keinen Warp-Knopf. Du steuerst die Nostos durch eine Sprungzone mkehr-Ergebnisbildschirm."}], "images": [], "sources": ["Assets/_Project/Scripts/World/WarpFlight.Jumps.cs", "Assets/_Project/Scripts/Core/JumpZones.cs", "Assets/_Project/Scripts/Ship/ShipFlight.cs", "Assets/_Project/Scripts/World/WarpFlight.cs", "Assets/_Project/Scripts/UI/HudView.cs"], "audience": "player", "search": "\u003c!-- Generated from Tools/Docs/player_guide.json. Do not edit. -->\n\n# Weiterreisen & nach Hause kommen\n\n[Visuelles Wiki](index.html) | [Alle Kapitel](README.md)\n\nDu klickst keinen Warp-Knopf. Du steuerst die Nostos durch eine Sprungzone am Systemrand. Die Reise selbst fliegst du anschließend weiter.\n\n**Dein Ziel:** Du unterscheidest normalen Flug, schnellen Reiseflug und Warp – und kannst einen Sprung vorbereiten.\n\n## Drei Arten zu fliegen\n\n### Normaler Flug\n\nFür Start, Landung, Andocken und Kämpfe. Kleine, kontrollierte Bewegungen statt Höchstgeschwindigkeit.\n\n### System-Reiseflug\n\nHalte C ungefähr 2 Sekunden: Das Schiff beschleunigt für weite Strecken innerhalb des Systems. X, S oder C beenden ihn. Planeten, Hindernisse und Gefechte können ihn ebenfalls beenden.\n\n### Warp\n\nEin geflogener Korridor zum Nachbarsystem oder zur nächsten Galaxie. W / S steuern hier den Schub; C regelt ihn automatisch, G nutzt passende Signale.\n\n## Einen Sprung vorbereiten\n\n1. **Ziel auf M ansehen.** Die Galaxiekarte zeigt Systeme und die zugehörigen Sprungzonen. Nachbarsysteme erreichst du über deren Zone. Galactic Rim und die Skip-Zone gibt es nur im äußersten System der Galaxie.\n\n2. **Crew einsammeln.** Alle lebenden Crewmitglieder müssen in einem Schiff sitzen oder im geschützten Innenraum stehen. Wer noch draußen ist, blockiert den Sprung.\n\n3. **Die Nostos steuern.** Setze dich mit F an ihr Steuer. Eine freie Dart löst den Sprung nicht aus. Für Galaxienwarps muss außerdem genug Exotic Matter im gemeinsamen Tank sein.\n\n4. **Aus der Schwerkraft und aus dem Gefecht kommen.** Fliege aus dem Schwerkraftbereich des Planeten und löse dich von angreifenden Gegnern. Lies bei einer Blockade den Grund in der Bildschirmmitte.\n\nWeiterlesen: [Nostos, Dart & Zusammenspiel](nostos.md) · [Beute nutzen & besser ausrüsten](equipment.md) · [Ich komme gerade nicht weiter](help.md)\n\n## Durch die Sprungzone fliegen\n\n1. **Markierung anfliegen.** Suche im HUD die Zone zum gewünschten Ziel und fliege die Nostos dorthin.\n\n2. **Nach außen ausrichten.** Durchquere die Zonenebene im Reiseflug nach außen. Alternativ halte innerhalb der Zone die Nase etwa 3 Sekunden nach außen, bis ALIGNING vollständig ist.\n\n3. **Einflug abwarten.** Bei WARP ENTRY beginnt der Übergang. Die Crew geht gemeinsam in die Warpstrecke; freie kleine Schiffe werden für die Reise an die Nostos geholt.\n\n**Das solltest du sehen:** Ein Sprung zum Nachbarsystem benötigt kein Exotic Matter. Ein Galaxienwarp verbraucht es und führt in eine Richtung weiter.\n\n## Was tue ich während des Warps?\n\n1. **Schub und Hindernisse beobachten.** W erhöht, S senkt den Schub; mit der Maus lenkst du seitlich an Hindernissen vorbei. X nimmt den Schub heraus. Kollisionen können schaden und einen Notstopp auslösen.\n\n2. **Hitze kontrollieren.** Zu viel Schub über längere Zeit überhitzt den Antrieb. Nimm rechtzeitig Schub zurück. Bessere Kühlung erlaubt dauerhaft mehr Leistung, bessere Navigation hilft in Feldern.\n\n3. **Reiseautomatik bewusst nutzen.** C hält den Warpschub und schaltet sich bei der nächsten Hinderniswarnung ab. Bleibe deshalb aufmerksam.\n\n4. **Ein Signal besuchen.** Wenn ein erreichbares Signal angezeigt wird, kann der führende Pilot mit G den Warp verlassen. Nach der Erkundung bringt G die Crew nach einem kurzen Countdown zurück auf die Strecke.\n\n> Nahe Gegner oder gegnerische Treffer können den Warp unterbrechen. Kümmere dich um die Bedrohung, statt nur mehr Schub zu geben.\n\n## Der lange Weg nach Sol\n\nErkunde eine Galaxie, verbessere den Antrieb und senke die Home ETA. Von der LMC geht es auf den letzten Flug nach Hause. Dort jagt euch der Rift: Abstand halten und Hindernisse durchfliegen; Ausstiege sind während der Verfolgung gesperrt.\n\nM33 → M31 → NGC 6822 → Leo I → LMC → Sol\n\n> Die vollständige Erdannäherung und Landung gehören noch zum geplanten Ausbau. Der dokumentierte spielbare Abschluss ist derzeit ein Heimkehr-Ergebnisbildschirm.\n\n---\n\nQuellenabgleich: 2026-10-17. Kein neuer vollständiger Spieltest.\n\n[WarpFlight.Jumps.cs](../../Assets/_Project/Scripts/World/WarpFlight.Jumps.cs) · [JumpZones.cs](../../Assets/_Project/Scripts/Core/JumpZones.cs) · [ShipFlight.cs](../../Assets/_Project/Scripts/Ship/ShipFlight.cs) · [WarpFlight.cs](../../Assets/_Project/Scripts/World/WarpFlight.cs) · [HudView.cs](../../Assets/_Project/Scripts/UI/HudView.cs)\n"}, {"id": "help", "title": "Ich komme gerade nicht weiter", "eyebrow": "Hilfe im Spiel", "summary": "Beginne mit dem sichtbaren Problem. Hier findest du kurze Ursachen und den nächsten sinnvollen Schritt – ohne Entwicklerbegriffe.", "goal": "Du kannst häufige Blockaden lösen und weißt, was bei Tod, Schiffsverlust und einer Spielpause passiert.", "sections": [{"id": "cannot-jump", "title": "Die Sprungzone lässt mich nicht durch", "cards": [{"title": "Ich sitze in der Dart", "text": "Wechsle auf die Nostos und übernimm dort das Steuer. Solange sie existiert, führt sie die Sprünge an."}, {"title": "Crew fehlt", "text": "Hole alle lebenden Mitspieler an Bord. Im Innenraum der Nostos dürfen sie stehen; sie müssen nicht alle einen Sitz belegen."}, {"title": "Exotic Matter fehlt", "text": "Tab → Warp Drive öffnen und an der Nostos Load Exotic Matter benutzen. Vorräte im Cargo oder Rucksack zählen noch nicht als Tankinhalt."}, {"title": "Tank zu klein", "text": "Ein größerer Exotic Tank ist nötig. Mehr Material im Rucksack vergrößert den Tank nicht."}, {"title": "Schwerkraft / Kampf", "text": "Entferne dich vom Planeten oder löse die Bedrohung durch angreifende Gegner. Lies den konkreten Grund bei JUMP ZONE HOLDS."}, {"title": "Die Ausrichtung fehlt", "text": "Fliege die richtige Zone nach außen durch oder halte darin die Nase nach außen. Achte auf ALIGNING und anschließend WARP ENTRY."}], "related": ["travel"]}, {"id": "cannot-use", "title": "Interagieren, Craften oder Einbauen klappt nicht", "cards": [{"title": "Kein [F]-Hinweis", "text": "Gehe näher an das Objekt und schaue direkt darauf. Sitze und Terminals sind kleine Ziele. Besetzte Sitze kannst du nicht übernehmen."}, {"title": "Craft ist ausgegraut", "text": "Prüfe die Zutaten im Rucksack und ob ein Fabricator in Reichweite ist. Teile im Cargo zuerst über To backpack holen."}, {"title": "Antriebsteil wird abgewiesen", "text": "Gehe zur Nostos und beende zuerst die Warpstrecke. Antriebsteile kannst du unterwegs im Warp nicht tauschen."}, {"title": "Gewehr auf 3 fehlt", "text": "Es ist kein Startwerkzeug. Stelle es her oder kaufe es und benutze es über Use im Rucksack."}, {"title": "Medkit tut nichts", "text": "Du brauchst ein Medkit im Rucksack. 4 wählt die Funktion, erst die linke Maustaste setzt eines ein."}, {"title": "Schneller Flug bricht ab", "text": "Hindernisse, Planetennähe, Treffer oder ein Gefecht können den System-Reiseflug beenden. Zuerst Abstand und eine freie Flugbahn schaffen."}]}, {"id": "death", "title": "Was passiert, wenn ich sterbe?", "steps": [{"title": "Kryo-Ladung vorhanden", "text": "Ein gefallener Spieler wacht nach einer kurzen Wartezeit normalerweise in seiner Kryo-Kapsel an Bord der Nostos auf. Dabei wird eine gemeinsame Kryo-Ladung verbraucht. CRYO zeigt den Vorrat."}, {"title": "Die eigene Dart ist zerstört", "text": "Nach ungefähr 20 Sekunden wird eine Ersatz-Dart bereitgestellt. Wenn eine Klammer frei ist, wartet sie dort an der Nostos."}, {"title": "Der Run ist verloren", "text": "Sind alle Crewmitglieder endgültig verloren, wird die Nostos zerstört oder holt euch der Rift ein, endet die Reise. Im Logbuch startet der Host mit New Loop den nächsten Durchlauf."}], "note": "Die Kryo-Ladungen sind ein begrenzter gemeinsam sst mich nicht durch\n\n### Ich sitze in der Dart\n\nWechsle auf die Nostos und übernimm dort das Steuer. Solange sie existiert, führt sie die Sprünge an.\n\n### Crew fehlt\n\nHole alle lebenden Mitspieler an Bord. Im Innenraum der Nostos dürfen sie stehen; sie müssen nicht alle einen Sitz belegen.\n\n### Exotic Matter fehlt\n\nTab → Warp Drive öffnen und an der Nostos Load Exotic Matter benutzen. Vorräte im Cargo oder Rucksack zählen noch nicht als Tankinhalt.\n\n### Tank zu klein\n\nEin größerer Exotic Tank ist nötig. Mehr Material im Rucksack vergrößert den Tank nicht.\n\n### Schwerkraft / Kampf\n\nEntferne dich vom Planeten oder löse die Bedrohung durch angreifende Gegner. Lies den konkreten Grund bei JUMP ZONE HOLDS.\n\n### Die Ausrichtung fehlt\n\nFliege die richtige Zone nach außen durch oder halte darin die Nase nach außen. Achte auf ALIGNING und anschließend WARP ENTRY.\n\nWeiterlesen: [Weiterreisen & nach Hause kommen](travel.md)\n\n## Interagieren, Craften oder Einbauen klappt nicht\n\n### Kein [F]-Hinweis\n\nGehe näher an das Objekt und schaue direkt darauf. Sitze und Terminals sind kleine Ziele. Besetzte Sitze kannst du nicht übernehmen.\n\n### Craft ist ausgegraut\n\nPrüfe die Zutaten im Rucksack und ob ein Fabricator in Reichweite ist. Teile im Cargo zuerst über To backpack holen.\n\n### Antriebsteil wird abgewiesen\n\nGehe zur Nostos und beende zuerst die Warpstrecke. Antriebsteile kannst du unterwegs im Warp nicht tauschen.\n\n### Gewehr auf 3 fehlt\n\nEs ist kein Startwerkzeug. Stelle es her oder kaufe es und benutze es über Use im Rucksack.\n\n### Medkit tut nichts\n\nDu brauchst ein Medkit im Rucksack. 4 wählt die Funktion, erst die linke Maustaste setzt eines ein.\n\n### Schneller Flug bricht ab\n\nHindernisse, Planetennähe, Treffer oder ein Gefecht können den System-Reiseflug beenden. Zuerst Abstand und eine freie Flugbahn schaffen.\n\n## Was passiert, wenn ich sterbe?\n\n1. **Kryo-Ladung vorhanden.** Ein gefallener Spieler wacht nach einer kurzen Wartezeit normalerweise in seiner Kryo-Kapsel an Bord der Nostos auf. Dabei wird eine gemeinsame Kryo-Ladung verbraucht. CRYO zeigt den Vorrat.\n\n2. **Die eigene Dart ist zerstört.** Nach ungefähr 20 Sekunden wird eine Ersatz-Dart bereitgestellt. Wenn eine Klammer frei ist, wartet sie dort an der Nostos.\n\n3. **Der Run ist verloren.** Sind alle Crewmitglieder endgültig verloren, wird die Nostos zerstört oder holt euch der Rift ein, endet die Reise. Im Logbuch startet der Host mit New Loop den nächsten Durchlauf.\n\n> Die Kryo-Ladungen sind ein begrenzter gemeinsamer Vorrat. Memory fragments und Freischaltungen gehören zum Fortschritt, den du über einzelne Runs hinaus behältst.\n\n## Kann ich eine Pause machen?\n\nDer Host speichert die Reise automatisch beim Eintritt in eine Galaxie und beim Verlassen der Sitzung. In der Lobby setzt Continue Run diesen Spielstand fort. Bei einem beendeten Run wird der Fortsetzungs-Spielstand gelöscht.\n\n> Ein Speichern während einer Warpstrecke setzt die Crew beim Fortsetzen vor diese Warpstrecke zurück. Es ist kein freies Quicksave-System.\n\nWeiterlesen: [Deine erste Expedition](first-steps.md)\n\n## Was ist schon spielbar?\n\nDie Anleitungen wurden am 17.10.2026 mit dem lokalen Code und den Projektnotizen abgeglichen. Das ist kein neuer kompletter Solo- oder Multiplayer-Spieltest.\n\n### Jetzt beschrieben\n\nErkunden, abbauen, looten, kämpfen, handeln, craften, die Nostos nutzen, den Antrieb verbessern, geflogene Sprünge und der finale Flug mit dem Rift.\n\n### Noch im Ausbau\n\nStory-Intro, der spielbare Prolog und die vollständige Erdlandung sind im dokumentierten Stand noch nicht fertig. Die Hilfen versprechen diese Szenen nicht.\n\n---\n\nQuellenabgleich: 2026-10-17. Kein neuer vollständiger Spieltest.\n\n[RunManager.cs](../../Assets/_Project/Scripts/World/RunManager.cs) · [WarpDrive.cs](../../Assets/_Project/Scripts/World/WarpDrive.cs) · [RunSave.cs](../../Assets/_Project/Scripts/World/RunSave.cs) · [PlayerGear.cs](..   if(anchor){
    const target=document.getElementById(anchor);
    if(target && $('#main').contains(target)){
      if(target.tagName==='DETAILS')target.open=true;
      target.scrollIntoView({block:'start'});
    }
  }else if(samePage)window.scrollTo(0,0);
  closeMenu();
}
function closeMenu(){ $('#sidebar').classList.remove('open'); $('#menu').setAttribute('aria-expanded','false'); syncMenuAccessibility(); }
function openSearch(){ lastFocus=document.activeElement; $('#search-dialog').showModal(); $('#search').focus(); search(); }
function search(){
  const query=$('#search').value.trim().toLocaleLowerCase('de');
  const terms=query.split(/\s+/).filter(Boolean);
  const results=[...playerPages,...developerPages].filter(p=>terms.every(term=>(p.title+' '+p.summary+' '+p.search+' '+p.images.map(i=>i.caption).join(' ')).toLocaleLowerCase('de').includes(term)));
  $('#results').innerHTML=results.length?results.map(p=>{
    const text=p.search.replace(/<!--[^]*?-->/g,'').replace(/[#*`]/g,'').replace(/\s+/g,' ');
    const position=query?Math.max(0,text.toLocaleLowerCase('de').indexOf(terms[0])-60):0;
    const snippet=query?text.slice(position,position+190):p.summary;
    return `<a class="result" href="#${p.id}" data-result><small class="result-audience">${p.audience==='player'?'Spielen':'Entwickeln'}</small><strong>${esc(p.title)}</strong><p>${esc(snippet)}${query?' …':''}</p></a>`;
  }).join(''):'<p class="search-empty">Keine Treffer. Versuche einen anderen Begriff, zum Beispiel „warp“, „cryo“ oder „planet“.</p>';
}
$('#open-search').addEventListener('click',openSearch);
$('#search').addEventListener('input',search);
$('#menu').addEventListener('click',()=>{const open=$('#sidebar').classList.toggle('open');$('#menu').setAttribute('aria-expanded',String(open));syncMenuAccessibility();});
$('#theme').addEventListener('click',()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';setTheme(theme);try{localStorage.setItem('voidward-wiki-theme',theme);}catch{}});
function setTheme(theme){document.documentElement.dataset.theme=theme;$('#theme').textContent=theme==='dark'?'Hell':'Dunkel';}
try{setTheme(localStorage.getItem('voidward-wiki-theme')||'light');}catch{setTheme('light');}
document.addEventListener('keydown',event=>{
  if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(!$('#search-dialog').open&&!$('#lightbox').open)openSearch();}
  if(event.key==='Escape')closeMenu();
});
document.addEventListener('click',event=>{
  if(event.target.closest('.skip')){event.preventDefault();$('#main').focus();return;}
  const close=event.target.closest('[data-close]');
  if(close){document.getElementById(close.dataset.close).close();return;}
  const image=event.target.closest('[data-image]');
  if(image){const item=gallery[Number(image.dataset.image)];lastFocus=image;$('#large-image').src=imagePath(item.path);$('#large-image').alt=item.alt;$('#large-caption').textContent=item.caption;$('#lightbox').showModal();return;}
  const source=event.target.closest('[data-page]');
  if(source){event.preventDefault();location.hash=source.dataset.page;}
  if(event.target.closest('[data-result]'))$('#search-dialog').close();
  if(event.target.closest('#expand'))document.querySelectorAll('.reference details').forEach(detail=>detail.open=true);
  if(event.target.closest('#collapse'))document.querySelectorAll('.reference details').forEach(detail=>detail.open=false);
  if(!event.target.closest('.sidebar')&&!event.target.closest('#menu'))closeMenu();
});
for(const dialog of document.querySelectorAll('dialog')){
  dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();}});
  dialog.addEventListener('close',()=>{if(lastFocus&&document.contains(lastFocus))lastFocus.focus();});
}
window.addEventListener('hashchange',navigate);
window.addEventListener('beforeprint',()=>document.querySelectorAll('details').forEach(d=>{d.dataset.printOpen=String(d.open);d.open=true;}));
window.addEventListener('afterprint',()=>document.querySelectorAll('details').forEach(d=>d.open=d.dataset.printOpen==='true'));
navigate();
</script>
</body>
</html>
